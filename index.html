$('stage').addEventListener('pointermove',e=>{
  if(!drag) return; drag.dx=e.clientX-drag.x0; drag.dy=e.clientY-drag.y0;
  if(!drag.axis){ if(Math.abs(drag.dx)<3&&Math.abs(drag.dy)<3) return;
    drag.axis=(Math.abs(drag.dx)>=Math.abs(drag.dy)*0.7)?'x':'y';
    clearTimeout(AS.holdT); }        /* bewegen = geen lange druk meer */
  /* v11.5 §38.5 — naar RECHTS vegen zet de autoscroll stil zolang je drukt en veegt.
     Lang indrukken (§29.8) blijft ook werken; asRelease() zet hem daarna weer in gang. */
  if(AS.on && drag.axis==='x' && drag.dx>6 && !AS.hold){
    AS.hold=true; AS.holdWasPlaying=AS.playing; if(AS.playing) asPause(true); }   /* zacht */
  if(drag.axis==='x'){ drag.moved=true; if(e.cancelable) e.preventDefault();
    /* v11.7 §42.5 — de vangst hangt aan de kaart die gescoord wordt; onder je vinger kan er
       (in de staart van de autoscroll) helemaal geen kaart zitten. */
    if(!drag.captured){ try{(drag.card||drag.scard).setPointerCapture(drag.pid);}catch(_){} drag.captured=true; }
    /* de beweging loopt op de kaart die gescoord wordt (§40.4), niet op de aangeraakte kaart */
    drag.scard.style.transition='none'; drag.scard.style.transform='translateX('+drag.dx+'px) rotate('+(drag.dx*0.02)+'deg)';
    if(drag.swrap){ const t=Math.min(Math.abs(drag.dx)/THRESH,1);
      const L=drag.swrap.querySelector('.swtint.left'), R=drag.swrap.querySelector('.swtint.right');
      if(drag.dx<0){L.style.opacity=t;R.style.opacity=0;} else {R.style.opacity=t;L.style.opacity=0;} }
    if(AS.on) asTint(null, drag.dx<0?Math.min(1,-drag.dx/90):0, drag.dx>0?Math.min(1,drag.dx/90):0); }
},{passive:false});
$('stage').addEventListener('pointerup',e=>{
  if(!drag) return; const d=drag; drag=null;
  const held=asRelease();                                  /* §29.8 — lange druk loslaten = verder */
  const resetTint=()=>{ if(d.swrap) d.swrap.querySelectorAll('.swtint').forEach(x=>x.style.opacity=0);
                        if(d.wrap&&d.wrap!==d.swrap) d.wrap.querySelectorAll('.swtint').forEach(x=>x.style.opacity=0); };
  if(d.axis==='x'){
    const pass=Math.abs(d.dx)>THRESH, val=d.dx<0?1:0;      /* links = juist, rechts = fout */
    d.scard.style.transition='transform .16s ease'; d.scard.style.transform='translateX(0)';
    if(pass){
      /* v11.5.1 §40.4 — in de autoscroll loopt de veeg via asScore(): die telt mee in de balans
         van de beurt, kleurt het tekstveld en zet AS.scored, zodat een tik erna niet dubbel telt. */
      if(AS.on && d.scroll){ if(!AS.scored) asScore(val===1,false,d.scroll);
        /* v11.11 §45.1 — in de lopende beurtstand komt na een veeg meteen de volgende kaart
           met de kolom dicht (antwoord V4), net zoals in de stilstaande beurtstand. De korte
           wachttijd laat de groene/rode tint van asScore() nog even zien. */
        if(TURN) setTimeout(function(){ if(TURN&&AS.on) turnAdvance(); },300); }
      else { scoreItem(d.sid,val,false);
        /* v11.7 §42.9 — ook een veeg in de lijst telt mee in de groene/rode teller van de balk. */
        if(val) AS.nok++; else AS.nbad++;
        /* v11.7 §42.2 — §41.14 is teruggedraaid: in de lijst verbergt het menu zich NOOIT meer.
           Alleen de autoscroll speelt nog met het menublok (§42.4). */
        /* v11.10 §44.13 — in de beurtstand wordt er niet gescrold: de focus springt gewoon
           naar de volgende kaart, met het antwoord weer dicht (antwoord V4 van JHS). */
        if(TURN){ turnStep(1); }
        else if(!SET.pick) asListStep(d.scard);   /* v11.7 §42.1 — één kaart door, precies op de plaats
                                                van de geveegde. In een ☀-lijst verdwijnt de kaart
                                                zelf (zie hieronder) en schuift de volgende vanzelf
                                                op die plaats; dán mag er niet bij gescrold worden. */
        setTimeout(function(){
          /* v11.3 §31.6 — in train / nieuw vandaag verdwijnt het woord live uit de lijst */
          /* v11.8 §43.1 — én uit `deck`, anders blijft het totaal in de balk staan */
          if(SET.pick){ const sc=d.scard.closest('.scrollcard');
            if(sc){ const nx=sc.nextElementSibling||sc.previousElementSibling;
                    if(TURN&&sc.classList.contains('focus')&&nx) nx.classList.add('focus');
                    sc.remove(); }
            deckDrop(d.sid); asDrawBar(); }
          else refreshCard(d.scard,d.sid);
          if(TURN) turnFocus();
          renderPin(); },150); }
    } else if(AS.on) asTint(null,0,0);
    resetTint(); return;
  }
  if(d.moved) return;
  /* ---- tik ---- */
  if(d.tgt.closest&&d.tgt.closest('.pen')){ const it=ITEMS.find(x=>x.id===d.id); if(it) openEditor(it); return; }
  /* v11.5 §38.9 · v11.5.1 §40.1 · v11.6 §41.20 — de grijze samenvattingsbol en de historiek-
     bolletjes zijn puur informatief. De tik-guard gold enkel in de autoscroll; hij geldt nu
     ALTIJD: tikken scoort nergens nog, alleen vegen scoort.
     v11.6 §41.21 — één uitzondering in ☀15: een tik op het bolletje van een nog niet gescoord
     item schuift dat item uit de dagset (uitgesteld, niet afgekeurd). */
  if(d.tgt.closest && d.tgt.closest('.scoreblk')){ asDayDrop(d.id); return; }
  /* v11.2 §29.7 · v11.6 §41.8 — een tik op de kaartenzone pauzeert of speelt verder. Zacht:
     het menublok blijft staan zoals het staat. Scoren doet die tik niet meer (§41.20). */
  /* v11.10 §44.12 — staat de selectierij open, dan is de EERSTE tik op de kaarten enkel
     «klap dicht»: hij toont, verbergt, pauzeert of hervat niets. Zo blijft de hoge rij
     wegklikken zonder neveneffect (uitdrukkelijke keuze van JHS). */
  if(fpackOpen()){ setCompact(true); return; }
  /* v11.10 §44.6 — zodra de autoscroll GESTART is, pauzeert/hervat een tik op de kaarten;
     zolang hij niet gestart is, toont en verbergt hij (de oude werking van de lijst). */
  /* v11.11 §45.4b — beurtstand: een tik onthult, waar je ook tikt. Staat de kolom al open,
     dan doet de tik wat §44.6 zegt: pauzeren of verdergaan. Zo blijft allebei bereikbaar,
     ook op stand 100 % (waar er niets vanzelf opengaat). */
  if(TURN && AS.on){
    if(held) return;
    const sc=turnCard();
    if(sc && turnIsHidden(sc)){ turnReveal(); return; }
    asToggle(); return;
  }
  if(AS.on){ if(!held) asToggle(); return; }
  subOpen.clear();
  const blur=SET.showAns?hidden.has(d.id):!revealed.has(d.id);
  if(blur){ if(SET.showAns) hidden.delete(d.id); else revealed.add(d.id); refreshCard(d.card,d.id);
            if(TURN) turnFit(); renderPin(); return; }
  /* v10 · v11.10 §44.9 — tik op de kolom die ER STAAT (de vraag) = het antwoord weer dicht */
  if(d.tgt.closest&&d.tgt.closest('.cell:not(.hidecol)')){
    if(SET.showAns) hidden.add(d.id); else revealed.delete(d.id);
    refreshCard(d.card,d.id); renderPin(); return; }
  const cell=d.tgt.closest&&d.tgt.closest('.cell.hidecol');
  if(cell){ const i=+cell.dataset.row, arr=new Set(FLUO[d.id]||[]);
    arr.has(i)?arr.delete(i):arr.add(i);
    FLUO[d.id]=[...arr]; if(!FLUO[d.id].length) delete FLUO[d.id];
    saveFluo(); cell.classList.toggle('fluo'); }
});
$('stage').addEventListener('pointercancel',()=>{ asRelease(); if(!drag)return; const d=drag; drag=null;
  /* v11.7 §42.5 — er hoeft geen kaart onder je vinger te zitten; zet altijd de kaart terug die
     effectief meebewoog (d.scard). */
  const back=d.scard||d.card;
  if(back){ back.style.transition='transform .18s ease'; back.style.transform='translateX(0)'; }
  if(d.swrap) d.swrap.querySelectorAll('.swtint').forEach(x=>x.style.opacity=0);
  if(d.wrap&&d.wrap!==d.swrap) d.wrap.querySelectorAll('.swtint').forEach(x=>x.style.opacity=0); });

/* ster (centraal boven de kaart) */
$('stage').addEventListener('click',e=>{
  const s=e.target.closest('.star'); if(!s) return; e.stopPropagation();
  const id=s.dataset.fav;
  if(FAV.has(id)){ FAV.delete(id); s.textContent='☆'; s.classList.remove('on'); }
  else { FAV.add(id); s.textContent='★'; s.classList.add('on'); }
  saveFav();
  const sc=s.closest('.scrollcard'), card=sc&&sc.querySelector('.card');
  if(card) card.classList.toggle('starred',FAV.has(id));
  if(filters.fav) render();
});

/* ===================== v11.1 §28 · AUTOSCROLL ===================== */
/* De lijst scrolt KLOKGESTUURD door (§28.10): elke kaart staat exact even lang in beeld.
   De kaart rond 40% van de lijsthoogte staat in focus (blauwe rand, scherp); de rest is
   dof en wazig. Onderaan staat een tweekoloms tekstveld (§28.1): links het NL-hoofdwoord,
   rechts het Bergense hoofdwoord mét lidwoord, wazig tot je tikt.
   Tiklogica (§28.2): 1e tik = oplossing · 2e tik = juist · niets doen = fout,
   tenzij ✗auto uit staat (§28.8). Vegen blijft werken (links juist, rechts fout). */
/* v11.11 §45.2 — negen snelheden, 6s is de traagste en 0,8s de snelste. Dezelfde reeks
   stuurt de autoscroll én de beurtstand (één knop voor allebei). */
const SPEEDS=[6,5,4,3,2,1.5,1.2,1,.8];                       /* §28.3 — seconden per kaart */
/* v11.10 §44.7 — korte etiketten voor het zwevende menu en de knop zelf */
const SPEEDSHORT=['6','5','4','3','2','1,5','1,2','1','0,8'];
/* v11.11 §45.3 — de standen van het onthulpercentage in de beurtstand */
const TPCTS=[0,25,50,75,100];
const AS={on:false,playing:false,raf:0,cur:null,idx:0,cards:[],n:0,eye:false,
          taps:0,scored:false,autoWrong:false,nok:0,nbad:0,badLog:[],hold:false,holdT:0,
          t0:0,s0:0,d:0,dur:1,
          /* v11.4 — §34.2 bevroren lijst van weggefilterde groene woorden · §34.3 rondeteller */
          hide:null,round:0,roundAt:0,
          /* v11.5.1 — de leadruimte van §34.4 komt er pas bij de eerste ▶, niet al bij ⇈ */
          lead:false,
          /* v11.7 §42.7 — laatst gekende plaats in de LIJST (1-gebaseerd), voor «45 / 74».
             Wordt vanaf de vorige stand bijgewerkt, net als AS.idx in de autoscroll. */
          lpos:1};
/* v11.7 §42.3 — de autoscroll is geblokkeerd in de kolommen IN DB en TO DO (en dus ook in de
   ☀15 van de TO DO-kolom). ACTIEF, ZWAK, GEKEND en STARRED laten hem toe, net als ☀50 (train)
   en de gewone lijst zonder kolomkeuze. Kies je zo'n geblokkeerde selectie terwijl de autoscroll
   loopt, dan val je zonder melding terug in de lijst (§42.3 vervangt §41.23). */
function asBlocked(){
  /* v11.11.1 §46.3 — DE BEURTSTAND IS NIET GEBLOKKEERD. De reden voor §42.3 was de scroll: in
     IN DB, TO DO en ☀15 verdwijnen kaarten live uit de lijst en schuift alles onder je vingers
     weg. In de beurtstand staat er één kaart en wordt er niet gescrold, dus die reden vervalt —
     en ☀15 is net de plek waar één kaart per keer het meest zin heeft (JHS, 2026-08-16).
     Omdat álle plaatsen die de blokkering nakijken via deze helper lopen (▶, `asStart()`,
     `setPick()`, de `#fgrid`-handler, `asPaintPlay()`), volstaat deze ene regel. */
  if(TURN) return false;
  if(SET.pick) return SET.pick==='new';
  return !!(SET.fsel && (SET.fsel.s==='db' || SET.fsel.s==='new'));
}
/* v11.6 §41.15 — staat van het menublok (rij 1 + rij 2). Enkel het greepje onderaan, ▶ en de
   voortgangsbalk sturen dit aan; een tik op de kaartenzone laat het met rust (§41.8/§41.10). */
let MENUON=true;

/* ---- v11.4 §34.2 · groene woorden weg tijdens de autoscroll ---- */
/* Uitzondering: sta je in de kolom «gekend» of in de train-selectie, dan blijven ze staan —
   anders zou de lijst net leegvallen. De keuze wordt één keer per ronde vastgelegd. */
function asHideOn(){
  if(SET.pick==='train') return false;
  if(SET.fsel && SET.fsel.s==='known') return false;
  return true;
}
function asMakeHide(){
  AS.hide = asHideOn()
    ? new Set(ITEMS.filter(x=>stateOf(x)==='known').map(x=>x.id))
    : null;
}
/* ---- v11.4 §34.4 · de eerste kaart komt van achter de onderbalk ---- */
/* Eén scherm hoog leegte vóór de eerste kaart. Zo staat kaart 1 bij scrollTop=0 net onder de
   onderrand en schuift ze omhoog zoals alle volgende — vroeger stonden de eerste twee kaarten
   al boven de focuslijn en werden ze overgeslagen. */
/* Onderaan komt er ook ruimte bij: zonder die staart stopt de scroll vóór de laatste kaart de
   focuslijn bereikt, en bij een kort lijstje zou het einde meteen geraakt worden. De staart is
   precies zo hoog dat het segment van de laatste kaart samenvalt met het einde van de scroll. */
/* v11.6 §41.7 — de staart wordt 0,72 × de hoogte van #stage, gespiegeld aan de leadruimte.
   Met de oude staart (h − focuslijn) stopte de scroll nét vóór de laatste kaart de focuslijn
   haalde; die kaart kwam dus nooit in focus en was daardoor niet te vegen. */
function asApplyLead(){
  const sp=$('astop'), bt=$('asbot'), st=$('stage'); if(!st) return;
  const h=st.clientHeight;
  if(sp) sp.style.height=(AS.on?h:0)+'px';
  if(bt) bt.style.height=(AS.on?Math.round(h*0.72):0)+'px';
}
function asClearLead(){ const sp=$('astop'), bt=$('asbot');
  if(sp) sp.style.height='0'; if(bt) bt.style.height='0'; }

/* ---- §29.4 · foute swipes van DEZE autoscroll-beurt kunnen weer weg ---- */
/* Vóór elke foute swipe in de autoscroll nemen we een foto van de score van dat woord.
   De knop ↩✗ zet die foto's in omgekeerde volgorde terug — enkel de FOUTE swipes,
   de goede blijven staan. Het logboek wordt leeggemaakt bij elke nieuwe autoscroll-beurt. */
function asLogBad(id){
  if(!AS.on) return;
  const k=skey(id), cur=scores[k];
  AS.badLog.push({id:id, k:k, snap:cur?JSON.parse(JSON.stringify(cur)):null});
  asUpdUndo();
}
/* §29.8 — lange druk loslaten: als de lijst daardoor stilstond, loopt hij weer verder.
   Geeft true terug als deze aanraking een lange druk wás (dan is het géén tik). */
function asRelease(){
  clearTimeout(AS.holdT);
  if(!AS.hold) return false;
  AS.hold=false;
  if(AS.holdWasPlaying) asResume();
  return true;
}
function asUpdUndo(){
  const b=$('btnUndoBad'); if(!b) return;
  const n=AS.badLog.length;
  b.disabled=!n;
  b.innerHTML='↩✗'+(n?'<b>'+n+'</b>':'');
  b.title=n?('wis de '+n+' foute swipe'+(n>1?'s':'')+' van deze autoscroll-beurt')
           :'nog geen foute swipes in deze autoscroll-beurt';
}
function asUndoBad(){
  if(!AS.badLog.length) return;
  const n=AS.badLog.length;
  for(let i=AS.badLog.length-1;i>=0;i--){ const e=AS.badLog[i];
    if(e.snap) scores[e.k]=e.snap; else delete scores[e.k]; }
  AS.badLog=[];
  save('sos_scores_v6',scores);
  bumpDay('bad',-n); bumpDay('abad',-n);
  AS.nbad=Math.max(0,AS.nbad-n);
  syncPushSoon(); asUpdUndo(); asDrawBar();
  const host=$('lst');
  if(host) [].slice.call(host.querySelectorAll('.card')).forEach(function(c){ refreshCard(c,c.dataset.id); });
  renderPin();
}

function asRefreshCards(){ const host=$('lst');
  AS.cards=host?[].slice.call(host.children):[];
  if(AS.idx>=AS.cards.length) AS.idx=Math.max(0,AS.cards.length-1); }
/* v11.6 §41.11/§41.12 — de dropdown van §38.12 is weg: de snelheden staan weer als één rij
   knoppen in rij 2, die tijdens de lopende autoscroll de plaats van de selectierij inneemt.
   SET.asSpeed staat in de bestaande sleutel sos_set_v6 en blijft dus over sessies heen staan. */
function asRenderSpeeds(){ asRenderSpeedMenu(); }

/* ---- §28.10 · klokgestuurd scrollen ---- */
/* Het segment van kaart i loopt van halverwege de vorige tot halverwege de volgende kaart
   (dáár verspringt de focus), niet over de hoogte van de kaart zelf. De scroll wordt niet
   geïntegreerd uit px/s × dt (elk gemist frame kost dan tijd) maar uit performance.now(). */
function asMid(c){ return c.offsetTop+c.offsetHeight/2; }
function asLineOff(){ return $('stage').clientHeight*0.40; }
function asFocusLine(){ const st=$('stage'); return st.scrollTop+asLineOff(); }
function asStartTop(i){ const c=AS.cards;
  return (i>0) ? (asMid(c[i-1])+asMid(c[i]))/2-asLineOff()
               : asMid(c[0])-c[0].offsetHeight/2-asLineOff(); }
function asEndTop(i){ const c=AS.cards, n=c.length;
  return (i<n-1) ? (asMid(c[i])+asMid(c[i+1]))/2-asLineOff()
                 : asMid(c[n-1])+c[n-1].offsetHeight/2-asLineOff(); }
function asSegLen(i){ return Math.max(20,asEndTop(i)-asStartTop(i)); }
function asNewSegment(){                       /* ook na pauze, snelheidswissel of appendMore() */
  if(!AS.cards.length){ AS.d=0; AS.dur=1; return; }
  const st=$('stage'), i=Math.min(Math.max(0,AS.idx),AS.cards.length-1);
  AS.s0=st.scrollTop; AS.t0=performance.now();
  let d=asEndTop(i)-AS.s0;
  /* v11.8 §43.2 — DE LAATSTE KAART KROOP. Haar eindpunt ligt vóór het einde van de scroll
     (de staart van §41.7 is groter dan de afstand tot de focuslijn). Zodra dat eindpunt
     gepasseerd was, werd `d` negatief en maakte het vangnet `Math.max(1,…)` er 1 px van,
     met een duur van 0,05 s: ±20 px per seconde, en elk beeldje opnieuw berekend — vandaar
     «heel druk en heel traag». Gemeten: vijf seconden over de laatste 85 px.
     Nu loopt de scroll, zodra het eindpunt voorbij is, op HET TEMPO VAN DIT SEGMENT door tot
     het einde van de lijst; daar neemt asTick() over met asRound(). */
  if(d<=0) d=(st.scrollHeight-st.clientHeight)-AS.s0;
  AS.d=Math.max(1,d);
  AS.dur=Math.max(.05,(SPEEDS[SET.asSpeed]||2)*AS.d/asSegLen(i));
}
function asPick(){
  if(!AS.cards.length) asRefreshCards();
  const cards=AS.cards; if(!cards.length) return null;
  const line=asFocusLine();
  let i=Math.min(Math.max(0,AS.idx),cards.length-1);
  /* de focus loopt monotoon mee met de scroll → vanaf de vorige positie zoeken (O(1)) */
  while(i>0 && Math.abs(asMid(cards[i-1])-line)<Math.abs(asMid(cards[i])-line)) i--;
  while(i<cards.length-1 && Math.abs(asMid(cards[i+1])-line)<Math.abs(asMid(cards[i])-line)) i++;
  AS.idx=i; return cards[i];
}
/* v11.6 §41.6 — ook de EERSTE kaart is wazig zolang ze niet in focus is. Ze bleef scherp omdat
   ze, tot haar segment begint, altijd de kaart is die het dichtst bij de focuslijn ligt: er is
   geen kaart vóór haar. De scherpte hangt nu niet meer af van «de dichtste kaart» alleen, maar
   ook van «haar segment is begonnen» — precies wat voor elke andere kaart al gold. */
function asStarted(i){ const c=AS.cards; if(!c||!c[i]) return false;
  return $('stage').scrollTop >= asStartTop(i)-2; }
function asSetFocus(){
  const best=asPick();
  if(best===AS.cur){ if(AS.cur) AS.cur.classList.toggle('focus',asStarted(AS.idx)); return false; }
  /* §28.2 — de vorige kaart wordt afgerekend op het moment dat de focus verspringt.
     De kaart wordt expliciet meegegeven, anders blijft er een tint hangen. */
  if(AS.cur && !AS.scored && AS.autoWrong) asScore(false,true,AS.cur);
  if(AS.cur) AS.cur.classList.remove('focus');
  AS.cur=best;
  if(AS.cur){ AS.cur.classList.toggle('focus',asStarted(AS.idx));
    asFill(ITEMS.find(x=>x.id===AS.cur.dataset.sc)); }
  asDrawBar(); asNewSegment();
  return true;
}

/* ---- §28.1 / §28.9 · het tekstveld ---- */
function asHeadNB(it){
  if(!it) return '&#8212;';
  if(it.type==='woord'){ if(hasNB(it)) return it.hnb; const B=it.bm||{}; return B.h||'&#8212;'; }
  return it.nb||((it.bm&&it.bm.nb)||'&#8212;');
}
function asHeadNL(it){
  if(!it) return '—';
  const t=(it.type==='woord')?strip(it.hnl):(it.nl||'');
  return t||'—';
}
function asFill(it){
  $('nlword').textContent=asHeadNL(it);
  $('nbword').innerHTML=asHeadNB(it);
  AS.taps=0; AS.scored=false; asPaintState();
  requestAnimationFrame(function(){ fit($('nlword')); fit($('nbword')); });
}
/* v11.5 §38.3 — de tekstregels onder het veld zijn weg; enkel de waas blijft over als signaal. */
function asPaintState(){
  const nb=$('nbword'); if(nb) nb.classList.toggle('hidden',AS.taps===0);
}
function asTint(card,l,r){
  [$('nlwrap'),card].forEach(function(host){ if(!host) return;
    const L=host.querySelector('.swtint.left'), R=host.querySelector('.swtint.right');
    if(L) L.style.opacity=l; if(R) R.style.opacity=r; });
}
function asScore(ok,silent,cardEl){
  const card=cardEl||AS.cur; if(!card) return;
  const id=card.dataset.sc; if(!id) return;
  AS.scored=true;
  scoreItem(id,ok?1:0,true);          /* §29.5 — alles wat in de autoscroll gebeurt, is een auto-swipe */
  if(ok) AS.nok++; else AS.nbad++;
  asTint(card, ok?1:0, ok?0:1);
  asDrawBar();
  if(!silent) asPaintState();
  setTimeout(function(){
    asTint(card,0,0);
    const c=card.querySelector('.card');
    if(c&&card.parentNode){ refreshCard(c,id);
      const nc=card.querySelector('.card'); if(nc) nc.querySelectorAll('.cell.w,.cell.f').forEach(fit); }

/* ---- v11.6 §41.1 · v11.7 §42.7/§42.8/§42.9 · DE VOORTGANGSBALK ---- */
/* De balansvlakken van §28.7 én de streepjes van §41.2 zijn allebei weg. Wat overblijft:
   - één effen vulling: in de autoscroll je plaats in het deck, in de lijst hoe ver je gescrold bent;
   - links in het groen en rechts in het rood de tellers van deze beurt (§42.9);
   - rechts NÁÁST de balk «45 / 74»: waar je zit / hoeveel kaarten de selectie telt (§42.7).
   De balk houdt in beide standen exact dezelfde afmeting (§41.3). */
/* §42.7 — de plaats in de LIJST is de eerste kaart die nog (deels) onder de bovenrand zit.
   De zoektocht vertrekt van de vorige stand, net als asPick() in de autoscroll, zodat een
   lange lijst niet elke scrollframe helemaal doorlopen wordt. */
function asListPos(){
  const host=$('lst'); if(!host) return 0;
  const k=host.children, n=k.length; if(!n) return 0;
  const top=$('stage').scrollTop+8;
  let i=Math.min(Math.max(0,AS.lpos-1),n-1);
  while(i>0 && k[i-1].offsetTop+k[i-1].offsetHeight>top) i--;
  while(i<n-1 && k[i].offsetTop+k[i].offsetHeight<=top) i++;
  AS.lpos=i+1;
  return AS.lpos;
}
/* v11.8 §43.1 — een kaart die live uit de lijst verdwijnt (☀15/☀50 na een veeg, of het
   uitstellen van §41.21) moet ook uit `deck` en uit `shown`. Zonder dit bleef het totaal in de
   balk hangen: gemeten stond er «1 / 10» terwijl er nog maar acht kaarten op het scherm stonden.
   Bewust géén volledige herbouw van het deck — dan zou de hele lijst onder je vingers verspringen. */
function deckDrop(id){
  const i=deck.findIndex(function(x){ return x.id===id; });
  if(i<0) return;
  deck.splice(i,1);
  if(shown>0) shown--;
  if(AS.lpos>deck.length) AS.lpos=Math.max(1,deck.length);
}
/* v11.8 §43.1 — de vulling loopt tijdens de autoscroll VLOEIEND mee: niet in sprongen van
   één kaart, maar met de plaats binnen het lopende segment erbij. Wordt vanuit asTick()
   aangeroepen en schrijft één stijlregel, verder niets. */
function asBarFrac(){
  if(!AS.on) return 0;
  /* v11.11 §45.1 — in de beurtstand is er geen scroll: de vulling volgt de klok van de kaart. */
  if(TURN){ const per=turnPer(); return per?Math.min(1,Math.max(0,TU.el/per)):0; }
  if(!AS.cards.length) return 0;
  const i=Math.min(Math.max(0,AS.idx),AS.cards.length-1);
  const s=$('stage').scrollTop, a=asStartTop(i), len=asSegLen(i);
  return Math.min(1,Math.max(0,(s-a)/len));
}
function asBarProgress(){
  const tot=deck.length||AS.cards.length||0; if(!tot||!AS.on) return;
  const pr=Math.min(1,(Math.min(AS.idx,tot-1)+asBarFrac())/tot);
  $('bprog').style.width=(pr*100).toFixed(1)+'%';
}
function asDrawBar(){
  const bar=$('pbar'); if(!bar) return;
  const tot=deck.length||AS.cards.length||0;
  let pr=0, pos=0;
  if(AS.on){
    pos=tot?Math.min(AS.idx+1,tot):0;
    if(tot) pr=(Math.min(AS.idx,tot-1)+asBarFrac())/tot;
  } else {
    const s=$('stage'), max=s.scrollHeight-s.clientHeight;
    if(max>4) pr=Math.min(1,Math.max(0,s.scrollTop/max));
    pos=Math.min(asListPos(),tot);
  }
  $('bprog').style.width=(pr*100).toFixed(1)+'%';
  $('blbl').textContent='';                       /* §42.7 — het cijferpaar staat nu náást de balk */
  const c=$('pcnt'); if(c) c.textContent=tot?(pos+' / '+tot):'';
  const g=$('bcok'), r=$('bcbad');
  if(g) g.textContent=AS.nok;
  if(r) r.textContent=AS.nbad;
}
/* §42.9 — de tellers gelden voor DEZE beurt: ze beginnen opnieuw bij ⇈ (asStart), bij een
   nieuwe ronde (asRound) en zodra je een andere selectie kiest. De teller «swipes / dag»
   bovenaan blijft het dagtotaal tonen; de balk zegt dus iets wat je nergens anders ziet. */
function asResetCount(){ AS.nok=0; AS.nbad=0; if(typeof asDrawBar==='function') asDrawBar(); }
function asTick(){
  if(!AS.on||!AS.playing) return;
  /* v11.11 §45.1 — de beurtstand deelt de lus maar niet de motor: geen scroll, enkel een klok. */
  if(TURN){ turnTick(); AS.raf=requestAnimationFrame(asTick); return; }
  const st=$('stage');
  /* v11.11.1 §46.2 — zelfde verhaal als in de beurtstand, maar hier deed het veel meer pijn:
     na een onderbreking van 40 s sprong de scroll van 26 naar 2035 px — een stuk of vijftien
     kaarten die als gepasseerd meetelden zonder dat je ze gezien hebt. Duurt het lopende
     segment meer dan drie keer zo lang als bedoeld, dan is dat geen gemist beeldje maar een
     onderbreking: het segment begint opnieuw vanaf waar de lijst staat. */
  if(performance.now()-AS.t0 > AS.dur*3000){ asNewSegment(); AS.raf=requestAnimationFrame(asTick); return; }
  const k=(performance.now()-AS.t0)/(AS.dur*1000);
  st.scrollTop=AS.s0+AS.d*k;                    /* geen clamp: een gemist frame springt bij, de tijd klopt */
  if(st.scrollTop+st.clientHeight>=st.scrollHeight-2){
    if(shown>=deck.length){                     /* v11.4 §34.3 — einde: opnieuw schudden en van voor af aan */
      /* vangnet: bij een heel kort lijstje zou het einde elk frame opnieuw geraakt worden */
      if(performance.now()-AS.roundAt>500){ asRound(); }
      AS.raf=requestAnimationFrame(asTick);
      return;
    } else appendMore();
  }
  /* na appendMore() zijn er nieuwe kaarten: endTop() van de laatste verandert → segment herrekenen */
  if(AS.n!==AS.cards.length){ AS.n=AS.cards.length; asNewSegment(); }
  const moved=asSetFocus();
  if(!moved && k>=1) asNewSegment();            /* vangnet als de focus nog niet versprong */
  asBarProgress();                              /* v11.8 §43.1 — vloeiende vulling */
  AS.raf=requestAnimationFrame(asTick);
}
/* §29.1 / §29.2 — vanuit het menu kom je BINNEN IN PAUZE, en ✗auto staat ALTIJD uit.
   Zo kan er niets meer meelopen zonder dat je het ziet. */
function asStart(){
  /* v11.7 §42.3 (vervangt §41.23) — de autoscroll is geblokkeerd in IN DB en TO DO, dus ook in
     de ☀15. ☀50 (train) mag hem nu wél. ⇈ dooft en doet niets — zonder melding. */
  if(asBlocked()) return;
  mode='voc';
  AS.on=true; AS.playing=false; AS.idx=0; AS.cur=null;
  AS.nok=0; AS.nbad=0;                   /* v11.7 §42.9 — nieuwe beurt, tellers op nul */
  AS.autoWrong=false; AS.badLog=[]; AS.hold=false; clearTimeout(AS.holdT);
  AS.round=0; AS.roundAt=performance.now();
  AS.lead=false;                         /* v11.5.1 — nog géén leadruimte: de lijst blijft staan */
  const keep=$('stage').scrollTop;
  $('phone').classList.add('play');      /* eerst de speelstand: dan klopt de hoogte van #stage */
  $('phone').classList.remove('playing');
  $('phone').classList.toggle('eye',AS.eye);
  $('phone').classList.toggle('txtoff',!!SET.astxtoff);   /* §38.4 — laatste stand van de tekstbalk */
  asMakeHide();                          /* §34.2 — bevries welke groene woorden wegvallen */
  render();                              /* lijst opnieuw opbouwen mét filter */
  /* v11.11 §45.1 — de beurtstand: geen leadruimte, geen scroll, geen segment. Enkel de kaart
     in focus, met de doelkolom dicht, en de klok op nul. Al de rest (▶, snelheid, balk,
     tellers, scoren) blijft precies dezelfde weg lopen als in de autoscroll. */
  if(TURN){
    $('stage').scrollTop=0;
    asRefreshCards(); AS.n=AS.cards.length;
    turnFocus(); turnSyncCur();
    turnSetHide(turnCard(),turnPct()>0);
    turnRestartClock();
    asPaintNoAuto(); asUpdUndo(); asPaintPlay(); asRenderSpeeds(); asDrawBar();
    cancelAnimationFrame(AS.raf);
    return;
  }
  /* v11.5.1 — ⇈ mag geen leeg scherm geven. Vroeger zette asStart() meteen de leadruimte van
     §34.4 (één scherm leegte vóór kaart 1) én scrollTop=0, waardoor je na één druk op ⇈ naar
     een lege lijst keek. Nu blijf je gewoon staan waar je stond; de leadruimte komt er pas bij
     de eerste ▶ (asResume), waar ze ook hoort: dán komt kaart 1 van achter de onderbalk op. */
  $('stage').scrollTop=Math.min(keep,Math.max(0,$('stage').scrollHeight-$('stage').clientHeight));
  asPaintNoAuto();
  asUpdUndo();
  asPaintPlay();
  asRenderSpeeds();
  asRefreshCards(); AS.n=AS.cards.length;
  asSetFocus(); asDrawBar(); asNewSegment();
  cancelAnimationFrame(AS.raf);          /* nog geen lus: die start pas bij ▶ */
}
/* v11.5 §38.11 — ⇈ zet de autoscroll-stand aan, 📋 brengt je terug naar de gewone lijst;
   het ▶/⏸ op de balk is het enige dat de bewéging start en stopt. */
/* v11.10 §44.6 — ⇈/📋 is weg. ▶ heeft nu DRIE standen en is de in- én de uitweg:
   wit = lijst · blauw = de autoscroll loopt · lichtblauw = gepauzeerd.
   De knop wordt nooit ❚❚ — pauzeren doe je met een tik op de kaarten of op het menu. */
function asPaintPlay(){
  const p=$('pp');
  if(p){
    p.textContent='▶';
    p.classList.toggle('on',AS.on&&AS.playing);
    p.classList.toggle('paused',AS.on&&!AS.playing);
    /* v11.7 §42.3 — in IN DB, TO DO en ☀15 dooft ▶ en doet hij niets */
    const blk=asBlocked();
    p.classList.toggle('off',blk&&!AS.on);
    p.title=AS.playing?'terug naar de lijst'
           :(AS.on?'verder spelen'
           :(blk?'autoscroll is uit in «in db», «TO DO» en ☀15':'start'));
  }
  const sp=$('spbtn');
  /* v11.11 §45.2 — dezelfde knop stuurt de autoscroll én de beurtstand, dus hij is ook
     bruikbaar zodra de beurtstand aanstaat (§44.7 grijsde hem buiten de autoscroll uit). */
  if(sp){ sp.disabled=!(AS.on||TURN); sp.textContent=SPEEDSHORT[SET.asSpeed]; }
  asPaintRows();
}
/* ---- v11.10 §44.7 · het zwevende snelheidsmenu ----
   Openen pauzeert de autoscroll, kiezen sluit het menu en zet hem weer in gang. De knop is
   uitgegrijsd zolang de autoscroll niet aanstaat, want dan valt er niets te regelen. */
/* v11.11 §45.2/§45.3 — hetzelfde uitgeklapte menu draagt nu TWEE regelaars: de negen snelheden
   (die gelden voor de autoscroll én voor de beurtstand) en het onthulpercentage, dat enkel in
   de beurtstand iets doet. Het percentage staat hier en NIET in ⚙ — uitdrukkelijke keuze van
   JHS: je wil het kunnen bijstellen terwijl je speelt, naast de snelheid. */
let SPRESUME=false;
function closeSpeed(){ const m=$('spmenu'); if(m) m.classList.remove('open'); }
function asRenderSpeedMenu(){
  const m=$('spmenu'); if(!m) return;
  m.innerHTML='<div class="splb">seconden per kaart</div>'
   +'<div class="spgrid">'+SPEEDSHORT.map(function(l,i){
       return '<button data-sp="'+i+'"'+(i===SET.asSpeed?' class="on"':'')+'>'+l+'</button>'; }).join('')+'</div>'
   +'<div class="spsep"></div>'
   +'<div class="pcblk'+(TURN?'':' dim')+'"><div class="splb">onthullen na — enkel beurtstand</div>'
   +'<div class="pcgrid">'+TPCTS.map(function(p){
       return '<button data-pc="'+p+'"'+(p===turnPct()?' class="on"':'')+'>'+p+'%</button>'; }).join('')+'</div></div>';

/* ---- v11.4 §34.3 · aan het einde van de lijst opnieuw beginnen, opnieuw geschud ---- */
function asRound(){
  AS.round++; AS.roundAt=performance.now();
  shuffleSeed=Math.random(); order={};   /* nieuwe schudbeurt, net als 🔀 */
  asMakeHide();                          /* wat je deze ronde geleerd hebt, valt nu weg */
  if(AS.cur) AS.cur.classList.remove('focus');
  AS.cur=null; AS.idx=0;
  AS.nok=0; AS.nbad=0;                   /* v11.7 §42.9 — nieuwe ronde, tellers op nul */
  render();                              /* zet ook de leadruimte terug (§34.4) */
  $('stage').scrollTop=0;
  asRefreshCards(); AS.n=AS.cards.length;
  asSetFocus(); asDrawBar(); asNewSegment();
}
/* §28.8 vervalt in v11.5 (§38.3): de ✗auto-knop is weg, AS.autoWrong blijft dus altijd uit. */
function asPaintNoAuto(){
  const b=$('btnNoAuto'); if(!b) return;
  b.classList.toggle('off',!AS.autoWrong);
  b.classList.toggle('on',AS.autoWrong);
}
/* ---- v11.5 §38.6/§38.14 · v11.6 §41.11 · RIJ 2 WISSELT VAN INHOUD ----
   Tijdens de LOPENDE autoscroll wijkt de selectierij (filterbalk + bronrij) voor de rij
   snelheidsknoppen; bij pauze of in de lijst staat de selectierij er weer. Rij 1 blijft staan.
   De hoogte van #stage verandert door die wissel, dus na de schuif (±170 ms) worden de
   lead-/staartruimte en het lopende segment opnieuw berekend.
   Een korte druk-pauze (§29.8/§38.5, AS.hold) laat de rijen met rust: anders knipperde de
   selectierij even door elk vingerdrukje heen. */
let asMenuT=0;
function asRelayout(){
  clearTimeout(asMenuT);
  asMenuT=setTimeout(function(){
    /* v11.11 §45.4d — de hoogte van #stage verandert mee, dus de kaart moet opnieuw passen */
    if(TURN){ turnFit(); if(!AS.on) return; asRefreshCards(); return; }
    if(!AS.on) return;
    if(AS.lead) asApplyLead();

  },170);
}
function asPaintRows(){
  const want=!!(AS.on&&(AS.playing||AS.hold)), ph=$('phone');
  if(ph.classList.contains('playing')===want) return;
  ph.classList.toggle('playing',want);

}
/* ---- v11.6 §41.15 · HET MENUBLOK ----
   Rij 1 en rij 2 samen. Het greepje onderaan verbergt en toont ze; ▶ en de voortgangsbalk
   halen ze terug (§41.10); een actie in de lijst laat ze verdwijnen (§41.14). Een tik op de
   kaartenzone raakt ze niet aan (§41.8). */
function asSetMenu(on){
  MENUON=!!on;
  $('phone').classList.toggle('menuoff',!MENUON);
  const g=$('mgrip'); if(g) g.classList.toggle('closed',!MENUON);
  asRelayout();
}
/* v11.6 §41.21 — korte melding, bv. wanneer een item uit de dagset geschoven wordt */
let toastT=0;
function toastn(msg){
  const t=$('toastn'); if(!t) return;
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('on'); },2400);
}
/* v11.6 §41.13 · v11.7 §42.1 — een veeg in de lijst springt PRECIES één kaart door.
   Fout in §41.13: ik rekende naar de BOVENRAND van #stage toe (`scrollTo(volgende.top − 8)`),
   waardoor de nieuwe kaart bovenaan het venster landde en de lijst dus veel te ver doorschoof.
   Juist is een verplaatsing (`scrollBy`) van precies de ruimte die de geveegde kaart innam —
   dan komt de volgende kaart exact op de hoogte te staan waar je net veegde. */
function asListStep(cardEl){
  if(AS.on||!cardEl||!cardEl.closest) return;
  const sc=cardEl.closest('.scrollcard'); if(!sc) return;
  const nx=sc.nextElementSibling; if(!nx||!nx.classList.contains('scrollcard')) return;
  const st=$('stage');
  const dy=nx.getBoundingClientRect().top-sc.getBoundingClientRect().top;   /* hoogte + tussenruimte */
  st.scrollTo({top:Math.max(0,st.scrollTop+dy),behavior:'smooth'});
}
/* v11.6 §41.21/§41.22 — tik op het bolletje van een NOG NIET gescoord item in ☀15: dat item
   gaat uit de dagset van vandaag en wordt meteen vervangen door het volgende in prioriteit.
   Is het al gescoord, dan blijft het staan. Buiten ☀15 doet de tik niets (§41.20). */
function asDayDrop(id){
  if(SET.pick!=='new'||!id) return;
  const it=ITEMS.find(function(x){ return x.id===id; }); if(!it) return;
  if(!isFresh(it)){ toastn('Al gescoord — dit item blijft staan.'); return; }
  SET.daySkip[id]=todayKey();

  saveSet();

/* ---- v11.5.1 · TWEE SOORTEN PAUZE ----
   `soft` = je houdt even je vinger op de lijst of je veegt (§38.5/§29.8). Dan stopt enkel de
   beweging en blijven de rijen staan zoals ze staan.
   v11.6 §41.8/§41.10 — geen van beide raakt nog aan het menublok: dat luistert enkel naar het
   greepje, naar ▶ en naar de balk. */
function asPause(soft){ AS.playing=false; cancelAnimationFrame(AS.raf);
  /* v11.11 §45.1 — in de beurtstand bevriest de klok van de lopende kaart bij een pauze */
  if(TURN&&AS.on) TU.el=performance.now()-TU.t0;
  asPaintPlay(); }
function asResume(){ if(!AS.on) return;
  AS.playing=true;
  /* v11.11 §45.1 — de beurtstand pikt de klok op waar ze stond; er is geen leadruimte en
     geen segment om te herberekenen. */
  if(TURN){ TU.t0=performance.now()-TU.el; asPaintPlay();
    cancelAnimationFrame(AS.raf); AS.raf=requestAnimationFrame(asTick); return; }
  /* v11.5.1 — de leadruimte van §34.4 komt er bij de EERSTE ▶: pas dan springt de lijst naar
     boven en komt kaart 1 van achter de onderbalk opzetten. Bij een latere pauze/verder blijft
     ze staan, anders zou de lijst onder je vingers verschuiven. */
  const eerste=!AS.lead;

  asPaintPlay();
  if(eerste){
    asApplyLead();
    $('stage').scrollTop=0;
    AS.idx=0; if(AS.cur) AS.cur.classList.remove('focus'); AS.cur=null;
    asRefreshCards(); AS.n=AS.cards.length; asSetFocus(); asDrawBar();
  }
  asNewSegment(); cancelAnimationFrame(AS.raf); AS.raf=requestAnimationFrame(asTick); }
function asToggle(){ AS.playing?asPause(false):asResume(); }
/* §38.4 — ▶ start en pauzeert. Buiten de autoscroll is die knop niet zichtbaar (v11.5.1 §40.2). */
function asPlayToggle(){ if(!AS.on) return; asToggle(); }
function asExit(){
  AS.on=false; AS.playing=false; AS.hold=false; clearTimeout(AS.holdT); cancelAnimationFrame(AS.raf);
  if(AS.cur) AS.cur.classList.remove('focus');
  AS.cur=null;
  AS.lead=false;
  AS.hide=null;                          /* §34.2 — buiten de autoscroll is de lijst weer volledig */

/* v11.10 §44.6 — ▶ met drie standen. Wit → start (en loopt meteen) · blauw → terug naar de
   lijst (de uitweg; er is geen aparte knop meer) · lichtblauw → verder. */
function asPlayTap(){
  if(fpackOpen()) setCompact(true);      /* §44.12 — ▶ klapt de selectierij dicht */
  closeSpeed();

/* v11.6 §41.10 · v11.7 §42.4 — ▶/❚❚ én de hele voortgangsbalk doen exact hetzelfde (V1):
   spelen/pauzeren, en het menublok volgt die stand — PAUZE toont het menu, PLAY verbergt het.
   Dat is het verschil met een tik op de kaartenzone (§41.8/§42.4): die pauzeert wel, maar laat
   het menu met rust. Buiten de autoscroll haalt een tik op de balk enkel het menu terug. */

function asBarTap(){

$('pp').onclick=asPlayTap;

/* v11.10 §44.8 — 🔀 en de beurtstand staan nu in de speelrij */
$('btnTurn').onclick=function(){ turnToggle(); };
/* ---- v11.10 §44.13 · v11.11 §45.1/§45.4 · DE BEURTSTAND ----
   Eén kaart, geen scrollen. v11.10 bouwde de VORM; v11.11 bouwt het GEDRAG:
   - §45.1 de stand loopt vanzelf door op dezelfde klok als de autoscroll (SPEEDS), en de
     doelkolom onthult zichzelf na `SET.turnPct` % van de tijd van die kaart;
   - §45.4 zelfde kaartbreedte als in de lijst · eender waar tikken onthult · eender waar
     vegen veegt de kaart · te lange kaarten krimpen tot ze passen (nooit scrollen).
   De autoscroll zelf is NIET aangeraakt: die blijft exact v11.8 (§43). De beurtstand leent
   enkel de knoppen (▶, snelheid, balk) en de scorelogica; de scroll-motor (asTick/asPick/
   asNewSegment) draait er niet, want met één zichtbare kaart is er geen geometrie om op te
   rekenen. */
/* `TURN` en `TU` staan bewust hoger in het bestand (bij de instellingen): asRenderSpeedMenu()
   en render() lezen ze al vóór dit blok, en een `let` hier zou daar een TDZ-fout geven. */
function turnPer(){ return (SPEEDS[SET.asSpeed]||2)*1000; }
function turnPct(){ const p=+SET.turnPct; return TPCTS.indexOf(p)>=0?p:50; }
function turnCard(){ const h=$('lst'); return h?h.querySelector('.scrollcard.focus'):null; }
function turnIsHidden(sc){ if(!sc) return false; const id=sc.dataset.sc;
  return SET.showAns?hidden.has(id):!revealed.has(id); }
/* Verbergen/onthullen gebeurt met dezelfde `revealed`/`hidden`-verzamelingen als in de lijst,
   niet met een eigen mechaniek — zo blijft er één waarheid over wat er dicht staat. */
function turnSetHide(sc,hide){
  if(!sc) return; const id=sc.dataset.sc; if(!id) return;
  if(hide){ if(SET.showAns) hidden.add(id); else revealed.delete(id); }
  else     { if(SET.showAns) hidden.delete(id); else revealed.add(id); }
  const c=sc.querySelector('.card'); if(c) refreshCard(c,id);
  turnFit();
}
function turnReveal(){ const sc=turnCard(); if(sc&&turnIsHidden(sc)) turnSetHide(sc,false); TU.shown=true; }
function turnRestartClock(){ TU.t0=performance.now(); TU.el=0; TU.shown=(turnPct()===0); }
/* §45.4d — enkel de BOVENKANT ligt vast. Past de kaart niet in het venster, dan wordt ze
   naar beneden toe geschaald tot ze past; er wordt nooit gescrold (uitdrukkelijke keuze van
   JHS, antwoord V5). De schaal staat op de `.scrollcard`, niet op de `.card`: die laatste
   draagt de veegverplaatsing en mag daar niet mee botsen. */
function turnFit(){
  const host=$('lst'), st=$('stage'); if(!host||!st) return;
  const sc=turnCard();
  [].slice.call(host.children).forEach(function(c){ if(c!==sc&&c.style.transform) c.style.transform=''; });
  if(!sc||!TURN){ if(sc) sc.style.transform=''; return; }
  sc.style.transform='';
  const avail=st.clientHeight-6, h=sc.offsetHeight;
  if(h>avail && avail>24 && h>0) sc.style.transform='scale('+Math.max(.35,avail/h).toFixed(4)+')';
}
function turnFocus(){
  if(!TURN) return;
  const host=$('lst'); if(!host) return;
  let cur=host.querySelector('.scrollcard.focus');
  if(!cur){ cur=host.querySelector('.scrollcard'); if(cur) cur.classList.add('focus'); }
  turnFit();
}
/* AS.cur is wat asScore(), de veeg en de balk gebruiken. In de beurtstand wijst hij naar de
   kaart in focus, zodat al die logica ongewijzigd kan blijven werken. */
function turnSyncCur(){
  const sc=turnCard();
  AS.cur=sc||null;
  if(sc){
    const i=AS.cards.indexOf(sc); if(i>=0) AS.idx=i;
    asFill(ITEMS.find(function(x){ return x.id===sc.dataset.sc; }));
  }
  turnFit();
}
/* handmatig doorstappen (na een veeg in de lijst, zonder lopende beurtstand) */
function turnStep(dir){
  const host=$('lst'); if(!host||!TURN||AS.on) return;
  const cur=turnCard();
  if(!cur) return turnFocus();
  let nx=(dir<0?cur.previousElementSibling:cur.nextElementSibling);
  if(!nx && dir>0 && shown<deck.length){ appendMore(); nx=cur.nextElementSibling; }
  if(!nx) return;
  cur.classList.remove('focus'); nx.classList.add('focus');
  /* V4 (JHS 2026-08-16): meteen de volgende kaart, met de antwoordkolom weer dicht */
  turnSetHide(nx,true);
}
/* §45.1 — de volgende kaart tijdens de lopende beurtstand */
function turnAdvance(){
  if(!TURN||!AS.on) return;
  const host=$('lst'); if(!host) return;
  const cur=turnCard();
  let nx=cur?cur.nextElementSibling:host.firstElementChild;
  if(!nx && shown<deck.length){ appendMore(); asRefreshCards(); nx=cur?cur.nextElementSibling:host.firstElementChild; }
  if(!nx){ turnRound(); return; }
  if(cur) cur.classList.remove('focus');
  nx.classList.add('focus');
  asRefreshCards();
  turnSyncCur();
  turnSetHide(nx,turnPct()>0);
  turnRestartClock();
  asDrawBar();
}
/* §45.1 — einde van de lijst: opnieuw schudden en van voor af aan, net als asRound() in de
   autoscroll (§34.3), maar zonder de scroll-geometrie. */
function turnRound(){
  AS.round++; AS.roundAt=performance.now();
  shuffleSeed=Math.random(); order={};
  asMakeHide();
  if(AS.cur) AS.cur.classList.remove('focus');
  AS.cur=null; AS.idx=0;
  AS.nok=0; AS.nbad=0;
  render();                              /* render() zet zelf de focus op de eerste kaart */
  $('stage').scrollTop=0;
  asRefreshCards(); AS.n=AS.cards.length;
  turnFocus(); turnSyncCur();
  turnSetHide(turnCard(),turnPct()>0);
  turnRestartClock(); asDrawBar();
}
/* §45.1 — de klok. Draait in dezelfde rAF-lus als de autoscroll (asTick), maar zonder scroll:
   op `turnPct` % van de tijd valt de kolom open, op 100 % van de tijd komt de volgende kaart.
   Op stand 100 % valt de kolom dus samen met het wisselen — dat is «nooit vanzelf onthullen»,
   en zo is het ook bedoeld: dan onthul je met een tik. */
function turnTick(){
  TU.el=performance.now()-TU.t0;
  const per=turnPer(), p=turnPct();
  /* v11.11.1 §46.2 — SCHERM UIT, DAN TERUG. De browser stopt met hertekenen zodra je de app
     niet meer ziet, maar de klok loopt door. Bij het terugkeren zag `turnTick()` een gat van
     tientallen seconden en haalde dat in één keer in: je sloeg een kaart over die je nooit
     gezien hebt. Is het gat groter dan drie kaartduren, dan is dat geen achterstand maar een
     onderbreking — de klok begint dan gewoon opnieuw op de kaart die er staat. */
  if(TU.el>per*3){ turnRestartClock(); asDrawBar(); return; }
  if(!TU.shown && p<100 && TU.el>=per*p/100) turnReveal();
  if(TU.el>=per){ turnAdvance(); return; }
  asBarProgress();
}
function turnToggle(){
  TURN=!TURN;
  $('phone').classList.toggle('turn',TURN);
  $('btnTurn').classList.toggle('on',TURN);
  if(TURN){
    turnFocus();
    if(AS.on){ asRefreshCards(); turnSyncCur(); turnSetHide(turnCard(),turnPct()>0); turnRestartClock(); }
  } else {
    const host=$('lst');
    if(host) [].slice.call(host.children).forEach(function(c){ c.style.transform=''; });
    if(host&&!AS.on) [].slice.call(host.querySelectorAll('.scrollcard.focus')).forEach(c=>c.classList.remove('focus'));
    /* v11.11.1 §46.3 — zet je de beurtstand uit terwijl je in IN DB, TO DO of ☀15 staat, dan
       geldt de blokkering van §42.3 wél weer: terug naar de lijst, zonder melding. */
    if(AS.on && asBlocked()){ asExit(); }
    else if(AS.on){ asApplyLead(); asRefreshCards(); asSetFocus(); asNewSegment(); }
  }
  asRenderSpeeds(); asPaintPlay(); asDrawBar();
  toastn(TURN?'Beurtstand — één kaart, geen scrollen.':'Lijst.');
}
/* de kaart mag herschalen als het venster van maat verandert (menu open/dicht, draaien) */
window.addEventListener('resize',function(){ if(TURN) turnFit(); });
/* v11.6 §41.15 — het greepje onderaan: menublok tonen of verbergen, in beide standen */
$('mgrip').onclick=function(){ asSetMenu(!MENUON); };
/* §38.4 · v11.6 §41.25 — het greepje van de tekstbalk staat achter TXTBAR; het blijft

/* ---- v11.6 §41.11/§41.12 · de snelheidsrij (de dropdown van §38.12 is weg) ---- */
$('spbtn').addEventListener('click',function(e){
  e.stopPropagation();
  if(this.disabled) return;
  const open=$('spmenu').classList.toggle('open');

$('spmenu').addEventListener('click',function(e){
  e.stopPropagation();
  /* v11.11 §45.3 — het onthulpercentage: het menu blijft open, want dit is een instelling
     die je naast de snelheid wil kunnen bijstellen zonder telkens opnieuw te moeten openen. */
  const p=e.target.closest('[data-pc]');
  if(p){ SET.turnPct=+p.dataset.pc; saveSet(); asRenderSpeedMenu();
    if(TURN&&AS.on&&!TU.shown&&turnPct()===0) turnReveal();
    return; }
  const b=e.target.closest('[data-sp]'); if(!b) return;
  SET.asSpeed=+b.dataset.sp; SET.asSpeedV=SPEEDV; saveSet();  /* §38.13 — blijft over sessies heen staan */
  asRenderSpeeds(); asPaintPlay(); closeSpeed();
  /* v11.11 §45.1 — in de beurtstand is er geen scroll-segment; de klok van de kaart begint
     gewoon opnieuw met de nieuwe duur. */
  if(TURN&&AS.on) turnRestartClock(); else asNewSegment();
  if(SPRESUME) asResume();
});

/* tik op het tekstveld = de trapsgewijze logica van §28.2; vegen blijft mogelijk */
function asFieldTap(){
  if(AS.scored) return;                        /* al afgerekend, wachten op de volgende kaart */
  AS.taps++;
  if(AS.taps===1){ asPaintState(); return; }
  asScore(true,false,AS.cur);                  /* 2e tik = hetzelfde als naar links vegen */
  $('nbword').classList.remove('hidden');
}
(function(){
  const w=$('nlwrap'); let sx=0,dx=0,dragging=false;
  const fld=function(){ return w.querySelector('.nlfield'); };
  w.addEventListener('pointerdown',function(e){ if(!AS.on) return;
    dragging=true; sx=e.clientX; dx=0; try{w.setPointerCapture(e.pointerId);}catch(_){} });
  w.addEventListener('pointermove',function(e){ if(!dragging) return; dx=e.clientX-sx;
    const el=fld(); if(el){ el.style.transition='none';
      el.style.transform='translateX('+dx+'px) rotate('+(dx*0.012)+'deg)'; }
    asTint(AS.cur, dx<0?Math.min(1,-dx/90):0, dx>0?Math.min(1,dx/90):0); });
  w.addEventListener('pointerup',function(){ if(!dragging) return; dragging=false;
    const el=fld(); if(el){ el.style.transition='transform .18s ease'; el.style.transform=''; }
    if(Math.abs(dx)<8) asFieldTap();
    else if(Math.abs(dx)>70){ if(!AS.scored) asScore(dx<0,false,AS.cur); else asTint(AS.cur,0,0); }
    else asTint(AS.cur,0,0);
    dx=0; });
  w.addEventListener('pointercancel',function(){ dragging=false; dx=0;
    const el=fld(); if(el) el.style.transform=''; asTint(AS.cur,0,0); });
})();

/* ===================== ZOEKEN ===================== */
let INDEX=[];
function buildIndex(){ const ix=[];
  ITEMS.forEach(function(it){ const lab=it.type==='woord'?(strip(it.hnl)+' — '+strip(it.hnb)):(it.nl+' — '+it.nb);
    const B=it.bm||{};   /* v8: bokmål blijft doorzoekbaar */
    const bmtxt=[B.h,B.s,B.nb,B.ph].concat(B.f?Object.keys(B.f).map(k=>B.f[k]):[])
      .concat((it.forms||[]).map(f=>f[2]||'')).filter(Boolean).join(' ');
    ix.push({m:it.type==='woord'?'woord':'zin',label:lab,
      key:(strip(textNB(it))+' '+strip(textNL(it))+' '+it.id+' '+strip(bmtxt)).toLowerCase(),
      go:function(){ mode='voc'; SET.types=['woord','zin']; SET.eps=[]; SET.themes=[]; SET.basis=false; SET.fsel=null; SET.nch=[]; SET.src=[]; SET.who=[]; subOpen.clear();
        filters={own:false,missing:false}; saveSet(); render();
        revealCard(it.id); }}); });        /* §28.5 — bijladen tot de kaart bestaat, dan scrollen */
  GRAMMAR.forEach(g=>ix.push({m:'grammatica',label:g.title,
    key:(g.title+' '+g.blocks.map(x=>x.sub+' '+strip(x.rule)).join(' ')).toLowerCase(),
    go:function(){ setMode('gram'); location.hash='#g_'+g.id; }}));
  return ix; }
function openSearch(){ INDEX=buildIndex(); mode='search';
  asSetMenu(true);                 /* v11.6 §41.15 — het zoekveld zit in het menublok */
  $('searchbar').classList.add('open'); $('searchinput').focus();
  $('stage').innerHTML='<div class="none">Typ om te zoeken in woorden, zinnen en grammatica.</div>'; renderPin(); }
function closeSearch(){ $('searchbar').classList.remove('open'); $('searchinput').value=''; }
/* v11.3 §32.8 — BUG: de lijst bleef staan waar ze stond. Bij 1-2 tekens zijn er altijd 60
   treffers (een lange lijst); zodra het 3de teken de lijst kort maakte, stonden de treffers
   bóven het kijkvenster en leek het scherm leeg. Elke zoekactie springt nu terug naar boven. */
function doSearch(q){ q=q.trim().toLowerCase();
  if(!q){ $('stage').innerHTML='<div class="none">Typ om te zoeken…</div>'; $('stage').scrollTop=0; return; }
  const hits=INDEX.filter(x=>x.key.indexOf(q)>=0).slice(0,60);
  if(!hits.length){ $('stage').innerHTML='<div class="none">Niets gevonden voor "'+esc(q)+'".</div>'; $('stage').scrollTop=0; return; }
  $('stage').scrollTop=0;
  $('stage').innerHTML='<div class="sres">'+hits.map((h,k)=>'<div class="hit" data-k="'+k+'"><div class="m">'+h.m+'</div><div class="t">'+h.label+'</div></div>').join('')+'</div>';
  document.querySelectorAll('.hit').forEach(el=>el.onclick=function(){ const h=hits[+el.dataset.k]; closeSearch(); h.go(); }); }
$('searchinput').oninput=e=>doSearch(e.target.value);
$('searchclr').onclick=()=>{ closeSearch(); setMode('voc'); };
$('btnSearch').onclick=()=>{ if(mode==='search'){ closeSearch(); setMode('voc'); } else openSearch(); };
$('dk').onclick=()=>{ SET.dark=!document.body.classList.contains('dark'); document.body.classList.toggle('dark',SET.dark);
  $('dk').textContent=SET.dark?'☀️':'🌙'; saveSet(); if(mode==='stats') renderStats(); };
$('dk').textContent=SET.dark?'☀️':'🌙';

/* ===================== STATISTIEK ===================== */
function statsData(days){
  const out=[];
  for(let i=days-1;i>=0;i--){ const d=DAILY[dayKey(i)]||{}; const dt=new Date(); dt.setDate(dt.getDate()-i);
    /* §29.5 — ok/bad zijn de totalen; aok/abad is het deel dat uit de autoscroll komt.
       De grafiek splitst dat in een donker (handmatig) en een licht (autoscroll) stuk. */
    const ok=d.ok||0, bad=d.bad||0;
    const aok=Math.min(ok,d.aok||0), abad=Math.min(bad,d.abad||0);
    out.push({d:dt.getDate(),ok:ok,bad:bad,aok:aok,abad:abad,nw:d.new||0,add:d.add||0}); }
  return out;
}
function streak(){ let n=0;
  for(let i=0;i<400;i++){ const d=DAILY[dayKey(i)]||{}; const act=(d.ok||0)+(d.bad||0);
    if(act>0) n++; else if(i>0) break; }
  return n; }
function pct7(){ let ok=0,bad=0; for(let i=0;i<7;i++){ const d=DAILY[dayKey(i)]||{}; ok+=d.ok||0; bad+=d.bad||0; }
  return (ok+bad)?Math.round(ok/(ok+bad)*100):0; }
function learnedCount(){ return ITEMS.filter(it=>bucket((getScore(it.id)||{}).ema)==='ok').length; }
function barChart(data){
  const W=330,H=158,L=24,R=322,base=138,top=16;
  const max=Math.max(5,...data.map(x=>x.ok+x.bad));
  const step=Math.max(1,Math.ceil(max/5));
  let lines='';
  for(let v=0;v<=max;v+=step){ const y=base-(v/max)*(base-top);
    lines+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+R+'" y2="'+y.toFixed(1)+'" class="gl"/><text x="20" y="'+(y+3).toFixed(1)+'" class="yl">'+v+'</text>'; }
  const n=data.length, span=(R-L)/n, bw=Math.min(14,span*0.56);
  const maxNew=Math.max(1,...data.map(x=>x.nw));
  let bars='', pts=[];
  const seg=function(cx,y0,h,fill){ return h<=0?'' :
    '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(y0-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2.5" fill="'+fill+'"/>'; };
  data.forEach(function(x,i){
    const cx=L+span*(i+0.5), tot=x.ok+x.bad, u=(base-top)/max;
    const hOk=x.ok*u, hBad=x.bad*u, hAok=x.aok*u, hAbad=x.abad*u;
    /* van onder naar boven: goed handmatig · goed autoscroll (licht) · fout handmatig · fout autoscroll (licht) */
    let y=base;
    bars+=seg(cx,y,hOk-hAok,'var(--ok)');        y-=(hOk-hAok);
    bars+=seg(cx,y,hAok,'var(--ok-lt)');         y-=hAok;
    bars+=seg(cx,y,hBad-hAbad,'var(--wrong)');   y-=(hBad-hAbad);
    bars+=seg(cx,y,hAbad,'var(--wrong-lt)');     y-=hAbad;
    if(tot) bars+='<text x="'+cx.toFixed(1)+'" y="'+(base-hOk-hBad-4).toFixed(1)+'" class="pl">'+Math.round(x.ok/tot*100)+'%</text>';
    pts.push([cx, base-(x.nw/maxNew)*(base-top)*0.55]);
  });
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dts=pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.4" class="lpt"/>').join('');
  const xl=data.map((x,i)=>(i%2===0||i===n-1)?'<text x="'+(L+span*(i+0.5)).toFixed(1)+'" y="152" class="xl">'+x.d+'</text>':'').join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Goed en fout per dag met nieuw geleerde woorden">'
    +lines+bars+'<path d="'+path+'" class="lln"/>'+dts+xl+'</svg>';
}
function addChart(data){
  const W=330,H=96,L=24,R=322,base=78,top=12;
  const max=Math.max(3,...data.map(x=>x.add));
  const step=Math.max(1,Math.ceil(max/3));
  let lines='';
  for(let v=0;v<=max;v+=step){ const y=base-(v/max)*(base-top);
    lines+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+R+'" y2="'+y.toFixed(1)+'" class="gl"/><text x="20" y="'+(y+3).toFixed(1)+'" class="yl">'+v+'</text>'; }
  const n=data.length, span=(R-L)/n, bw=Math.min(12,span*0.5);
  const bars=data.map(function(x,i){ if(!x.add) return ''; const cx=L+span*(i+0.5), h=(x.add/max)*(base-top);
    return '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(base-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="var(--accent)"/>'; }).join('');
  const xl=data.map((x,i)=>(i%2===0||i===n-1)?'<text x="'+(L+span*(i+0.5)).toFixed(1)+'" y="91" class="xl">'+x.d+'</text>':'').join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Zelf toegevoegde woorden per dag">'+lines+bars+xl+'</svg>';
}
function renderStats(){
  const data=statsData(14);
  const html='<div class="sthdr"><button class="bk" id="stBack">←</button>📊 Voortgang<button class="gnb" id="stFilter">⚙️ filter &amp; back-up</button></div>'
    +'<div class="tiles">'
    +'<div class="tile"><div class="v">🔥 '+streak()+'</div><div class="k">dagen op rij</div></div>'
    +'<div class="tile"><div class="v">'+pct7()+'<small>%</small></div><div class="k">juist (7 dgn)</div></div>'
    +'<div class="tile green"><div class="v">'+learnedCount()+'<small>/'+ITEMS.length+'</small></div><div class="k">geleerd (groen)</div></div>'
    +'</div>'
    +'<div class="chartcard"><div class="ctitle">Goed vs fout per dag &amp; nieuw geleerd</div>'
    +'<div class="clegend"><span><i style="background:var(--ok)"></i>goed</span><span><i style="background:var(--wrong)"></i>fout</span>'
    +'<span><i style="background:var(--ok-lt)"></i><i style="background:var(--wrong-lt)"></i>autoscroll</span><span><i class="ln"></i>nieuw geleerd</span></div>'
    +barChart(data)+'</div>'
    +'<div class="chartcard"><div class="ctitle">Zelf toegevoegde woorden per dag</div>'+addChart(data)+'</div>';

   doel wordt dan opnieuw bepaald: het net geopende overlay ligt op die plek, dus het scherm
   ging meteen weer dicht. Vandaar dat het potlood met de muis wél werkte en op de gsm niet.

let ovAt=0;
function openSheet(html){ ov.innerHTML='<div class="sheet">'+html+'</div>'; ov.classList.add('open');
  ovAt=Date.now();
  ov.querySelector('.sheet').addEventListener('click',e=>e.stopPropagation()); }

/* ---- v11.11 §45.6 · DE TERUGROLKNOP IS WEG ----
   §44.2 gaf het versienummer een blad met «één stap terug». Die knop wiste de service worker
   en alle caches en herlaadde — maar hij haalde daarna gewoon opnieuw op wat er op de server
   staat. Er ging dus niets terug; scores, swipes en notities stonden toch al veilig in
   localStorage. `VERSION`, `PREVVER`, `ROLLBACK`, `openVersion()` en `doRollback()` zijn
   volledig verwijderd, en het versienummer in de bovenbalk is weer gewone tekst.
   Wat WEL blijft: de regel «TERUGROLBAAR: ja / nee — waarom» bovenaan elk bouwverslag in
   REQUIREMENTS.md. Echt een stap terug kunnen is een publicatie-afspraak (elke build als
   eigen map online laten staan), geen code. */
function frow(f,ic,t,d,on,kind){ return '<div class="frow"><span class="fic">'+ic+'</span><div class="ftxt"><div class="t">'+t+'</div><div class="d">'+d+'</div></div>'
  +'<div class="sw '+(on?'on':'')+'" data-f="'+f+'" '+(kind?'data-kind="'+kind+'"':'')+'><i></i></div></div>'; }

function openFilter(){
  openSheet('<div class="sgrip"></div><h3>Filter &amp; weergave</h3>'
    +frow('own','✎','Enkel mijn toevoegingen','zelf toegevoegd',filters.own)
    +frow('missing','❓','Ontbrekende vertaling','NB of NL nog leeg — vraag partner',filters.missing)
    +frow('showAns','👁️','Noors meteen tonen','kaarten niet wazig starten',SET.showAns,'set')
    +'<div class="actions"><button class="btn cancel" id="fclear">Wis filter</button><button class="btn save" id="fapply">Toon resultaten</button></div>'
    +'<div class="manage"><div class="lbl">Synchronisatie (tussen je toestellen)</div>'
    +'<button class="mbtn" id="mSync">☁️ Nu synchroniseren — <span id="syncStat" style="font-weight:800;color:var(--accent)">'+syncState+'</span></button>'
    +'<div class="lbl" style="margin-top:12px">Back-up &amp; beheer</div>'
    +'<button class="mbtn" id="mExport">📤 Exporteer toevoegingen + scores</button>'
    +'<button class="mbtn" id="mImport">📥 Importeer</button>'
    +'<button class="mbtn" id="mReset">🗑️ Alle scores wissen…</button></div>');
  $('mSync').onclick=()=>syncNow();
  ov.querySelectorAll('.sw').forEach(s=>s.onclick=function(){ const k=s.dataset.f;
    if(s.dataset.kind==='set'){ SET.showAns=!SET.showAns; saveSet(); s.classList.toggle('on',SET.showAns); }
    else { filters[k]=!filters[k]; s.classList.toggle('on',filters[k]); } });
  $('fclear').onclick=()=>{ filters={own:false,missing:false}; SET.fsel=null; saveSet(); closeSheet(); render(); };
  $('fapply').onclick=()=>{ closeSheet(); render(); };
  $('mExport').onclick=openExport; $('mImport').onclick=openImport; $('mReset').onclick=openReset;
}
/* v11 §27.11 — exportversie 11; `who` zit in de items zelf, import van v10 en lager blijft werken */
function openExport(){ const data=JSON.stringify({v:11,items:USER,scores:scores,fav:[...FAV],notes:NOTES,corr:CORR,fluo:FLUO,daily:DAILY,gnote:GNOTE});
  openSheet('<div class="sgrip"></div><h3>Exporteer (back-up)</h3><div class="hintbox">💡 <div>Kopieer en bewaar dit. Geef het aan Claude en je toevoegingen én correcties komen mee in de officiële versie.</div></div>'
    +'<div class="field"><textarea id="exp" rows="7" readonly>'+esc(data)+'</textarea></div>'
    +'<div class="actions"><button class="btn cancel" id="c">Sluit</button><button class="btn save" id="cp">Kopieer</button></div>');
  $('c').onclick=closeSheet;
  $('cp').onclick=function(){ const ta=$('exp'); ta.select();
    try{navigator.clipboard.writeText(ta.value);}catch(e){document.execCommand('copy');} $('cp').textContent='Gekopieerd ✓'; }; }
function openImport(){ openSheet('<div class="sgrip"></div><h3>Importeer</h3><div class="hintbox">📥 <div>Plak een eerdere export. Alles wordt samengevoegd.</div></div>'
    +'<div class="field"><textarea id="imp" rows="7" placeholder=\'{"v":7,...}\'></textarea></div>'
    +'<div class="actions"><button class="btn cancel" id="c">Annuleer</button><button class="btn save" id="do">Importeer</button></div>');
  $('c').onclick=closeSheet;
  $('do').onclick=function(){ try{ const d=JSON.parse($('imp').value);
    if(Array.isArray(d.items)){ const ids=new Set(USER.map(x=>x.id)); d.items.forEach(it=>{ if(!ids.has(it.id)) USER.push(it); }); }
    if(d.scores) Object.assign(scores,d.scores);
    if(Array.isArray(d.fav)) d.fav.forEach(x=>FAV.add(x));
    if(d.notes) Object.assign(NOTES,d.notes);
    if(d.corr) Object.assign(CORR,d.corr);
    if(d.fluo) Object.assign(FLUO,d.fluo);
    if(d.daily) Object.assign(DAILY,d.daily);
    if(d.gnote){ Object.assign(GNOTE,d.gnote); save('sos_gnote_v6',GNOTE); }
    save('sos_user_v6',USER); save('sos_scores_v6',scores); saveFav(); saveNotes(); saveCorr(); saveFluo(); saveDaily();
    buildPool(); closeSheet(); render();
  }catch(e){ $('do').textContent='Ongeldig ✕'; } }; }
function openReset(){ openSheet('<div class="sgrip"></div><h3>Alle scores wissen?</h3><div class="hintbox">⚠️ <div>Dit wist je kennis-scores en geschiedenis. Je woorden, favorieten, markeringen en statistiek blijven.</div></div>'
    +'<div class="actions"><button class="btn cancel" id="c">Annuleer</button><button class="btn danger" id="do">Ja, wis scores</button></div>');
  $('c').onclick=closeSheet;
  $('do').onclick=function(){ scores={}; save('sos_scores_v6',scores); syncPushSoon(); closeSheet(); render(); }; }

/* ===================== TOEVOEGEN / BEWERKEN / CORRIGEREN ===================== */
function openGNote(gid){
  const g=GRAMMAR.find(x=>x.id===gid)||{title:gid};
  openSheet('<div class="sgrip"></div><h3>📝 Opmerking</h3>'
    +'<div class="field wide"><label>'+esc(g.title)+'</label>'
    +'<textarea id="gn" rows="4" placeholder="bv. Johanne zegt hier iets anders…">'+esc(GNOTE[gid]||'')+'</textarea></div>'
    +'<div class="hintbox">💡 <div>Deze notitie blijft bij dit hoofdstuk staan en komt mee bij de volgende sync.</div></div>'
    +'<div class="actions"><button class="btn cancel" id="c">Annuleer</button><button class="btn save" id="s">Bewaar</button></div>');
  $('c').onclick=closeSheet;
  $('s').onclick=function(){ const v=$('gn').value.trim(); if(v) GNOTE[gid]=v; else delete GNOTE[gid];
    saveGNote(); closeSheet(); render(); };
}
function openCorrection(it){
  openSheet('<div class="sgrip"></div><h3>Correctie doorgeven</h3>'
    +'<div class="hintbox">✏️ <div>Officieel woord — hier laat je een <b>correctie of opmerking</b> achter. Claude pikt die op bij de volgende sync en past het woord aan.</div></div>'
    +'<div class="field"><label>'+esc(strip(textNL(it)))+' — '+esc(strip(textNB(it)))+'</label>'
    +'<textarea id="corr" rows="4" placeholder="bv. klemtoon klopt niet, meervoud is …, betere vertaling is …">'+esc(corrOf(it))+'</textarea></div>'
    +'<div class="actions"><button class="btn cancel" id="c">Annuleer</button><button class="btn save" id="s">Bewaar</button></div>');
  $('c').onclick=closeSheet;
  $('s').onclick=function(){ const v=$('corr').value.trim(); if(v) CORR[it.id]=v; else delete CORR[it.id];
    saveCorr(); closeSheet(); render(); };
}
function openEditor(existing){
  const it=existing;
  /* v11 §27.5/§27.9 — eigen items (ook die met src:'somme') gaan naar het volledige
     bewerkscherm; officiële woorden krijgen het correctieformulier. */
  if(it && !USER.some(u=>u.id===it.id)){ openCorrection(it); return; }
  let who=it?(it.who||(it.src==='somme'?'johanne':'jan')):'jan';
  let type=it?it.type:'woord';
  let rawnl=it?((it._rawnl||(it.type==='woord'?strip(it.hnl):it.nl))||''):'';
  let rawbg=it?((it._rawbg||(it.type==='woord'?strip(it.hnb):it.nb))||''):'';
  let rawbm=it?((it._rawbm||(it.bm?strip(it.bm.h||it.bm.nb||''):''))||''):'';
  let frm=(it&&it._rawforms)?it._rawforms:'';
  let snb=it?(it.snb||''):'';
  let note=it?noteOf(it):'';
  let hitTimer=null;
  const val=id=>($(id)?$(id).value:'');
  function fld(id,lb,cls,v,ph){
    return '<div class="field '+cls+'"><label>'+lb+'</label><input id="'+id+'" value="'+esc(v)+'" placeholder="'+esc(ph||'')+'"></div>';
  }
  function snap(){ if($('enl')){ rawnl=val('enl'); rawbm=val('ebm'); rawbg=val('ebg');
    if($('efrm')) frm=val('efrm'); if($('esnb')) snb=val('esnb'); note=val('enote'); } }
  function draw(){
    openSheet('<div class="sgrip"></div><h3>'+(it?'Bewerk':'Nieuw item')+'</h3>'
      +'<div class="seg2"><button class="'+(type==='woord'?'on':'')+'" data-t="woord">Woord</button><button class="'+(type==='zin'?'on':'')+'" data-t="zin">Zin</button></div>'
      +'<div class="seglbl">van wie?</div>'
      +'<div class="seg3">'
        +'<button class="'+(who==='jan'?'on':'')+'" data-w="jan">Jan</button>'
        +'<button class="'+(who==='johanne'?'on':'')+'" data-w="johanne">Johanne</button>'
        +'<button class="'+(who==='lene'?'on':'')+'" data-w="lene">Emma &amp; Lene</button>'
      +'</div>'
      +fld('enl','NL','nl',rawnl,'')
      +fld('ebm','BOKM','nb',rawbm,'leeg → ik vul aan bij de sync')
      +fld('ebg','BERG','bg',rawbg,'leeg → gelijk aan bokmål')
      +(type==='woord'?fld('efrm','vormen:','',frm,'bilen, biler, bilene')+fld('esnb','vb-zin:','',snb,'Bilen står ute.'):'')
      +fld('enote','notitie:','',note,'eigen geheugensteun')
      +'<div class="actions">'+(it?'<button class="btn del" id="edel">Verwijder</button>':'<button class="btn cancel" id="ecan">Annuleer</button>')
      +'<button class="btn save" id="esave">Bewaar</button></div>');
    ov.querySelectorAll('.seg2 button').forEach(b=>b.onclick=function(){ snap(); type=b.dataset.t; draw(); });
    ov.querySelectorAll('.seg3 button').forEach(b=>b.onclick=function(){ snap(); who=b.dataset.w; draw(); });
    ['enl','ebm','ebg'].forEach(function(id){ const el=$(id); if(!el) return;
      el.oninput=function(){ clearTimeout(hitTimer); hitTimer=setTimeout(function(){ showHits(el); },200); };
      el.onblur=function(){ setTimeout(clearHits,180); }; });
    (it?$('edel'):$('ecan')).onclick=it?function(){doDelete(it);}:closeSheet;
    $('esave').onclick=doSave;
  }
  /* ---- live duplicaatzoek: klikbare lijst NL · BOKM · BERG ---- */
  function clearHits(){ const h=ov.querySelector('.ehits'); if(h) h.remove(); }
  function showHits(el){
    clearHits();
    const q=el.value.trim().toLowerCase(); if(q.length<2) return;
    const hits=ITEMS.filter(function(x){
      const bmt=x.bm?strip(x.bm.h||x.bm.nb||''):'';
      return (strip(textNL(x))+' '+strip(textNB(x))+' '+bmt).toLowerCase().indexOf(q)>=0;
    }).slice(0,20);
    if(!hits.length) return;
    const h='<div class="ehits"><div class="hh"><span>NL</span><span>BOKM</span><span>BERG</span></div>'
      +hits.map(function(x,i){ const bmt=x.bm?strip(x.bm.h||x.bm.nb||''):'';
        return '<div class="ehr" data-hit="'+i+'"><span class="c1">'+esc(strip(textNL(x)))+'</span>'
          +'<span class="c2">'+esc(bmt||'—')+'</span><span class="c3">'+esc(strip(textNB(x)))+'</span></div>'; }).join('')
      +'</div>';
    el.closest('.field').insertAdjacentHTML('beforeend',h);
    ov.querySelectorAll('.ehr').forEach(function(r){ r.onmousedown=function(ev){ ev.preventDefault();
      const x=hits[+r.dataset.hit]; closeSheet();
      mode='voc'; SET.src=[]; SET.eps=[]; SET.basis=false; SET.nch=[]; SET.who=[]; SET.fsel=null; subOpen.clear(); saveSet(); render();
      setTimeout(function(){ revealCard(x.id); },60); }; });   /* §28.5 — idem in het ＋-formulier */
  }
  function doSave(){
    const nl=val('enl').trim(), bm=val('ebm').trim(), bg=val('ebg').trim(), nt=val('enote').trim();
    const main=bg||bm;                       /* Bergens is de hoofdtaal; leeg → bokmål */
    if(!main&&!nl){ $('esave').textContent='Vul iets in ✕'; return; }
    const id=it?it.id:'u'+Date.now();
    /* v11 §27.5 — Jan → eigen woord (src 'own'); Johanne of Emma & Lene → bron Somme */
    const SRC=(who==='jan')?'own':'somme';
    let obj;
    if(type==='woord'){ const f=val('efrm').trim(), sn=val('esnb').trim();
      obj={id:id,type:'woord',kern:false,labels:[],episodes:(it&&it.episodes)||[],src:'own',tlbl:(it&&it.tlbl)||'',
        phNB:(it&&it.phNB)||'',phNL:(it&&it.phNL)||'',
        hnb:main?'<b>'+esc(main)+'</b>':'',hnl:nl?'<b>'+esc(nl)+'</b>':'',
        forms:f?f.split(',').map(x=>['',esc(x.trim())]):[],
        snb:sn?esc(sn):'',snl:'',_rawnl:nl,_rawbm:bm,_rawbg:bg,_rawnb:main,_rawforms:f};
      if(bm&&bm!==main) obj.bm={h:'<b>'+esc(bm)+'</b>'};
    } else {
      obj={id:id,type:'zin',labels:[],episodes:(it&&it.episodes)||[],src:'own',nb:esc(main),nl:esc(nl),
        ph:(it&&it.ph)||'',phNL:(it&&it.phNL)||'',_rawnl:nl,_rawbm:bm,_rawbg:bg};
      if(bm&&bm!==main) obj.bm={nb:esc(bm)};
    }
    obj.src=SRC; obj.mine=true;
    if(who==='jan'){ obj.labels=[]; delete obj.who; }
    else { obj.labels=['somme']; obj.who=who; }
    const i=USER.findIndex(x=>x.id===id);
    if(i>=0) USER[i]=obj;
    else { USER.push(obj); bumpDay('add'); seedWrong(id); save('sos_scores_v6',scores); }
    if(nt) NOTES[id]=nt; else delete NOTES[id];
    save('sos_user_v6',USER); saveNotes(); buildPool(); closeSheet(); render();
  }
  function doDelete(item){ openSheet('<div class="sgrip"></div><h3>Verwijderen?</h3><div class="hintbox">🗑️ <div>Gaat naar de prullenmand (terug te halen via import van je back-up).</div></div>'
    +'<div class="actions"><button class="btn cancel" id="c">Annuleer</button><button class="btn danger" id="d">Verwijder</button></div>');
    $('c').onclick=()=>openEditor(item);
    $('d').onclick=function(){ const i=USER.findIndex(x=>x.id===item.id);
      if(i>=0) USER[i].deleted=true; else USER.push(Object.assign({},item,{deleted:true}));
      save('sos_user_v6',USER); buildPool(); closeSheet(); render(); }; }
  draw();
}

/* ===================== FIT (tekst passend maken) ===================== */
function fitAll(){ requestAnimationFrame(function(){ document.querySelectorAll('.cell.w,.cell.f').forEach(fit); }); }
function fit(el){ el.style.fontSize=''; let s=parseFloat(getComputedStyle(el).fontSize),g=40;
  while(el.scrollWidth>el.clientWidth&&s>8&&g-->0){ s-=0.5; el.style.fontSize=s+'px'; } }

/* ===================== START ===================== */
/* v11.6 §41.25 — de tekstbalk en zijn greepje staan geparkeerd achter TXTBAR; zet die const
   bovenaan op true en de hele leesregel (incl. SET.astxtoff) komt in één keer terug. */
if(!TXTBAR) $('phone').classList.add('notxt');
/* v11.6 §41.15 — het menublok staat bij het opstarten open; het greepje onderaan volgt. */
asSetMenu(true);
/* v11.10 §44.9 — de bewaarde richting meteen op de knop en op .phone zetten */
paintDir();
render();
syncPull().then(function(ok){ render(); if(ok!==false) syncPush(); });
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
