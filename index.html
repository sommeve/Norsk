   greepje, naar ▶ en naar de balk. */
function asPause(soft){ AS.playing=false; cancelAnimationFrame(AS.raf);
  /* v11.11 §45.1 — in de beurtstand bevriest de klok van de lopende kaart bij een pauze */
  if(TURN&&AS.on) TU.el=performance.now()-TU.t0;
  asPaintPlay(); }
function asResume(){ if(!AS.on) return;
  AS.playing=true;
  /* v11.11 §45.1 — de beurtstand pikt de klok op waar ze stond; er is geen leadruimte en
     geen segment om te herberekenen. */
  if(TURN){ TU.t0=performance.now()-TU.el; asPaintPlay();
    cancelAnimationFrame(AS.raf); AS.raf=requestAnimationFrame(asTick); return; }
  /* v11.5.1 — de leadruimte van §34.4 komt er bij de EERSTE ▶: pas dan springt de lijst naar
     boven en komt kaart 1 van achter de onderbalk opzetten. Bij een latere pauze/verder blijft
     ze staan, anders zou de lijst onder je vingers verschuiven. */
  const eerste=!AS.lead;
  if(eerste){ AS.lead=true; }
  asPaintPlay();
  if(eerste){
    asApplyLead();
    $('stage').scrollTop=0;
    AS.idx=0; if(AS.cur) AS.cur.classList.remove('focus'); AS.cur=null;
    asRefreshCards(); AS.n=AS.cards.length; asSetFocus(); asDrawBar();
  }
  asNewSegment(); cancelAnimationFrame(AS.raf); AS.raf=requestAnimationFrame(asTick); }
function asToggle(){ AS.playing?asPause(false):asResume(); }
/* §38.4 — ▶ start en pauzeert. Buiten de autoscroll is die knop niet zichtbaar (v11.5.1 §40.2). */
function asPlayToggle(){ if(!AS.on) return; asToggle(); }
function asExit(){
  AS.on=false; AS.playing=false; AS.hold=false; clearTimeout(AS.holdT); cancelAnimationFrame(AS.raf);
  if(AS.cur) AS.cur.classList.remove('focus');
  AS.cur=null;
  AS.lead=false;
  AS.hide=null;                          /* §34.2 — buiten de autoscroll is de lijst weer volledig */
  $('phone').classList.remove('play','eye','playing');
  asClearLead();
  render();
  $('stage').scrollTop=0;
  asPaintPlay(); asDrawBar();
}
/* v11.10 §44.6 — ▶ met drie standen. Wit → start (en loopt meteen) · blauw → terug naar de
   lijst (de uitweg; er is geen aparte knop meer) · lichtblauw → verder. */
function asPlayTap(){
  if(fpackOpen()) setCompact(true);      /* §44.12 — ▶ klapt de selectierij dicht */
  closeSpeed();
  if(AS.on && AS.playing){ asExit(); return; }
  if(AS.on){ asResume(); return; }
  if(asBlocked()) return;
  asStart(); asResume();
}
/* v11.6 §41.10 · v11.7 §42.4 — ▶/❚❚ én de hele voortgangsbalk doen exact hetzelfde (V1):
   spelen/pauzeren, en het menublok volgt die stand — PAUZE toont het menu, PLAY verbergt het.
   Dat is het verschil met een tik op de kaartenzone (§41.8/§42.4): die pauzeert wel, maar laat
   het menu met rust. Buiten de autoscroll haalt een tik op de balk enkel het menu terug. */
/* v11.10 §44.6 — de balk start en hervat, maar stopt niet: stoppen is de blauwe ▶.
   Rij 2 blijft voortaan altijd staan (§44.11), dus het menu wordt niet meer weggeschoven. */
function asBarTap(){
  if(fpackOpen()){ setCompact(true); return; }
  closeSpeed();
  if(!AS.on){ if(asBlocked()) return; asStart(); asResume(); return; }
  if(!AS.playing) asResume();
}
$('pp').onclick=asPlayTap;
$('pbar').onclick=asBarTap;
/* v11.10 §44.8 — 🔀 en de beurtstand staan nu in de speelrij */
$('btnTurn').onclick=function(){ turnToggle(); };
/* ---- v11.10 §44.13 · v11.11 §45.1/§45.4 · DE BEURTSTAND ----
   Eén kaart, geen scrollen. v11.10 bouwde de VORM; v11.11 bouwt het GEDRAG:
   - §45.1 de stand loopt vanzelf door op dezelfde klok als de autoscroll (SPEEDS), en de
     doelkolom onthult zichzelf na `SET.turnPct` % van de tijd van die kaart;
   - §45.4 zelfde kaartbreedte als in de lijst · eender waar tikken onthult · eender waar
     vegen veegt de kaart · te lange kaarten krimpen tot ze passen (nooit scrollen).
   De autoscroll zelf is NIET aangeraakt: die blijft exact v11.8 (§43). De beurtstand leent
   enkel de knoppen (▶, snelheid, balk) en de scorelogica; de scroll-motor (asTick/asPick/
   asNewSegment) draait er niet, want met één zichtbare kaart is er geen geometrie om op te
   rekenen. */
/* `TURN` en `TU` staan bewust hoger in het bestand (bij de instellingen): asRenderSpeedMenu()
   en render() lezen ze al vóór dit blok, en een `let` hier zou daar een TDZ-fout geven. */
function turnPer(){ return (SPEEDS[SET.asSpeed]||2)*1000; }
function turnPct(){ const p=+SET.turnPct; return TPCTS.indexOf(p)>=0?p:50; }
function turnCard(){ const h=$('lst'); return h?h.querySelector('.scrollcard.focus'):null; }
/* ============ v11.25 §65.2 · DE FOCUSKAART IN DE GEWONE LIJST (D1.3) ============
   JHS' antwoord op D1.3: «de app duidt zelf een focuskaart aan; na scoren doorschuiven».
   Buiten de beurtstand en buiten de autoscroll krijgt de bovenste zichtbare kaart daarom de
   klasse `.focus` — dezelfde klasse die de beurtstand al gebruikt, zodat `turnCard()`,
   `turnScore()` en de twee grote knoppen ongewijzigd blijven werken. Eén waarheid, geen
   tweede mechaniek. Een streepje links op de kaart maakt zichtbaar wát je scoort. */
function listFocus(){
  if(TURN||AS.on||mode!=='voc') return;
  const host=$('lst'); if(!host||!host.children.length) return;
  const i=Math.min(Math.max(0,asListPos()-1),host.children.length-1);
  const want=host.children[i];
  const cur=host.querySelector('.scrollcard.focus');
  if(cur===want) return;
  if(cur) cur.classList.remove('focus');
  if(want&&want.classList.contains('scrollcard')) want.classList.add('focus');
  if(typeof landPaintBtns==='function') landPaintBtns();
}
/* Na het scoren doorschuiven — in de beurtstand doet `turnStep()` dat al; in de lijst
   verschuiven we de focus én de lijst met precies één kaart (`asListStep`, §41.13). */
function focusNext(){
  if(TURN){ turnStep(1); return; }
  const host=$('lst'), cur=turnCard(); if(!host||!cur) return;
  let nx=cur.nextElementSibling;
  if(!nx && shown<deck.length){ appendMore(); nx=cur.nextElementSibling; }
  if(!nx){ finShow(); return; }
  cur.classList.remove('focus'); nx.classList.add('focus');
  turnSetHide(nx,true);
  asListStep(cur);
}
function turnIsHidden(sc){ if(!sc) return false; const id=sc.dataset.sc;
  return SET.showAns?hidden.has(id):!revealed.has(id); }
/* Verbergen/onthullen gebeurt met dezelfde `revealed`/`hidden`-verzamelingen als in de lijst,
   niet met een eigen mechaniek — zo blijft er één waarheid over wat er dicht staat. */
function turnSetHide(sc,hide){
  if(!sc) return; const id=sc.dataset.sc; if(!id) return;
  if(hide){ if(SET.showAns) hidden.add(id); else revealed.delete(id); }
  else     { if(SET.showAns) hidden.delete(id); else revealed.add(id); }
  const c=sc.querySelector('.card'); if(c) refreshCard(c,id);
  turnFit();
}
function turnReveal(){ const sc=turnCard(); if(sc&&turnIsHidden(sc)) turnSetHide(sc,false); TU.shown=true; }
function turnRestartClock(){ TU.t0=performance.now(); TU.el=0; TU.shown=(turnPct()===0); }
/* §45.4d — enkel de BOVENKANT ligt vast. Past de kaart niet in het venster, dan wordt ze
   naar beneden toe geschaald tot ze past; er wordt nooit gescrold (uitdrukkelijke keuze van
   JHS, antwoord V5). De schaal staat op de `.scrollcard`, niet op de `.card`: die laatste
   draagt de veegverplaatsing en mag daar niet mee botsen. */
function turnFit(){
  const host=$('lst'), st=$('stage'); if(!host||!st) return;
  if(typeof landPaintBtns==='function') landPaintBtns();   /* v11.15.1 §52.4 */
  const sc=turnCard();
  [].slice.call(host.children).forEach(function(c){ if(c!==sc&&c.style.transform) c.style.transform=''; });
  if(!sc||!TURN){ if(sc) sc.style.transform=''; return; }
  sc.style.transform='';
  /* v11.15 §51.3 — in LANDSCAPE wordt er niet geschaald: de kaart staat bovenaan uitgelijnd
     en wordt onderaan afgeknipt («pech voor hoge kaarten», beslist door JHS). Zo blijven de
     eerste rijen en de klankregel altijd op dezelfde plaats staan. */
  if(LAND) return;
  const avail=st.clientHeight-6, h=sc.offsetHeight;
  if(h>avail && avail>24 && h>0) sc.style.transform='scale('+Math.max(.35,avail/h).toFixed(4)+')';
}
/* v11.20 §57.4 (D1.7) — JHS: «de eerste kaart (bij landscape?) toont zich regelmatig
   volledig, dus die is zinloos om te raden dan». GEVONDEN: turnFocus() duidde wel een
   focuskaart aan maar zette ze nooit dicht. Had je vóór het draaien in de lijst een kaart
   opengetikt, dan stond haar id nog in `revealed` en kwam ze in de beurtstand meteen volledig
   open. Nu wordt een NIEUW aangeduide focuskaart altijd dichtgezet; een kaart die de focus al
   had, wordt niet aangeraakt (anders zou §55.1 «terugbladeren onthult» weer dichtklappen). */
function turnFocus(){
  if(!TURN) return;
  const host=$('lst'); if(!host) return;
  let cur=host.querySelector('.scrollcard.focus');
  if(!cur){ cur=host.querySelector('.scrollcard');
    if(cur){ cur.classList.add('focus'); turnSetHide(cur,true); } }
  turnFit();
}
/* AS.cur is wat asScore(), de veeg en de balk gebruiken. In de beurtstand wijst hij naar de
   kaart in focus, zodat al die logica ongewijzigd kan blijven werken. */
function turnSyncCur(){
  const sc=turnCard();
  AS.cur=sc||null;
  if(sc){
    const i=AS.cards.indexOf(sc); if(i>=0) AS.idx=i;
    asFill(ITEMS.find(function(x){ return x.id===sc.dataset.sc; }));
  }
  turnFit();
}
/* handmatig doorstappen (na een veeg in de lijst, zonder lopende beurtstand) */
function turnStep(dir){
  const host=$('lst'); if(!host||!TURN||AS.on) return;
  const cur=turnCard();
  if(!cur) return turnFocus();
  let nx=(dir<0?cur.previousElementSibling:cur.nextElementSibling);
  if(!nx && dir>0 && shown<deck.length){ appendMore(); nx=cur.nextElementSibling; }
  /* v11.18 §55.3 — voorbij de laatste kaart blijft die niet meer eeuwig staan */
  if(!nx){ if(dir>0) finShow(); return; }
  cur.classList.remove('focus'); nx.classList.add('focus');
  /* V4 (JHS 2026-08-16): meteen de volgende kaart, met de antwoordkolom weer dicht */
  turnSetHide(nx,true);
}
/* §45.1 — de volgende kaart tijdens de lopende beurtstand */
function turnAdvance(){
  if(!TURN||!AS.on) return;
  const host=$('lst'); if(!host) return;
  const cur=turnCard();
  let nx=cur?cur.nextElementSibling:host.firstElementChild;
  if(!nx && shown<deck.length){ appendMore(); asRefreshCards(); nx=cur?cur.nextElementSibling:host.firstElementChild; }
  /* v11.18 §55.3 — hier stond `turnRound()` (automatisch opnieuw schudden). JHS wil eerst het
     eindscherm zien en zelf beslissen; `turnRound()` blijft bestaan maar wordt niet meer
     aangeroepen, zodat §45.1 terugrolbaar blijft. */
  if(!nx){ finShow(); return; }
  if(cur) cur.classList.remove('focus');
  nx.classList.add('focus');
  LB.card=null; LB.snap=null;      /* v11.15 §51.4.6 — nieuwe kaart, niets meer terug te draaien */
  asRefreshCards();
  turnSyncCur();
  turnSetHide(nx,turnPct()>0);
  turnRestartClock();
  asDrawBar();
}
/* §45.1 — einde van de lijst: opnieuw schudden en van voor af aan, net als asRound() in de
   autoscroll (§34.3), maar zonder de scroll-geometrie. */
function turnRound(){
  AS.round++; AS.roundAt=performance.now();
  shuffleSeed=Math.random(); order={};
  asMakeHide();
  if(AS.cur) AS.cur.classList.remove('focus');
  AS.cur=null; AS.idx=0;
  AS.nok=0; AS.nbad=0;
  LB.card=null; LB.snap=null;            /* v11.15 §51.4.6 — nieuwe ronde, niets terug te draaien */
  render();                              /* render() zet zelf de focus op de eerste kaart */
  $('stage').scrollTop=0;
  asRefreshCards(); AS.n=AS.cards.length;
  turnFocus(); turnSyncCur();
  turnSetHide(turnCard(),turnPct()>0);
  turnRestartClock(); asDrawBar();
}
/* ============ v11.18 §55.1 · IN LANDSCAPE BLADERT EEN VEEG ============
   JHS: «if i swipe on a card, then i can go back or forward to a previous/next card — so no
   bad/good swipe then — (i sometimes want to see what i did wrong)». Naar LINKS vegen = de
   VOLGENDE kaart, naar rechts de vorige, als een blad omslaan (antwoord 1 van C5.5).
   Scoren blijft in landscape uitsluitend bij de twee grote knoppen (§51.3.2 is niet geraakt).
   `LB.card`/`LB.snap` worden gewist bij élke sprong: anders zou een score op de nieuwe kaart
   de score van de vorige terugdraaien (§51.4.6).
   Terugbladeren ONTHULT de kaart — dat is precies waarom JHS het vroeg («see what i did
   wrong»); vooruitbladeren doet de antwoordkolom weer dicht, net als turnStep/turnAdvance. */
function turnGo(dir){
  if(!TURN) return;
  const host=$('lst'); if(!host) return;
  const cur=turnCard();
  if(!cur){ turnFocus(); return; }
  let nx=(dir<0?cur.previousElementSibling:cur.nextElementSibling);
  if(!nx && dir>0 && shown<deck.length){ appendMore(); asRefreshCards(); nx=cur.nextElementSibling; }
  if(!nx){ if(dir>0) finShow(); return; }   /* §55.3 — voorbij de laatste kaart = het einde */
  cur.classList.remove('focus'); nx.classList.add('focus');
  LB.card=null; LB.snap=null;
  if(AS.on){ asRefreshCards(); turnSyncCur(); }
  turnSetHide(nx, dir>0 ? (AS.on?turnPct()>0:true) : false);
  if(AS.on) turnRestartClock();
  turnFit(); asDrawBar();
}

/* ============ v11.18 §55.3 · HET EINDE VAN DE REEKS ============
   JHS: «when i am at the end, the last card remains there eternally which is not good. I want
   no card showed (you can replace with simple text: "Finished! Click here to shuffle and
   repeat.") and when i click anywhere there, that effectively happens (= the same as the
   shuffle button). And automatically fully show the full selection menu».
   Geldt in BEIDE standen: de beurtstand (turnAdvance/turnStep/turnGo) én de autoscroll
   (asTick). Vóór v11.18 schudden `turnRound()` en `asRound()` daar vanzelf opnieuw; die twee
   worden niet meer aangeroepen, maar blijven staan zodat §45.1/§34.3 terugrolbaar zijn. */
var FIN=false;   /* var, niet let: render() staat hoger in het bestand en roept finClear() aan; met let zou dat een TDZ-fout geven bij het allereerste tekenen */
function finClear(){
  if(!FIN) return;
  FIN=false;
  const p=$('phone'); if(p) p.classList.remove('fin');
  const el=$('finish'); if(el&&el.parentNode) el.parentNode.removeChild(el);
}
function finShow(){
  if(FIN) return;
  const st=$('stage'); if(!st) return;
  FIN=true;
  /* de klok (beurtstand) én de scroll (autoscroll) stilzetten: er is niets meer te tonen.
     Zacht, zodat het menublok niet nog eens opspringt bovenop wat we hieronder zelf openen. */
  if(AS.on&&AS.playing) asPause(true);
  const cur=turnCard(); if(cur) cur.classList.remove('focus');
  AS.cur=null;
  LB.card=null; LB.snap=null;              /* geen kaart meer = niets meer terug te draaien */
  $('phone').classList.add('fin');
  const d=document.createElement('div');
  d.className='finish'; d.id='finish';
  d.innerHTML='<b>Finished!</b><span>Click here to shuffle and repeat.</span>';
  d.addEventListener('click',function(e){ e.stopPropagation(); finTap(); });
  st.appendChild(d);
  st.scrollTop=0;
  /* antwoord 4 van C5.5 — portrait: het gewone menublok opengeklapt; landscape: het
     schermvullende paneel van §55.2, want daar staat het menublok toch op display:none. */
  if(LAND){ if(typeof fullOpen==='function') fullOpen(); }
  else { asSetMenu(true); setCompact(false); }
  asDrawBar(); landPaintBtns();
}
/* «a tik erop = exact de schudknop», daarna de stand opnieuw opzetten zoals turnRound()/
   asRound() dat deden: ronde vooruit, tellers op nul, focus op de eerste kaart. */
function finTap(){
  finClear();
  onCtl('shuf');                           /* zelfde als #btnShuf: nieuwe schudbeurt + render() */
  AS.round++; AS.roundAt=performance.now();
  AS.cur=null; AS.idx=0; AS.nok=0; AS.nbad=0;
  LB.card=null; LB.snap=null;
  if(AS.on){ asRefreshCards(); AS.n=AS.cards.length; }
  if(TURN){
    turnFocus(); if(AS.on) turnSyncCur();
    turnSetHide(turnCard(),AS.on?turnPct()>0:true);
    turnRestartClock();
  } else if(AS.on){ asSetFocus(); asNewSegment(); }
  asDrawBar();
}

/* §45.1 — de klok. Draait in dezelfde rAF-lus als de autoscroll (asTick), maar zonder scroll:
   op `turnPct` % van de tijd valt de kolom open, op 100 % van de tijd komt de volgende kaart.
   Op stand 100 % valt de kolom dus samen met het wisselen — dat is «nooit vanzelf onthullen»,
   en zo is het ook bedoeld: dan onthul je met een tik. */
function turnTick(){
  /* v11.15 §51.4.1 — een ingedrukte landscape-knop zet de klok stil. Omdat de onthulling
     (`turnReveal`) en de balk (`asBarProgress`) allebei uit dezelfde klok lezen, bevriezen
     die vanzelf mee: één regel volstaat. */
  if(TU.hold) return;
  TU.el=performance.now()-TU.t0;
  const per=turnPer(), p=turnPct();
  /* v11.11.1 §46.2 — SCHERM UIT, DAN TERUG. De browser stopt met hertekenen zodra je de app
     niet meer ziet, maar de klok loopt door. Bij het terugkeren zag `turnTick()` een gat van
     tientallen seconden en haalde dat in één keer in: je sloeg een kaart over die je nooit
     gezien hebt. Is het gat groter dan drie kaartduren, dan is dat geen achterstand maar een
     onderbreking — de klok begint dan gewoon opnieuw op de kaart die er staat. */
  if(TU.el>per*3){ turnRestartClock(); asDrawBar(); return; }
  if(!TU.shown && p<100 && TU.el>=per*p/100) turnReveal();
  if(TU.el>=per){ turnAdvance(); return; }
  asBarProgress();
}
function turnToggle(){
  TURN=!TURN;
  $('phone').classList.toggle('turn',TURN);
  $('btnTurn').classList.toggle('on',TURN);
  if(TURN){
    turnFocus();
    if(AS.on){ asRefreshCards(); turnSyncCur(); turnSetHide(turnCard(),turnPct()>0); turnRestartClock(); }
  } else {
    const host=$('lst');
    if(host) [].slice.call(host.children).forEach(function(c){ c.style.transform=''; });
    if(host&&!AS.on) [].slice.call(host.querySelectorAll('.scrollcard.focus')).forEach(c=>c.classList.remove('focus'));
    /* v11.11.1 §46.3 — zet je de beurtstand uit terwijl je in IN DB, TO DO of ☀15 staat, dan
       geldt de blokkering van §42.3 wél weer: terug naar de lijst, zonder melding. */
    if(AS.on && asBlocked()){ asExit(); }
    else if(AS.on){ asApplyLead(); asRefreshCards(); asSetFocus(); asNewSegment(); }
  }
  asRenderSpeeds(); asPaintPlay(); asDrawBar(); landPaint();
  toastn(TURN?'Beurtstand — één kaart, geen scrollen.':'Lijst.');
}

/* ================= v11.15 §51 · DE BEURTSTAND IN LANDSCAPE =================
   Draai je het toestel dwars, dan schakelt de app naar de beurtstand en blijft daar ook na
   het terugdraaien. De lijst en de autoscroll bestaan niet in landscape; scoren gaat er enkel
   nog via de twee grote knoppen naast de kaart (links groen = juist, rechts rood = fout).
   De hele stand hangt aan de klasse `.land`, die HIER gezet wordt op basis van matchMedia —
   zo lezen CSS en JS gegarandeerd hetzelfde. */
const LANDMQ=window.matchMedia('(orientation:landscape)');
/* §51.4.4 — «exact gelijktijdig loslaten» bestaat niet in JS: twee pointerup's komen altijd
   na elkaar. Alles binnen dit venster geldt als gelijktijdig, en dan wordt er NIET gescoord —
   veiliger dan willekeurig een van de twee boeken. */
const LANDSIM=40;
const LB={g:false,r:false,rel:0,card:null,snap:null};

/* §51.1.3 — de beurtstandknop staat blauw maar op slot zolang het toestel dwars staat.
   De reshuffle (#btnShuf) blijft gewoon werken; die is ook in de beurtstand zinvol. */
function landPaint(){
  const b=$('btnTurn'); if(!b) return;
  b.disabled=LAND;
  b.classList.toggle('on',TURN);
  b.title=LAND?'beurtstand — vast zolang het toestel dwars staat':'beurtstand / lijst';
}
/* ============ v11.18 §55.2 · RIJ 1 IN LANDSCAPE ============
   `#btnDir` (JHS' «BO?») en `#btnBM` verhuizen FYSIEK naar `.prow`, rechts van de
   voortgangsbalk en de teller, met `#btnFull` uiterst rechts. Bij het terugdraaien gaan ze
   even fysiek terug naar `#statrow`, waar ze de laatste twee knoppen waren — appendChild
   herstelt dus vanzelf de oorspronkelijke volgorde. Verplaatsen in plaats van kopiëren:
   één knop, één id, alle bestaande handlers en al het inkleuren blijven werken. */
/* v11.25 §66 (D1.12) — ⚙ · 📖 · 👁 · 🔍 · ＋ verhuizen in landscape MEE naar rij 1, zodat
   `.statrow` daar leeg achterblijft en met één CSS-regel verdwijnt. Verplaatsen, niet kopiëren
   (zelfde afspraak als §55.2/§57.5): er bestaat nooit een tweede stel knoppen dat uit de pas
   kan lopen, en alle klikhandlers blijven ongewijzigd.
   ⚠ De volgorde bij het terugzetten is de oorspronkelijke van `.statrow`. */
/* v11.26 §69.1 — JHS, 2026-08-22: «de oogjes knop moest eruit bij landscape». `btnBlur` gaat
   dus NIET mee naar rij 1 en blijft in `.statrow`, die in landscape op `display:none` staat —
   daarmee is hij daar weg, zonder een tweede stel knoppen of een extra regel. */
const LANDROW1=['btnCfg','btnGram','btnSearch','btnAdd'];
function landRow1(on){
  const prow=document.querySelector('.prow'), row=$('statrow');
  /* v11.20 §57.5 (D1.10) — #btnFON verhuist mee met #btnBM (bevestigd door JHS). */
  const d=$('btnDir'), b=$('btnBM'), n=$('btnFON'), f=$('btnFull');
  if(!prow||!row||!d||!b) return;
  const host=on?prow:row;
  LANDROW1.forEach(function(id){ const e=$(id); if(e) host.appendChild(e); });
  host.appendChild(d); host.appendChild(b); if(n) host.appendChild(n);
  if(on&&f) prow.appendChild(f);
}
/* Het schermvullende selectiemenu — «until i click that button again». Het paneel houdt geen
   eigen kopie van de knoppen bij: `#fgrid`, `#srcrow` en `#subrows` VERHUIZEN erheen en
   daarna weer terug naar `#menublk`. Zo blijft `render()` (die hun innerHTML herschrijft) en
   blijven alle klikhandlers ongewijzigd, en is er nooit een tweede stel knoppen dat uit de
   pas kan lopen. In `#menublk` komen ze achter `#fpack` terug te staan — de oude volgorde. */
var FULL=false;
function fullMove(to){
  const host=to?$('fullselin'):$('menublk');
  /* v11.23 §62 — het balkje hangt nu buiten #fgrid, dus verhuist de WRAPPER mee. */
  const a=$('fwrap')||$('fgrid'), b=$('srcrow'), c=$('subrows');
  if(!host||!a||!b||!c) return;

}

function fullOpen(){

  /* de knoppenrijen blijven bovenop liggen (zie CSS); zonder deze marge zou de onderkant van
     het paneel eronder verdwijnen. De hoogte wordt gemeten, niet geraden. */
  const pin=document.querySelector('.pin');
  p.style.paddingBottom=((pin?pin.offsetHeight:0)+10)+'px';
  $('phone').classList.add('fullon');
  p.classList.add('on'); fullPaint();
}
function fullClose(){
  if(!FULL) return;
  FULL=false;
  const p=$('fullsel'); if(p){ p.classList.remove('on'); p.style.paddingBottom=''; }
  $('phone').classList.remove('fullon');
  fullMove(false); fullPaint();
}
function fullToggle(){ FULL?fullClose():fullOpen(); }

function applyLand(){
  const on=!!LANDMQ.matches;
  if(on!==LAND){
    LAND=on;
    $('phone').classList.toggle('land',on);
    document.body.classList.toggle('land',on);
    /* §51.1.4 — draaien pauzeert een lopende play. Anders begin je blind aan een kaart die
       al half voorbij is. JHS drukt zelf ▶. Zacht, zodat het menu niet opspringt. */
    if(AS.on&&AS.playing) asPause(true);
    landClear();                       /* een ingedrukte knop overleeft het draaien niet */
    /* v11.18 §55.2 — de twee knoppen van rij 2 verhuizen mee met de stand, en het
       schermvullende paneel bestaat enkel in landscape: bij het terugdraaien moet het dicht
       (én moeten #fgrid/#srcrow/#subrows terug in #menublk staan) vóór er iets getekend wordt. */
    if(!on) fullClose();
    landRow1(on);
    /* §51.1.1 — landscape = ALTIJD de beurtstand. §51.1.2 — en dat blijft zo na het
       terugdraaien; één kort toastje, zodat je niet zonder het te merken je lijststand kwijt
       bent (renderPin/landPaint zetten #btnTurn dan vanzelf blauw). */
    if(on){ if(!TURN) turnToggle();
      /* v11.20 §57.4 (D1.7) — JHS: «zeker dat het in landscape altijd dicht staat». Draaien
         naar landscape zet de kaart in focus uitdrukkelijk dicht, ook als ze al focus had:
         anders draai je met een al onthulde kaart de beurtstand binnen. */
      const sc0=(typeof turnCard==='function')?turnCard():null;
      if(sc0) turnSetHide(sc0,true);
    }
    else if(TURN){ toastn('Beurtstand aan — ze blijft aan na het terugdraaien.'); }
  }
  landPaint(); landPaintBtns();
  if(TURN) turnFit();
}
/* §51.4.1 — de klok stilzetten zonder haar te verliezen. Bij het loslaten wordt de pauze
   weggewerkt als een VERSCHUIVING van t0 (t0 = nu − el), niet als een gat: anders ziet
   turnTick() een sprong van tientallen seconden en slaat de inhaalbeveiliging van §46.2 aan. */
function landClockStop(){
  if(TU.hold||!(TURN&&AS.on&&AS.playing)) return;
  TU.el=performance.now()-TU.t0; TU.hold=true;
}
function landClockGo(){
  if(!TU.hold) return;
  TU.hold=false; TU.t0=performance.now()-TU.el;
}
function landBtn(k){ return $(k==='g'?'bigOk':'bigBad'); }
/* v11.15.1 §52.4 — de twee knoppen staan BLEEK zolang er nog iets te onthullen valt en er geen
   play loopt. Een druk onthult dan (in plaats van te scoren); daarna staan ze vol groen en rood.
   Tijdens de play blijven ze altijd vol: daar onthult de klok (uitdrukkelijke keuze van JHS). */
/* v11.16 §53.2 — de twee knoppen bestaan nu ook in portrait (halfdoorzichtig, linksonder en
   rechtsonder). De bleek-regel hangt daarom niet meer aan LAND maar aan TURN: buiten de
   beurtstand staan ze toch niet op het scherm. */
/* v11.25 §65.2 — §52.4 gold enkel in de beurtstand. Nu ook in de gewone lijst: staat het
   antwoord nog dicht, dan onthult de eerste druk en scoort pas de tweede. */
function landPale(){ return !AS.on && turnIsHidden(turnCard()); }
function landPaintBtns(){
  const p=landPale();
  ['g','r'].forEach(function(k){ const el=landBtn(k); if(el) el.classList.toggle('pale',p); });
}
function landClear(){
  ['g','r'].forEach(function(k){ if(LB[k]){ LB[k]=false; const el=landBtn(k); if(el) el.classList.remove('down'); } });
  LB.rel=0; landClockGo();
}
function landDown(k,e){
  if(LB[k]) return;
  LB[k]=true;
  const el=landBtn(k); el.classList.add('down');
  try{ el.setPointerCapture(e.pointerId); }catch(_){}
  landClockStop();                     /* §51.4.1 — indrukken pauzeert, ook de onthulling */
}
function landUp(k,e,cancel){
  if(!LB[k]) return;
  LB[k]=false;
  const el=landBtn(k); el.classList.remove('down');
  try{ el.releasePointerCapture(e.pointerId); }catch(_){}
  /* §51.4.3 — is de andere knop nog ingedrukt, dan blijft de klok gepauzeerd en doet deze
     knop niets. De LAATSTE die je loslaat geeft de score. */
  if(LB.g||LB.r){ if(!cancel) LB.rel=performance.now(); return; }
  landClockGo();                       /* §51.4.2 — verder op exact dezelfde stand */
  const sim=!!LB.rel&&(performance.now()-LB.rel)<=LANDSIM;
  LB.rel=0;
  if(cancel) return;                   /* §51.4.7 — weggegleden vóór het loslaten = annuleren */
  if(sim) return;                      /* §51.4.4 — exact gelijktijdig = geen score */
  /* §52.4 — staat de knop bleek, dan onthult deze druk enkel; de volgende scoort. */
  if(landPale()){ turnSetHide(turnCard(),false); landPaintBtns(); return; }
  turnScore(k==='g');
}
function turnScore(ok){
  const sc=turnCard(); if(!sc) return;
  const id=sc.dataset.sc; if(!id) return;
  if(!(TURN&&AS.on)){
    /* §51.5 — de handmatige beurtstand: er loopt geen klok, dus een tik scoort én gaat
       meteen naar de volgende kaart. Anders sta je stil. */
    scoreItem(id,ok?1:0,false);
    if(ok) AS.nok++; else AS.nbad++;
    asTint(sc,ok?1:0,ok?0:1);
    setTimeout(function(){ asTint(sc,0,0); },380);
    focusNext();                       /* v11.25 §65.2 — ook in de gewone lijst doorschuiven */
    asDrawBar(); renderPin();
    return;
  }
  /* §51.4.6 — de LAATSTE score telt. Druk je groen en daarna toch rood, dan geldt rood zolang
     de kaart nog staat: de vorige score wordt eerst teruggedraaid (historiek, dagteller, de
     ↩✗-stapel én de groen/rode teller van de balk), niet dubbel geboekt.
     §51.4.5 — de kaart blijft daarna gewoon haar volle duur staan; scoren verzet de klok niet. */
  if(LB.card===sc&&LB.snap) turnScoreUndo();
  const k=skey(id);
  LB.card=sc;
  LB.snap={k:k, prev:scores[k]?JSON.parse(JSON.stringify(scores[k])):null,
           day:JSON.parse(JSON.stringify(DAILY[todayKey()]||{ok:0,bad:0,new:0,add:0})),
           bad:AS.badLog.length, ok:ok};
  asScore(ok,false,sc);
}
function turnScoreUndo(){
  const s=LB.snap; if(!s) return;
  if(s.prev) scores[s.k]=s.prev; else delete scores[s.k];
  save('sos_scores_v6',scores);
  DAILY[todayKey()]=s.day; saveDaily();
  if(AS.badLog.length>s.bad){ AS.badLog.length=s.bad; asUpdUndo(); }
  if(s.ok) AS.nok=Math.max(0,AS.nok-1); else AS.nbad=Math.max(0,AS.nbad-1);
  LB.snap=null; LB.card=null;
  syncPushSoon();
}
/* §51.8 — pointerdown/up/cancel met setPointerCapture, GEEN click: met click krijg je de
   pauze niet, want die begint bij het indrukken en eindigt bij het loslaten. Of je vinger bij
   het loslaten nog op de knop stond, meten we zelf: door de vangst blijft de knop het doel,
   ook als je ernaast loslaat, en dan geldt §51.4.7 (annuleren). */
['g','r'].forEach(function(k){
  const el=landBtn(k); if(!el) return;
  el.addEventListener('pointerdown',function(e){ e.preventDefault(); landDown(k,e); });
  el.addEventListener('pointerup',function(e){
    const r=el.getBoundingClientRect();
    const out=e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom;
    landUp(k,e,out); });
  el.addEventListener('pointercancel',function(e){ landUp(k,e,true); });
});

let INDEX=[];
function buildIndex(){ const ix=[];
  ITEMS.forEach(function(it){ const lab=it.type==='woord'?(strip(it.hnl)+' — '+strip(it.hnb))
      :(it.type==='conv'?('💬 '+(it.title||'Gesprekje')):(it.nl+' — '+it.nb));   /* v11.16 §53.1 — een gesprekje toont zijn titel, niet zes zinnen na elkaar */
    const B=it.bm||{};   /* v8: bokmål blijft doorzoekbaar */
    let bmtxt=[B.h,B.s,B.nb,B.ph].concat(B.f?Object.keys(B.f).map(k=>B.f[k]):[])
      .concat((it.forms||[]).map(f=>f[2]||'')).filter(Boolean).join(' ');
    /* v11.16 §53.1 — bij een gesprekje zit de klank en het bokmål PER REGEL; alles mee in de
       zoeksleutel, zodat «kjøleskapet» of «kaffe» het gesprekje ook echt vindt. */
    if(it.type==='conv') bmtxt+=' '+(it.lines||[]).map(function(l){
      const b=l.bm||{}; return [l.ph,b.nb,b.ph].filter(Boolean).join(' '); }).join(' ');
    ix.push({m:it.type==='woord'?'woord':(it.type==='conv'?'gesprekje':'zin'),label:lab,
      key:(strip(textNB(it))+' '+strip(textNL(it))+' '+it.id+' '+strip(bmtxt)).toLowerCase(),
      go:function(){ mode='voc'; SET.types=['woord','zin','conv']; SET.eps=[];   /* v11.16 §53.1 */ SET.themes=[]; SET.basis=false; SET.fsel=null; SET.nch=[]; SET.src=[]; SET.who=[]; subOpen.clear();
        filters={own:false,missing:false}; saveSet(); render();
        revealCard(it.id); }}); });        /* §28.5 — bijladen tot de kaart bestaat, dan scrollen */
  GRAMMAR.forEach(g=>ix.push({m:'grammatica',label:g.title,
    key:(g.title+' '+g.blocks.map(x=>x.sub+' '+strip(x.rule)).join(' ')).toLowerCase(),
    go:function(){ setMode('gram'); location.hash='#g_'+g.id; }}));
  return ix; }
function openSearch(){ INDEX=buildIndex(); mode='search';

  $('searchbar').classList.add('open'); $('searchinput').focus();

/* v11.3 §32.8 — BUG: de lijst bleef staan waar ze stond. Bij 1-2 tekens zijn er altijd 60
   treffers (een lange lijst); zodra het 3de teken de lijst kort maakte, stonden de treffers
   bóven het kijkvenster en leek het scherm leeg. Elke zoekactie springt nu terug naar boven. */
function doSearch(q){ q=q.trim().toLowerCase();
  if(!q){ $('stage').innerHTML='<div class="none">Typ om te zoeken…</div>'; $('stage').scrollTop=0; return; }
  const hits=INDEX.filter(x=>x.key.indexOf(q)>=0).slice(0,60);

  $('stage').scrollTop=0;
  $('stage').innerHTML='<div class="sres">'+hits.map((h,k)=>'<div class="hit" data-k="'+k+'"><div class="m">'+h.m+'</div><div class="t">'+h.label+'</div></div>').join('')+'</div>';
  document.querySelectorAll('.hit').forEach(el=>el.onclick=function(){ const h=hits[+el.dataset.k]; closeSearch(); h.go(); }); }

function statsData(days){
  const out=[];
  for(let i=days-1;i>=0;i--){ const d=DAILY[dayKey(i)]||{}; const dt=new Date(); dt.setDate(dt.getDate()-i);
    /* §29.5 — ok/bad zijn de totalen; aok/abad is het deel dat uit de autoscroll komt.
       De grafiek splitst dat in een donker (handmatig) en een licht (autoscroll) stuk. */
    const ok=d.ok||0, bad=d.bad||0;
    const aok=Math.min(ok,d.aok||0), abad=Math.min(bad,d.abad||0);
    out.push({d:dt.getDate(),ok:ok,bad:bad,aok:aok,abad:abad,nw:d.new||0,add:d.add||0}); }
  return out;
}
function streak(){ let n=0;
  for(let i=0;i<400;i++){ const d=DAILY[dayKey(i)]||{}; const act=(d.ok||0)+(d.bad||0);
    if(act>0) n++; else if(i>0) break; }
  return n; }
function pct7(){ let ok=0,bad=0; for(let i=0;i<7;i++){ const d=DAILY[dayKey(i)]||{}; ok+=d.ok||0; bad+=d.bad||0; }
  return (ok+bad)?Math.round(ok/(ok+bad)*100):0; }
function learnedCount(){ return ITEMS.filter(it=>bucket((getScore(it.id)||{}).ema)==='ok').length; }
function barChart(data){
  const W=330,H=158,L=24,R=322,base=138,top=16;
  const max=Math.max(5,...data.map(x=>x.ok+x.bad));
  const step=Math.max(1,Math.ceil(max/5));
  let lines='';
  for(let v=0;v<=max;v+=step){ const y=base-(v/max)*(base-top);
    lines+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+R+'" y2="'+y.toFixed(1)+'" class="gl"/><text x="20" y="'+(y+3).toFixed(1)+'" class="yl">'+v+'</text>'; }
  const n=data.length, span=(R-L)/n, bw=Math.min(14,span*0.56);
  const maxNew=Math.max(1,...data.map(x=>x.nw));
  let bars='', pts=[];
  const seg=function(cx,y0,h,fill){ return h<=0?'' :
    '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(y0-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2.5" fill="'+fill+'"/>'; };
  data.forEach(function(x,i){
    const cx=L+span*(i+0.5), tot=x.ok+x.bad, u=(base-top)/max;
    const hOk=x.ok*u, hBad=x.bad*u, hAok=x.aok*u, hAbad=x.abad*u;
    /* van onder naar boven: goed handmatig · goed autoscroll (licht) · fout handmatig · fout autoscroll (licht) */
    let y=base;
    bars+=seg(cx,y,hOk-hAok,'var(--ok)');        y-=(hOk-hAok);
    bars+=seg(cx,y,hAok,'var(--ok-lt)');         y-=hAok;
    bars+=seg(cx,y,hBad-hAbad,'var(--wrong)');   y-=(hBad-hAbad);
    bars+=seg(cx,y,hAbad,'var(--wrong-lt)');     y-=hAbad;
    if(tot) bars+='<text x="'+cx.toFixed(1)+'" y="'+(base-hOk-hBad-4).toFixed(1)+'" class="pl">'+Math.round(x.ok/tot*100)+'%</text>';
    pts.push([cx, base-(x.nw/maxNew)*(base-top)*0.55]);
  });
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dts=pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.4" class="lpt"/>').join('');
  const xl=data.map((x,i)=>(i%2===0||i===n-1)?'<text x="'+(L+span*(i+0.5)).toFixed(1)+'" y="152" class="xl">'+x.d+'</text>':'').join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Goed en fout per dag met nieuw geleerde woorden">'
    +lines+bars+'<path d="'+path+'" class="lln"/>'+dts+xl+'</svg>';
}
function addChart(data){
  const W=330,H=96,L=24,R=322,base=78,top=12;
  const max=Math.max(3,...data.map(x=>x.add));
  const step=Math.max(1,Math.ceil(max/3));
  let lines='';
  for(let v=0;v<=max;v+=step){ const y=base-(v/max)*(base-top);
    lines+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+R+'" y2="'+y.toFixed(1)+'" class="gl"/><text x="20" y="'+(y+3).toFixed(1)+'" class="yl">'+v+'</text>'; }
  const n=data.length, span=(R-L)/n, bw=Math.min(12,span*0.5);
  const bars=data.map(function(x,i){ if(!x.add) return ''; const cx=L+span*(i+0.5), h=(x.add/max)*(base-top);
    return '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(base-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="var(--accent)"/>'; }).join('');
  const xl=data.map((x,i)=>(i%2===0||i===n-1)?'<text x="'+(L+span*(i+0.5)).toFixed(1)+'" y="91" class="xl">'+x.d+'</text>':'').join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Zelf toegevoegde woorden per dag">'+lines+bars+xl+'</svg>';
}

/* ===================== SHEETS ===================== */
const ov=$('overlay');
/* v11.3 §31.1 — DE PEN-BUG. Op een aanraakscherm komt de `click` pas ná `pointerup`, en het
   doel wordt dan opnieuw bepaald: het net geopende overlay ligt op die plek, dus het scherm
   ging meteen weer dicht. Vandaar dat het potlood met de muis wél werkte en op de gsm niet.
   Oplossing: klikken op het overlay negeren gedurende 400 ms na het openen. */
let ovAt=0;
function openSheet(html){ ov.innerHTML='<div class="sheet">'+html+'</div>'; ov.classList.add('open');
  ovAt=Date.now();
  ov.querySelector('.sheet').addEventListener('click',e=>e.stopPropagation()); }
function closeSheet(){ ov.classList.remove('open'); ov.innerHTML=''; }
ov.addEventListener('click',function(){ if(Date.now()-ovAt<400) return; closeSheet(); });
/* ---- v11.11 §45.6 · DE TERUGROLKNOP IS WEG ----
   §44.2 gaf het versienummer een blad met «één stap terug». Die knop wiste de service worker
   en alle caches en herlaadde — maar hij haalde daarna gewoon opnieuw op wat er op de server
   staat. Er ging dus niets terug; scores, swipes en notities stonden toch al veilig in
   localStorage. `VERSION`, `PREVVER`, `ROLLBACK`, `openVersion()` en `doRollback()` zijn
   volledig verwijderd, en het versienummer in de bovenbalk is weer gewone tekst.
   Wat WEL blijft: de regel «TERUGROLBAAR: ja / nee — waarom» bovenaan elk bouwverslag in
   REQUIREMENTS.md. Echt een stap terug kunnen is een publicatie-afspraak (elke build als
   eigen map online laten staan), geen code. */
function frow(f,ic,t,d,on,kind){ return '<div class="frow"><span class="fic">'+ic+'</span><div class="ftxt"><div class="t">'+t+'</div><div class="d">'+d+'</div></div>'
  +'<div class="sw '+(on?'on':'')+'" data-f="'+f+'" '+(kind?'data-kind="'+kind+'"':'')+'><i></i></div></div>'; }

function openFilter(){
  openSheet('<div class="sgrip"></div><h3>Filter &amp; weergave</h3>'
    +frow('own','✎','Enkel mijn toevoegingen','zelf toegevoegd',filters.own)
    +frow('missing','❓','Ontbrekende vertaling','NB of NL nog leeg — vraag partner',filters.missing)
    +frow('showAns','👁️','Noors meteen tonen','kaarten niet wazig starten',SET.showAns,'set')
    +'<div class="actions"><button class="btn cancel" id="fclear">Wis filter</button><button class="btn save" id="fapply">Toon resultaten</button></div>'
    );
  ov.querySelectorAll('.sw').forEach(s=>s.onclick=function(){ const k=s.dataset.f;
    if(s.dataset.kind==='set'){ SET.showAns=!SET.showAns; saveSet(); s.classList.toggle('on',SET.showAns); }
    else { filters[k]=!filters[k]; s.classList.toggle('on',filters[k]); } });
  $('fclear').onclick=()=>{ filters={own:false,missing:false}; SET.fsel=null; saveSet(); closeSheet(); render(); };
  $('fapply').onclick=()=>{ closeSheet(); render(); };
}
/* v11 §27.11 — exportversie 11; `who` zit in de items zelf, import van v10 en lager blijft werken */
function openExport(){ const data=JSON.stringify({v:12,items:USER,scores:scores,fav:[...FAV],next:[...NEXT],songs:SONGS,songlist:SONGEXTRA,notes:NOTES,corr:CORR,fluo:FLUO,daily:DAILY,gnote:GNOTE});
  openSheet('<div class="sgrip"></div><h3>Exporteer (back-up)</h3><div class="hintbox">💡 <div>Kopieer en bewaar dit. Geef het aan Claude en je toevoegingen én correcties komen mee in de officiële versie.</div></div>'
    +'<div class="field"><textarea id="exp" rows="7" readonly>'+esc(data)+'</textarea></div>'
    +'<div class="actions"><button class="btn cancel" id="c">Sluit</button><button class="btn save" id="cp">Kopieer</button></div>');
  $('c').onclick=closeSheet;
  $('cp').onclick=function(){ const ta=$('exp'); ta.select();
    try{navigator.clipboard.writeText(ta.value);}catch(e){document.execCommand('copy');} $('cp').textContent='Gekopieerd ✓'; }; }
function openImport(){ openSheet('<div class="sgrip"></div><h3>Importeer</h3><div class="hintbox">📥 <div>Plak hier een export (⚙ → 📤 Exporteer) of een woordenblok dat je van Claude kreeg. Alles wordt samengevoegd; items die je al hebt worden overgeslagen.</div></div>'
    +'<div class="field"><textarea id="imp" rows="7" placeholder="Plak hier…"></textarea></div>'
    +'<div class="actions"><button class="btn cancel" id="c">Annuleer</button><button class="btn save" id="do">Importeer</button></div>');
  $('c').onclick=closeSheet;
  $('do').onclick=function(){ try{ const d=JSON.parse($('imp').value);
    if(Array.isArray(d.items)){ const ids=new Set(USER.map(x=>x.id)); d.items.forEach(it=>{ if(!ids.has(it.id)) USER.push(it); }); }
    if(d.scores) Object.assign(scores,d.scores);
    if(Array.isArray(d.fav)) d.fav.forEach(x=>FAV.add(x));
    if(Array.isArray(d.next)) d.next.forEach(x=>NEXT.add(x));   /* v11.22 §59 */
    if(Array.isArray(d.songlist)) d.songlist.forEach(function(x){ if(x&&x.k) songAdd(x.k,x.t); });   /* v11.22.1 */
    if(d.songs&&typeof d.songs==='object'){ for(const k in d.songs){ const b=d.songs[k];   /* v11.22 §60 */
      if(Array.isArray(b)&&b.length>((SONGS[k]||[]).length)) SONGS[k]=b; } saveSongs(); }
    if(d.notes) Object.assign(NOTES,d.notes);
    if(d.corr) Object.assign(CORR,d.corr);
    if(d.fluo) Object.assign(FLUO,d.fluo);
    if(d.daily) Object.assign(DAILY,d.daily);
    if(d.gnote){ Object.assign(GNOTE,d.gnote); save('sos_gnote_v6',GNOTE); }
    save('sos_user_v6',USER); save('sos_scores_v6',scores); saveFav(); saveNext(); saveNotes(); saveCorr(); saveFluo(); saveDaily();
    buildPool(); closeSheet(); render();
  }catch(e){ $('do').textContent='Ongeldig ✕'; } }; }
/* v11.17 §54 — «🗑️ Alle scores wissen» is VERWIJDERD op vraag van JHS (2026-08-17): één
   misgreep wist maanden historiek, en er is geen weg terug. De knop én openReset() zijn weg;
   wie toch wil herbeginnen doet dat via ⚙ → Exporteer (back-up) en daarna een nieuwe import. */

/* ===================== TOEVOEGEN / BEWERKEN / CORRIGEREN ===================== */
function openGNote(gid){
  const g=GRAMMAR.find(x=>x.id===gid)||{title:gid};
  openSheet('<div class="sgrip"></div><h3>📝 Opmerking</h3>'
    +'<div class="field wide"><label>'+esc(g.title)+'</label>'
    +'<textarea id="gn" rows="4" placeholder="bv. Johanne zegt hier iets anders…">'+esc(GNOTE[gid]||'')+'</textarea></div>'
    +'<div class="hintbox">💡 <div>Deze notitie blijft bij dit hoofdstuk staan en komt mee bij de volgende sync.</div></div>'
    +'<div class="actions"><button class="btn cancel" id="c">Annuleer</button><button class="btn save" id="s">Bewaar</button></div>');
  $('c').onclick=closeSheet;
  $('s').onclick=function(){ const v=$('gn').value.trim(); if(v) GNOTE[gid]=v; else delete GNOTE[gid];
    saveGNote(); closeSheet(); render(); };
}
function openCorrection(it){
  openSheet('<div class="sgrip"></div><h3>Correctie doorgeven</h3>'
    +'<div class="hintbox">✏️ <div>Officieel woord — hier laat je een <b>correctie of opmerking</b> achter. Claude pikt die op bij de volgende sync en past het woord aan.</div></div>'
    +'<div class="field"><label>'+esc(strip(textNL(it)))+' — '+esc(strip(textNB(it)))+'</label>'
    +'<textarea id="corr" rows="4" placeholder="bv. klemtoon klopt niet, meervoud is …, betere vertaling is …">'+esc(corrOf(it))+'</textarea></div>'
    +'<div class="actions"><button class="btn cancel" id="c">Annuleer</button><button class="btn save" id="s">Bewaar</button></div>');
  $('c').onclick=closeSheet;
  $('s').onclick=function(){ const v=$('corr').value.trim(); if(v) CORR[it.id]=v; else delete CORR[it.id];
    saveCorr(); closeSheet(); render(); };
}
function openEditor(existing){
  const it=existing;
  /* v11 §27.5/§27.9 — eigen items (ook die met src:'somme') gaan naar het volledige
     bewerkscherm; officiële woorden krijgen het correctieformulier. */
  if(it && !USER.some(u=>u.id===it.id)){ openCorrection(it); return; }
  let who=it?(it.who||(it.src==='somme'?'johanne':'jan')):'jan';
  let type=it?it.type:'woord';
  let rawnl=it?((it._rawnl||(it.type==='woord'?strip(it.hnl):it.nl))||''):'';
  let rawbg=it?((it._rawbg||(it.type==='woord'?strip(it.hnb):it.nb))||''):'';
  let rawbm=it?((it._rawbm||(it.bm?strip(it.bm.h||it.bm.nb||''):''))||''):'';
  let frm=(it&&it._rawforms)?it._rawforms:'';
  let snb=it?(it.snb||''):'';
  let note=it?noteOf(it):'';
  let hitTimer=null;
  const val=id=>($(id)?$(id).value:'');
  function fld(id,lb,cls,v,ph){
    return '<div class="field '+cls+'"><label>'+lb+'</label><input id="'+id+'" value="'+esc(v)+'" placeholder="'+esc(ph||'')+'"></div>';
  }
  function snap(){ if($('enl')){ rawnl=val('enl'); rawbm=val('ebm'); rawbg=val('ebg');
    if($('efrm')) frm=val('efrm'); if($('esnb')) snb=val('esnb'); note=val('enote'); } }
  function draw(){
    openSheet('<div class="sgrip"></div><h3>'+(it?'Bewerk':'Nieuw item')+'</h3>'
      +'<div class="seg2"><button class="'+(type==='woord'?'on':'')+'" data-t="woord">Woord</button><button class="'+(type==='zin'?'on':'')+'" data-t="zin">Zin</button></div>'
      +'<div class="seglbl">van wie?</div>'
      +'<div class="seg3">'
        +'<button class="'+(who==='jan'?'on':'')+'" data-w="jan">Jan</button>'
        +'<button class="'+(who==='johanne'?'on':'')+'" data-w="johanne">Johanne</button>'
        +'<button class="'+(who==='lene'?'on':'')+'" data-w="lene">Emma &amp; Lene</button>'
      +'</div>'
      +fld('enl','NL','nl',rawnl,'')
      +fld('ebm','BOKM','nb',rawbm,'leeg → ik vul aan bij de sync')
      +fld('ebg','BERG','bg',rawbg,'leeg → gelijk aan bokmål')
      +(type==='woord'?fld('efrm','vormen:','',frm,'bilen, biler, bilene')+fld('esnb','vb-zin:','',snb,'Bilen står ute.'):'')
      +fld('enote','notitie:','',note,'eigen geheugensteun')
      +'<div class="actions">'+(it?'<button class="btn del" id="edel">Verwijder</button>':'<button class="btn cancel" id="ecan">Annuleer</button>')
      +'<button class="btn save" id="esave">Bewaar</button></div>');
    ov.querySelectorAll('.seg2 button').forEach(b=>b.onclick=function(){ snap(); type=b.dataset.t; draw(); });
    ov.querySelectorAll('.seg3 button').forEach(b=>b.onclick=function(){ snap(); who=b.dataset.w; draw(); });
    ['enl','ebm','ebg'].forEach(function(id){ const el=$(id); if(!el) return;
      el.oninput=function(){ clearTimeout(hitTimer); hitTimer=setTimeout(function(){ showHits(el); },200); };
      el.onblur=function(){ setTimeout(clearHits,180); }; });
    (it?$('edel'):$('ecan')).onclick=it?function(){doDelete(it);}:closeSheet;
    $('esave').onclick=doSave;
  }
  /* ---- live duplicaatzoek: klikbare lijst NL · BOKM · BERG ---- */
  function clearHits(){ const h=ov.querySelector('.ehits'); if(h) h.remove(); }
  function showHits(el){
    clearHits();
    const q=el.value.trim().toLowerCase(); if(q.length<2) return;
    const hits=ITEMS.filter(function(x){
      const bmt=x.bm?strip(x.bm.h||x.bm.nb||''):'';
      return (strip(textNL(x))+' '+strip(textNB(x))+' '+bmt).toLowerCase().indexOf(q)>=0;
    }).slice(0,20);
    if(!hits.length) return;
    const h='<div class="ehits"><div class="hh"><span>NL</span><span>BOKM</span><span>BERG</span></div>'
      +hits.map(function(x,i){ const bmt=x.bm?strip(x.bm.h||x.bm.nb||''):'';
        return '<div class="ehr" data-hit="'+i+'"><span class="c1">'+esc(strip(textNL(x)))+'</span>'
          +'<span class="c2">'+esc(bmt||'—')+'</span><span class="c3">'+esc(strip(textNB(x)))+'</span></div>'; }).join('')
      +'</div>';
    el.closest('.field').insertAdjacentHTML('beforeend',h);
    ov.querySelectorAll('.ehr').forEach(function(r){ r.onmousedown=function(ev){ ev.preventDefault();
      const x=hits[+r.dataset.hit]; closeSheet();
      mode='voc'; SET.src=[]; SET.eps=[]; SET.basis=false; SET.nch=[]; SET.who=[]; SET.fsel=null; subOpen.clear(); saveSet(); render();
      setTimeout(function(){ revealCard(x.id); },60); }; });   /* §28.5 — idem in het ＋-formulier */
  }
  function doSave(){
    const nl=val('enl').trim(), bm=val('ebm').trim(), bg=val('ebg').trim(), nt=val('enote').trim();
    const main=bg||bm;                       /* Bergens is de hoofdtaal; leeg → bokmål */
    if(!main&&!nl){ $('esave').textContent='Vul iets in ✕'; return; }
    const id=it?it.id:'u'+Date.now();
    /* v11 §27.5 — Jan → eigen woord (src 'own'); Johanne of Emma & Lene → bron Somme */
    const SRC=(who==='jan')?'own':'somme';
    let obj;
    if(type==='woord'){ const f=val('efrm').trim(), sn=val('esnb').trim();
      obj={id:id,type:'woord',kern:false,labels:[],episodes:(it&&it.episodes)||[],src:'own',tlbl:(it&&it.tlbl)||'',
        phNB:(it&&it.phNB)||'',phNL:(it&&it.phNL)||'',
        hnb:main?'<b>'+esc(main)+'</b>':'',hnl:nl?'<b>'+esc(nl)+'</b>':'',
        forms:f?f.split(',').map(x=>['',esc(x.trim())]):[],
        snb:sn?esc(sn):'',snl:'',_rawnl:nl,_rawbm:bm,_rawbg:bg,_rawnb:main,_rawforms:f};
      if(bm&&bm!==main) obj.bm={h:'<b>'+esc(bm)+'</b>'};
    } else {
      obj={id:id,type:'zin',labels:[],episodes:(it&&it.episodes)||[],src:'own',nb:esc(main),nl:esc(nl),
        ph:(it&&it.ph)||'',phNL:(it&&it.phNL)||'',_rawnl:nl,_rawbm:bm,_rawbg:bg};
      if(bm&&bm!==main) obj.bm={nb:esc(bm)};
    }
    obj.src=SRC; obj.mine=true;
    if(who==='jan'){ obj.labels=[]; delete obj.who; }
    else { obj.labels=['somme']; obj.who=who; }
    const i=USER.findIndex(x=>x.id===id);
    if(i>=0) USER[i]=obj;
    else { USER.push(obj); bumpDay('add'); seedWrong(id); save('sos_scores_v6',scores); }
    if(nt) NOTES[id]=nt; else delete NOTES[id];
    save('sos_user_v6',USER); saveNotes(); buildPool(); closeSheet(); render();
  }
  function doDelete(item){ openSheet('<div class="sgrip"></div><h3>Verwijderen?</h3><div class="hintbox">🗑️ <div>Gaat naar de prullenmand (terug te halen via import van je back-up).</div></div>'
    +'<div class="actions"><button class="btn cancel" id="c">Annuleer</button><button class="btn danger" id="d">Verwijder</button></div>');
    $('c').onclick=()=>openEditor(item);
    $('d').onclick=function(){ const i=USER.findIndex(x=>x.id===item.id);
      if(i>=0) USER[i].deleted=true; else USER.push(Object.assign({},item,{deleted:true}));
      save('sos_user_v6',USER); buildPool(); closeSheet(); render(); }; }
  draw();
}

/* ===================== FIT (tekst passend maken) ===================== */
function fitAll(){ requestAnimationFrame(function(){ document.querySelectorAll('.cell.w,.cell.f').forEach(fit); }); }
/* v11.20 §57.6 (D1.11) — fit() verkleinde de letter tot 8 px om een lange regel op één lijn
   te houden. JHS: «geen verkleining meer doen» — de tekst breekt nu gewoon af (zie `.cell.w` en
   `.cell.f`). De functie BLIJFT bestaan en wist enkel nog een oude inline-maat, zodat alle
   aanroepen (appendMore, de veeg, fitAll) ongewijzigd kunnen blijven staan en §57.6 in één
   handeling terug te draaien is. */
function fit(el){ if(el&&el.style) el.style.fontSize=''; }

/* ===================== START ===================== */
/* v11.6 §41.25 — de tekstbalk en zijn greepje staan geparkeerd achter TXTBAR; zet die const
   bovenaan op true en de hele leesregel (incl. SET.astxtoff) komt in één keer terug. */
if(!TXTBAR) $('phone').classList.add('notxt');
/* v11.6 §41.15 — het menublok staat bij het opstarten open; het greepje onderaan volgt. */
asSetMenu(true);
/* v11.10 §44.9 — de bewaarde richting meteen op de knop en op .phone zetten */
paintDir();
render();
/* v11.15 §51.1 — meteen kijken hoe het toestel ligt: start je in landscape, dan sta je
   onmiddellijk in de beurtstand met de twee knoppen ernaast. */
applyLand();
syncPull().then(function(ok){ render(); if(ok!==false) syncPush(); });
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
