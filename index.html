function migDubbels(MAP,FLAG,BAK){
  if(SET[FLAG]) return;
  const OF={}; Object.keys(MAP).forEach(k=>MAP[k].forEach(d=>OF[d]=k));
  /* 1 · eerst een volledige kopie wegschrijven, in een EIGEN sleutel (niet in sos_set_v6,
        want die wordt bij élke instelling opnieuw bewaard). */
  save(BAK, {v:FLAG, ts:Date.now(),
    scores:scores, fav:[...FAV], notes:NOTES, corr:CORR, fluo:FLUO, user:USER});

  /* 2 · scores: per richting (id|NL, id|NB) samensmelten.
        De historiek met de MEESTE swipes wint; de ema wordt gewogen naar dat aantal;
        `first` en `gfirst` worden de vroegste van de groep, `ts` de laatste. */
  const n=s=>(s&&s.hist)?s.hist.length:0;
  const seen={};
  Object.keys(scores).forEach(function(k){
    const i=k.lastIndexOf('|'); if(i<0) return;
    const id=k.slice(0,i), suf=k.slice(i);
    const tgt=OF[id]; if(!tgt) return;
    const dst=tgt+suf, a=scores[dst], b=scores[k];
    if(!a){ scores[dst]=b; }
    else {
      const win = n(b)>n(a) ? b : a, los = win===a ? b : a;
      const na=n(win), nb=n(los), tot=na+nb;
      const out={hist:(win.hist||[]).slice(-8)};
      if(win.ema!=null&&los.ema!=null&&tot) out.ema=(win.ema*na+los.ema*nb)/tot;
      else out.ema=(win.ema!=null)?win.ema:los.ema;
      const mn=(x,y)=>(x&&y)?Math.min(x,y):(x||y);
      if(mn(win.first,los.first))  out.first=mn(win.first,los.first);
      if(mn(win.gfirst,los.gfirst))out.gfirst=mn(win.gfirst,los.gfirst);
      const ts=Math.max(win.ts||0,los.ts||0); if(ts) out.ts=ts;
      scores[dst]=out;
    }
    delete scores[k]; seen[id]=1;
  });

  /* 3 · favorieten, notities, correcties, fluo — verhuizen mee, niets gaat weg */
  Object.keys(OF).forEach(function(d){
    const t=OF[d];
    if(FAV.has(d)){ FAV.add(t); FAV.delete(d); }
    if(NEXT.has(d)){ NEXT.add(t); NEXT.delete(d); }   /* v11.22 §59 */
    if(NOTES[d]){ NOTES[t]=NOTES[t] ? (NOTES[t]+' · '+NOTES[d]) : NOTES[d]; delete NOTES[d]; }
    if(CORR[d]){  CORR[t]=CORR[t]  ? (CORR[t] +' · '+CORR[d])  : CORR[d];  delete CORR[d]; }
    if(FLUO[d]){  FLUO[t]=[...new Set([].concat(FLUO[t]||[],FLUO[d]))].sort((a,b)=>a-b); delete FLUO[d]; }
    /* een eigen (bewerkte) kaart met een verdwenen id gaat mee naar de prullenmand */
    const u=USER.findIndex(x=>x.id===d); if(u>=0) USER[u].deleted=true;
  });

  /* 4 · de dagsets: verwijzingen omzetten zodat ☀15 en train vandaag niet breken */

  if(SET.newday&&SET.newday.ids)SET.newday.ids=mapIds(SET.newday.ids);
  if(SET.daySkip) Object.keys(SET.daySkip).forEach(function(id){
    const t=OF[id]; if(t){ SET.daySkip[t]=SET.daySkip[id]; delete SET.daySkip[id]; } });

  save('sos_scores_v6',scores); save('sos_fav_v6',[...FAV]); save('sos_next_v6',[...NEXT]); save('sos_notes_v6',NOTES);
  save('sos_corr_v6',CORR); save('sos_fluo_v6',FLUO); save('sos_user_v6',USER);
  SET[FLAG]=1; saveSet();
}

  if(rem.scores){ for(const k in rem.scores){ const a=scores[k],b=rem.scores[k];
    if(!a || (b&&b.hist&&(!a.hist||b.hist.length>a.hist.length))) scores[k]=b; } }
  if(Array.isArray(rem.items)){ const byId={}; USER.forEach(x=>byId[x.id]=x);
    rem.items.forEach(x=>{ if(!byId[x.id]||remNewer) byId[x.id]=x; }); USER=Object.values(byId); }
  if(Array.isArray(rem.fav)) rem.fav.forEach(x=>FAV.add(x));
  if(Array.isArray(rem.next)) rem.next.forEach(x=>NEXT.add(x));   /* v11.22 §59 — samensmelten, nooit wissen */
  /* v11.22 §60 — songteksten: per song wint de LANGSTE lijst delen. Zo kan een sync nooit
     stukken wegnemen die op dit toestel al opgeladen zijn. */
  if(Array.isArray(rem.songlist)) rem.songlist.forEach(function(d){ if(d&&d.k) songAdd(d.k,d.t); });
  if(rem.songs&&typeof rem.songs==='object'){ for(const k in rem.songs){ const b=rem.songs[k];
    if(Array.isArray(b)&&b.length>((SONGS[k]||[]).length)) SONGS[k]=b; } save('sos_songs_v6',SONGS); }
  if(rem.notes){ if(remNewer) Object.assign(NOTES,rem.notes); else NOTES=Object.assign({},rem.notes,NOTES); }
  if(rem.corr){ if(remNewer) Object.assign(CORR,rem.corr); else CORR=Object.assign({},rem.corr,CORR); }
  if(rem.fluo){ for(const k in rem.fluo){ const a=FLUO[k]||[], b=rem.fluo[k]||[]; FLUO[k]=[...new Set([...a,...b])]; } }
  if(rem.gnote){ for(const k in rem.gnote) if(!(k in GNOTE)||remNewer) GNOTE[k]=rem.gnote[k]; save('sos_gnote_v6',GNOTE); }
  if(rem.daily){ for(const k in rem.daily){ const a=DAILY[k], b=rem.daily[k]||{};
    if(!a) DAILY[k]=b; else ['ok','bad','new','add','aok','abad'].forEach(f=>{ a[f]=Math.max(a[f]||0,b[f]||0); }); } }
  if(rem.set&&typeof rem.set.showBM==='boolean'&&remNewer){ SET.showBM=rem.set.showBM; saveSet(); }
  save('sos_scores_v6',scores); save('sos_user_v6',USER); save('sos_fav_v6',[...FAV]); save('sos_next_v6',[...NEXT]);
  save('sos_notes_v6',NOTES); save('sos_corr_v6',CORR); save('sos_fluo_v6',FLUO); save('sos_daily_v6',DAILY);
  buildPool();
}

/* ===================== SCORE (EMA, vaste richting) ===================== */
const skey=id=>id+'|'+DIR;
function bucket(ema){ if(ema==null) return null; if(ema<1/3) return 'bad'; if(ema<2/3) return 'half'; return 'ok'; }
const BUCKCOL={ok:'var(--ok)',half:'var(--half)',bad:'var(--wrong)'};
function getScore(id){ return scores[skey(id)]||null; }
/* ============ v11.21 §58 · DE RICHTING NL? ============
   De namen zijn verwarrend, dus hier één keer helder (zie ook `paintDir()`):
     `NO?` = je raadt het NOORS   = NL -> NO = sleutel `id|NL` = de MOEILIJKE richting.
     `NL?` = je raadt het NEDERLANDS = NO -> NL = sleutel `id|NB` = de MAKKELIJKE richting.
   In de export van JHS staan ~300 sleutels op `|NL` en exact 9 op `|NB`. Daardoor viel aan de
   NL?-kant bijna alles in TO DO en bleven actief/zwak/gekend leeg.
   JHS' regel, letterlijk: «de NO->NL score wordt nooit driving voor de NL->NO score».
   Dus EENRICHTINGSVERKEER: moeilijk -> makkelijk mag overerven, makkelijk -> moeilijk NOOIT. */
function rawScore(id,dir){ return scores[id+'|'+dir]||null; }
function hasHist(id,dir){ const s=rawScore(id,dir); return !!(s&&s.hist&&s.hist.length); }
/* «Heb ik dit al gezien?» leest de MOEILIJKE sleutel. Sta je aan de NL?-kant, dan telt een
   eigen `|NB`-score daar ook als gezien — dat is makkelijk->makkelijk en dus toegelaten.
   Aan de NO?-kant wordt `|NB` NOOIT gelezen; die kant blijft exact wat ze was. */
function seenAny(id){ return hasHist(id,'NL') || (isRev() && hasHist(id,'NB')); }
function isDone(it){ const s=getScore(it.id); return !!(s&&s.hist&&s.hist.length); }
function isWeakOrNew(it){ const s=getScore(it.id); return bucket(s&&s.ema)!=='ok'; }
/* v8: elk nieuw item start met één "fout" — staat dus meteen op actief/zwak */
function seedWrong(id){ const k=skey(id); if(scores[k]&&scores[k].hist&&scores[k].hist.length) return false;
  scores[k]={ema:0,hist:[0]}; return true; }
/* v8: de nieuwe Bergense vraagwoorden krijgen eenmalig één fout-score → meteen actief */
(function seedNew(){ if(load('sos_seed_v81',0)) return;
  ['kor','ka','kem','koffor','kordan','naar_vraag'].forEach(seedWrong);
  save('sos_scores_v6',scores); save('sos_seed_v8',1); save('sos_seed_v81',1); })();
/* v11.2 §29.6 — label «next» (next to learn): woorden die je als volgende wil leren.
   Ze staan bij ZWAK zonder dat ze een kunstmatige foutswipe krijgen (dat was de oude seedWrong-truc).
   Zodra er een echte score is, telt gewoon die score. */
function isNext(it){ return (it.labels||[]).indexOf('next')>=0; }
/* v11.22 §59 — DE ENE LIJST. JHS' eigen keuze (NEXT) en het etiket uit de gegevens zijn
   samengesmolten tot één begrip (antwoord D1.2b). Alles wat «next» wil weten, vraagt het hier. */
function isNextNow(it){ return NEXT.has(it.id) || isNext(it); }
/* v11.21 §58 — «vers» loopt voortaan via `seenAny()`, precies dezelfde voorwaarde als de tak
   `'new'` van `stateOf()`. Vóór §58 liepen die twee uiteen aan de NL?-kant: `stateOf` zei
   «zwak» (overgeërfd) terwijl `isFresh` «ja, vers» zei, waardoor `newIds()` datzelfde woord
   alsnog als NIEUW woord van de dag voorstelde. */
function isFresh(it){ return !seenAny(it.id); }
/* ---- v11.5 §38.8 · eenmalige migratie van `gfirst` (en `first`) ----
   «nieuw geleerd» telde te hoog (72·60·60). De fix van §34.6 werkt enkel voor woorden die ná
   v11.3.1 groen werden: alles wat daarvóór al groen stond draagt geen `gfirst`, en kreeg er
   alsnog een — mét dagteller — zodra het na een foute veeg opnieuw op groen sprong.
   Hier krijgt elk woord dat NU al groen staat er één, met zijn bestaande tijdstempel en
   ZONDER de dagteller te verhogen. `first` krijgt dezelfde behandeling, want die is nodig
   voor §38.2. Eén keer, gemarkeerd met SET.gfirstmig. */
(function migGfirst(){
  if(SET.gfirstmig) return;
  Object.keys(scores).forEach(function(k){
    const s=scores[k]; if(!s||!s.hist||!s.hist.length) return;
    if(!s.first) s.first=s.ts||1;                       /* oud woord: niet «vandaag nieuw» */
    if(!s.gfirst && bucket(s.ema)==='ok') s.gfirst=s.ts||s.first||1;
  });
  save('sos_scores_v6',scores);
  SET.gfirstmig=1; saveSet();
})();
/* toestand van een item voor de filterbalk */
/* v11.21 §58 — de enige plaats waar de twee richtingen elkaar raken.
   NO? (moeilijk): ongewijzigd, leest UITSLUITEND `|NL`.
   NL? (makkelijk): een eigen `|NB`-score wint altijd; is die er niet maar bestaat er wel een
   `|NL`-historiek, dan wordt de toestand OVERGEËRFD — «ÉÉN STAP VOORZICHTIGER», beslist door
   JHS op 2026-08-22: gekend wordt ACTIEF, en dat is in dit model de toestand `weak`
   (de kolom «actief» = alles wat niet `new` is). Zo hoeft hij niets opnieuw te leren, maar
   krijgt hij ook niets cadeau. */
/* v11.22 §59 — «NEXT», de regel van JHS in één zin:
     een item is next als het (door JHS aangeduid OF met het etiket `next` uit de data)
     EN nog nooit gescoord is. Anders is het wat zijn score zegt.
   Daaruit volgt alles: next is een DEELVERZAMELING van «Later» (de kolom die vroeger TO DO
   heette) en botst dus nooit met actief/zwak/ken/star; een item verlaat next VANZELF bij zijn
   eerste score, dus er is geen opruiming nodig in `sos_next_v6`.
   ⚠ De tak `isNext(it)?'weak':'new'` van §29.6 is hier VERDWENEN: items die door hun etiket in
   ZWAK stonden, staan nu in NEXT. Dat verschuift zichtbaar cijfers — gewild, gemeten, bevestigd
   door JHS op 2026-08-22. */
function stateOf(it){
  if(!seenAny(it.id)) return isNextNow(it)?'next':'new';
  if(isRev()){
    const own=rawScore(it.id,'NB');
    if(own&&own.hist&&own.hist.length) return bucket(own.ema)==='ok'?'known':'weak';
    return 'weak';                      /* §58 — overgeërfd uit |NL, één stap voorzichtiger */
  }
  const s=rawScore(it.id,'NL');
  return bucket(s.ema)==='ok'?'known':'weak';
}
/* v11.22 §59 — ZEVEN kolommen: in db · Later · next · actief · zwak · ken · star.
   `c` is de KLEURKLASSE en staat los van de volgorde, zodat de bestaande CSS (c0..c5) niet
   hoeft te verschuiven; next kreeg er één bij (c6). «Later» is de oude kolom TO DO en telt
   ALLES wat nog nooit gescoord is — dus `new` én `next` samen (antwoord D1.2c: next blijft in
   Later staan). «actief» is alles wat WEL al gescoord is. */
const FCOLS=[
  {k:'db',    lb:'in db',  c:0, f:function(){return true;}},
  {k:'new',   lb:'Later',  c:1, f:function(x){var s=stateOf(x); return s==='new'||s==='next';}},
  {k:'next',  lb:'next',   c:6, f:function(x){return stateOf(x)==='next';}},
  {k:'act',   lb:'actief', c:2, f:function(x){var s=stateOf(x); return s!=='new'&&s!=='next';}},
  {k:'weak',  lb:'zwak',   c:3, f:function(x){return stateOf(x)==='weak';}},
  {k:'known', lb:'ken',    c:4, f:function(x){return stateOf(x)==='known';}},
  {k:'star',  lb:'star',   c:5, f:function(x){return FAV.has(x.id);}}
];
const FFN=k=>(FCOLS.find(c=>c.k===k)||FCOLS[0]).f;
/* v11.2 §29.5 — `auto`=true betekent: deze swipe komt uit de autoscroll.
   De score zelf verloopt exact zoals vroeger; enkel de dagteller krijgt er een aok/abad bij,
   en de autoscroll houdt een logboek bij zodat een hele reeks auto-fouten weer weg kan (§29.4). */
function applyScore(id,val,auto){
  const k=skey(id); let s=scores[k]||{ema:null,hist:[]};
  const before=bucket(s.ema);
  /* v11.3 §31.4 — eerste en laatste swipe, als VELDEN in het bestaande score-object */
  /* v11.5 §38.2 — `first` mag enkel «vandaag» worden voor een woord dat écht nog geen historiek
     had; anders zou een oud woord zonder `first` vandaag als vers meetellen in de ☀-teller. */
  const now=Date.now();
  if(!s.first) s.first=(s.hist&&s.hist.length)?1:now;
  s.ts=now;
  s.ema=(s.ema==null)?val:0.5*val+0.5*s.ema;
  s.hist.push(val); if(s.hist.length>8) s.hist=s.hist.slice(-8);
  scores[k]=s; save('sos_scores_v6',scores);
  bumpDay(val?'ok':'bad');
  if(auto) bumpDay(val?'aok':'abad');
  /* v11.3.1 §34.6 — «nieuw geleerd» telt een woord maar ÉÉN keer in zijn leven.
     Vroeger telde elke sprong naar groen mee; door de EMA sprong hetzelfde woord na
     één foute veeg opnieuw op groen, wat de teller flink opblies. */
  if(before!=='ok' && bucket(s.ema)==='ok' && !s.gfirst){ s.gfirst=now; bumpDay('new'); }
  syncPushSoon();
}

const isSos=it=>it.src==='sos'||(it.episodes||[]).length>0;
const isBasis=it=>it.src==='sos'&&(it.episodes||[]).length===0;   /* fix v7: enkel SoS-basiswoorden */
/* v10: BRON-as (SoS · Nils · Somme · Jan), multi-select.
   Per gekozen bron geldt zijn eigen verfijning (S1-afleveringen / N1-hoofdstukken).
   Niets gekozen = alles. Thema's bestaan niet meer als as. */
const isNilsSrc =it=>it.src==='nils'||((it.nch||[]).length>0);
const isSommeSrc=it=>it.src==='somme';
const isJanSrc  =it=>!isSos(it)&&!isNilsSrc(it)&&!isSommeSrc(it);
const SRCDEF=[['sos','SoS',isSos],['nils','Nils',isNilsSrc],['somme','Somme',isSommeSrc],['jan','Jan',isJanSrc]];
function epsMatch(it){
  const all=epsIsAll(), set=epsSet(), basisOn=!!SET.basis;
  if(!all && !basisOn && !(set&&set.size)) return true;
  let ok=false;
  if(all) ok=ok||isSos(it);
  if(basisOn) ok=ok||isBasis(it);
  if(set&&set.size) ok=ok||(it.episodes||[]).some(n=>set.has(n));
  return ok;
}
function nchMatch(it){
  const sel=SET.nch||[]; if(!sel.length) return true;
  if(sel.indexOf('all')>=0) return (it.nch||[]).length>0;
  return (it.nch||[]).some(c=>sel.indexOf(c)>=0);
}
/* v11 §27.4 — binnen de bron Somme verfijnen op persoon */
const whoOf=it=>it.who||'johanne';
function whoMatch(it){ const sel=SET.who||[]; if(!sel.length) return true; return sel.indexOf(whoOf(it))>=0; }
function contentPass(it){
  const S=SET.src||[]; if(!S.length) return true;
  if(S.indexOf('sos')>=0   && isSos(it)       && epsMatch(it)) return true;
  if(S.indexOf('nils')>=0  && isNilsSrc(it)   && nchMatch(it)) return true;
  if(S.indexOf('somme')>=0 && isSommeSrc(it)  && whoMatch(it)) return true;
  if(S.indexOf('jan')>=0   && isJanSrc(it))                    return true;
  return false;
}

/* ===================== KAART ===================== */
function dots(arr){ return (arr||[]).map(v=>'<span class="dot '+(v?'ok':'bad')+'"></span>').join(''); }
function aggDot(id){ const s=getScore(id), bk=bucket(s&&s.ema);
  return bk?'<span class="agg" style="background:'+BUCKCOL[bk]+';border-color:var(--ring)"></span>':'<span class="agg"></span>'; }
function askCell(side){ return '<span class="note">'+(side==='nb'?'? — vraag partner':'? — vul aan')+'</span>'; }
/* v8: 4e kolom = bokmål-variant (leeg = geen verschil) */
/* v11.16 §53.1 — HET GESPREKJE. Eén item, een VARIABEL aantal regels. Elke regel wordt gewoon
   een rij in dezelfde tweekolomstabel als alle andere kaarten — dat is precies wat we willen:
   · de fluo-markering hangt aan `data-row`, dus élke regel is apart te highlighten;
   · de blur (`hidden`/`revealed`) hangt aan het ITEM, dus bij een hide gaat het Noors van
     álle regels in één keer dicht;
   · de score hangt aan `id|richting`, dus het hele gesprekje wordt in één keer gescoord.
   Er is dus géén aparte score-, verberg- of markeermachinerie voor gesprekjes bijgekomen.
   De klankregel staat ONDER de Noorse zin (niet in de kop, want er zijn er meerdere) en gaat
   dus mee dicht met de rest van het Noors. */
function convRow(l,i){
  const sp=l.sp?'<b class="sp">'+esc(l.sp)+'</b>':'';
  const tb=l.tbc?' <span class="tbc">(tbc)</span>':'';
  const ph=l.ph?'<span class="cph">'+l.ph+'</span>':'';
  const B=l.bm||{};
  const bmt=B.nb?(B.nb+(B.ph?'<span class="cph">'+B.ph+'</span>':'')):'';
  return [sp+(l.nl||''), sp+(l.nb||'')+tb+ph, 'sent conv', bmt];
}
function rowsOf(it){
  const rows=[], B=it.bm||{};
  if(it.type==='conv'){
    (it.lines||[]).forEach(function(l,i){ rows.push(convRow(l,i)); });
    return rows;
  }
  if(it.type==='woord'){
    rows.push([hasNL(it)?it.hnl:askCell('nl'), hasNB(it)?it.hnb:askCell('nb'),'w', B.h||'']);
    (it.forms||[]).forEach(function(f,i){ rows.push([f[1],f[0],'f', f[2]||((B.f&&B.f[i])||'')]); });
    if(it.snb||it.snl) rows.push(['<span class="note">'+(it.snl||'')+'</span>','<span class="note">'+(it.snb||'')+'</span>','f',
      B.s?'<span class="note">'+B.s+'</span>':'']);
  } else {
    rows.push([hasNL(it)?it.nl:askCell('nl'), hasNB(it)?it.nb:askCell('nb'),'sent', B.nb||'']);
  }
  return rows;
}
function bmLine(t){ return (SET.showBM&&t)?'<span class="bm"><i>BM</i>'+t+'</span>':''; }
function cardHTML(it){
  const blur = SET.showAns ? hidden.has(it.id) : !revealed.has(it.id);
  const fav=FAV.has(it.id);
  const fl=new Set(FLUO[it.id]||[]);
  const ph=(it.phNB||it.ph||'')+((SET.showBM&&it.bm&&it.bm.ph)?'<span class="bmp"><i>BM</i>'+it.bm.ph+'</span>':'');
  const src = isSommeSrc(it)?'Somme':(it.src==='sos'?'SoS':(isNilsSrc(it)&&it.src==='nils'?'Nils':(isSos(it)?'SoS':(isNilsSrc(it)?'Nils':'Jan'))));
  let eps=(it.episodes&&it.episodes.length)?('S1E'+it.episodes.join(' · S1E')):'';
  if(it.nch&&it.nch.length){ const t='📘 '+it.nch.map(c=>'N1K'+c).join(' · ');
    eps=eps?(eps+' · '+t):t; }
  /* v11.10 §44.9 — welke kolom dicht gaat, hangt van de richting af. De score staat op
     dezelfde plaats als altijd (links bovenaan); bij NL? komt er een «←» vóór het bolletje,
     zodat je ziet dat je naar de andere score kijkt. De twee zijn nooit samen zichtbaar. */
  const rev=isRev();
  /* v11.16 §53.1 — bij een gesprekje staat er in de kop géén klankregel (die staat per regel
     ónder de Noorse zin) maar de TITEL van het gesprekje. Die is Nederlands, blijft dus altijd
     leesbaar, en staat bovenaan — precies wat §51.3.4 vraagt, want een gesprekjeskaart is hoog
     en wordt in landscape onderaan afgeknipt. Het potlood ✏️ valt weg: de editor van §11 kent
     enkel «woord» en «zin», en een gesprekje via dat scherm openen zou de regels wissen. */
  const conv=(it.type==='conv');
  const hdr='<div class="chdr">'
    +'<div class="chalf scoreblk">'+(rev?'<span class="dirmark">←</span>':'')
      +aggDot(it.id)+'<span class="hist">'+dots((getScore(it.id)||{}).hist)+'</span></div>'
    +(conv
      ? '<div class="chalf"><div class="ctitle">💬 '+esc(it.title||'Gesprekje')+'</div></div>'
      : '<div class="chalf"><span class="pen" data-edit="'+it.id+'">✏️</span>'
        +'<div class="pho'+((blur&&!rev)?' blur':'')+'">'+ph+'</div></div>')
    +'</div>';
  const cells=rowsOf(it).map(function(r,i){
    const hl=rev?' hidecol':'', hb=rev?'':' hidecol';
    return '<div class="cell col-nl '+r[2]+hl+((rev&&blur)?' blur':'')+((rev&&fl.has(i))?' fluo':'')+'" data-row="'+i+'">'+r[0]+'</div>'
     +'<div class="cell col-nb '+r[2]+hb+((!rev&&blur)?' blur':'')+((!rev&&fl.has(i))?' fluo':'')+'" data-row="'+i+'">'+r[1]+bmLine(r[3])+'</div>'; }).join('');
  const note=corrOf(it)?('✏️ '+corrOf(it)):noteOf(it);
  const cmt=note?'<div class="cmt">💡 '+esc(note)+'</div>':'';
  /* v11.2 §29.6 — klein merkje zodat je ziet waarom een woord zónder score toch bij «zwak» staat */
  const nx=(isNextNow(it)&&isFresh(it))?'<span class="nx">next</span>':'';
  return '<div class="card'+(fav?' starred':'')+'" data-id="'+it.id+'">'+hdr
    +'<div class="grid">'+cells+'</div>'
    +'<div class="meta"><span class="src">'+src+'</span>'+nx+'<span class="eps">'+eps+'</span></div>'+cmt+'</div>';
}
function itemHTML(it){
  const fav=FAV.has(it.id);
  return '<div class="scrollcard" data-sc="'+it.id+'">'
    +'<div class="starwrap"><span class="star'+(fav?' on':'')+'" data-fav="'+it.id+'">'+(fav?'★':'☆')+'</span></div>'
    +'<div class="swwrap"><div class="swtint left"><b>✓</b></div><div class="swtint right"><b>✗</b></div>'+cardHTML(it)+'</div></div>';
}

/* v11.3.1 §34.6 — eenmalig: de opgeblazen historiek van «nieuw geleerd» op nul.
   Enkel het veld `new`; swipes, scores en al de rest blijven ongemoeid. */
(function resetNew(){ if(SET.newreset) return;
  Object.keys(DAILY).forEach(function(k){ if(DAILY[k]) DAILY[k].new=0; });
  saveDaily(); SET.newreset=1; saveSet(); })();

/* ===================== v11.3 — TRAIN (§31.6/§32.6) EN NIEUWE WOORDEN (§31.9) =====================
   Beide sets worden één keer per dag samengesteld en bewaard in de BESTAANDE sleutel sos_set_v6.
   Ze lopen live leeg: een woord verdwijnt zodra het vandaag geswipet is. */
function dayStart(){ const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function swipedToday(id){ const s=getScore(id); return !!(s&&s.ts&&s.ts>=dayStart()); }
/* ---- v11.6 §41.21/§41.22 · vandaag even niet ----
   Een tik op het bolletje van een nog niet gescoord item in ☀15 schuift dat item uit de dagset;
   het volgende in prioriteit komt in de plaats. Het item is NIET afgekeurd, enkel uitgesteld
   («vandaag nog niet relevant»), dus het mag morgen gewoon opnieuw voorgesteld worden.
   De uitstel-id's staan als NIEUW VELD in de BESTAANDE sleutel sos_set_v6: {id:dagnummer}.
   Oudere dagen worden bij het opstarten opgeruimd — ze gelden toch enkel voor hun eigen dag. */
/* v11.22 §59 — «VANDAAG EVEN NIET» (§41.21/§41.22) IS VERVALLEN, op vraag van JHS (D1.2a).
   Die tik betekent nu «zet op next». SET.daySkip wordt bij het opstarten één keer opgeruimd en
   nooit meer gevuld; `daySkipped()` blijft als lege huls bestaan zodat oudere aanroepen niet
   breken. De dubbelgangersmigratie kijkt nog naar SET.daySkip en heeft daar zijn eigen guard. */
(function dropDaySkip(){ if(SET.daySkip){ delete SET.daySkip; saveSet(); } })();
function daySkipped(){ return false; }
function trainN(){ return SET.trainn||50; }
/* ============ v11.25 §67 · EEN BETERE VOLGORDE (D1.8, het bouwdeel) ============
   D1.8 vroeg twee dingen: een echte planner ONDERZOEKEN (nota, niet bouwen — blijft open) en
   «nu al een betere volgorde bouwen». Tot v11.24 sorteerde ☀50 zuiver op «langst niet gezien»,
   waardoor een woord dat je vlot kent even vaak terugkwam als een woord dat je maar net kent.
   Nu telt de zwakte mee: `dringend(id) = dagen sinds de laatste veeg × (1,25 − ema)`. Een pas
   gekend woord (ema ±0,7) weegt zo ruwweg twee keer zwaarder dan een rotsvast woord (ema 1,0),
   maar tijd blijft de hoofdmoot — het is nadrukkelijk GEEN planner, alleen een betere
   rangschikking van dezelfde verzameling. Wie geen score heeft, komt vooraan.
   ⚠ De SAMENSTELLING van ☀50 verandert hier niet van aard: het blijft «de N gekende woorden
   die het meest aan een opfrissing toe zijn», enkel de maatstaf is beter. */
function dringend(id){
  const s=getScore(id)||{};
  const dagen=Math.max(0,(Date.now()-(s.ts||0))/86400000);
  const e=(s.ema==null?0.5:s.ema);
  return dagen*(1.25-e);
}
function trainIds(){
  if(!SET.train || SET.train.d!==todayKey() || SET.train.n!==trainN()){
    const cand=ITEMS.filter(x=>x.type==='woord'&&stateOf(x)==='known');
    cand.sort(function(a,b){ return dringend(b.id)-dringend(a.id); });
    SET.train={d:todayKey(),n:trainN(),ids:cand.slice(0,trainN()).map(x=>x.id)}; saveSet();
  }
  return SET.train.ids||[];
}
function trainOpen(){ return trainIds().filter(id=>!swipedToday(id)); }
/* ==================== v11.17 §54 · DE ROTTE APPELS ====================
   De EMA van applyScore() is `ema = 0,5·val + 0,5·ema`: na twee goede swipes staat een woord
   dat je tien keer fout had al op «gekend» en verdwijnt het uit «zwak». Precies de klacht van
   JHS. `rot()` is een TWEEDE, LOSSE maat op dezelfde historiek van 8 — de EMA zelf wordt niet
   aangeraakt, dus de kleuren, de buckets en de filters blijven exact wat ze waren.

     rot = Σ γ^i·(1−vᵢ) / Σ γ^i      met γ = 0,85 en i = 0 voor de LAATSTE swipe
           + 0,10 per terugval (een 1 die meteen door een 0 gevolgd wordt)

   γ = 0,85 in plaats van 0,5: de laatste swipe weegt het zwaarst, maar de achtste telt nog
   altijd voor 27 %. De terugvalbonus vangt «soms even juist, daarna weer fout» — een woord dat
   schommelt hoort hoger dan een woord dat toevallig al drie keer op rij fout ging.

   TWEE DREMPELS (afgeregeld op de echte export van JHS, 2026-08-17):
   1. minstens 4 swipes — anders staat een pas geveegd nieuw woord meteen bovenaan;
   2. minstens één keer juist geweest. Zonder deze tweede drempel vulden woorden die JHS
      gisteravond voor het eerst zag en zeven keer na elkaar fout had (`n_ille`, `n_tjukk`)
      de hele top 10 met een perfecte rot = 1,000. Dat zijn geen rotte appels maar nieuwe
      woorden. Ze blijven gewoon in de kolom «zwak» staan, ze eten enkel de tien plaatsen
      van de paarse knop niet meer op. JHS' eigen voorbeelden (slokket, kor, fordi) komen
      met deze twee drempels wél in de top 10 terecht. */
const ROT_GAMMA=0.85, ROT_FALLBACK=0.10, ROT_MINSW=4;
function rot(id){
  const s=getScore(id), h=(s&&s.hist)||[];
  if(h.length<ROT_MINSW) return -1;          /* te weinig swipes — nog geen oordeel */
  if(h.indexOf(1)<0)     return -1;          /* nooit juist geweest — dat is een nieuw woord */
  let num=0, den=0;
  for(let i=0;i<h.length;i++){                /* i telt vanaf de LAATSTE swipe terug */
    const w=Math.pow(ROT_GAMMA,i), v=h[h.length-1-i];
    den+=w; num+=w*(1-v);
  }
  let back=0;
  for(let i=0;i<h.length-1;i++) if(h[i]===1&&h[i+1]===0) back++;
  return num/den + ROT_FALLBACK*back;
}
function rotN(){ return SET.rotn||10; }
/* De ontdubbeling is niet cosmetisch. De samenvoeging van §47/§48 heeft de ITEMS ontdubbeld,
   maar de OUDE scoresleutels staan er nog (`full|NL` naast `n_full_av|NL`, `kem` naast `n_kem`,
   `n_i_gaar` naast `n_i_gaar2` … tientallen). Zonder deze stap zou hetzelfde woord twee keer
   in de lijst van tien staan. Eerste voorkomen wint, dus de hoogste rot van het paar blijft. */
function rotIds(){
  if(!SET.rot || SET.rot.d!==todayKey() || SET.rot.n!==rotN()){
    const cand=ITEMS.map(function(x){ return {x:x,r:rot(x.id)}; }).filter(function(o){ return o.r>=0; });
    cand.sort(function(a,b){
      if(b.r!==a.r) return b.r-a.r;
      return (((getScore(a.x.id)||{}).ts)||0)-(((getScore(b.x.id)||{}).ts)||0);   /* gelijkspel: oudste eerst */
    });
    const seen=new Set(), ids=[];
    for(let i=0;i<cand.length&&ids.length<rotN();i++){
      const k=(textNB(cand[i].x)+'|'+textNL(cand[i].x)).toLowerCase().trim();
      if(seen.has(k)) continue;
      seen.add(k); ids.push(cand[i].x.id);
    }
    SET.rot={d:todayKey(),n:rotN(),ids:ids}; saveSet();
  }
  return SET.rot.ids||[];
}
function rotOpen(){ return rotIds().filter(id=>!swipedToday(id)); }
/* De nieuwe woorden van vandaag. Zodra de categorie «Home» bestaat (v11.4) komen ze daar als
   eerste uit; zolang die er niet is, vallen we terug op «next», dan Somme, dan de rest. */
/* v11.4 §36.3 — binnen «Home» telt de prioriteit mee: groep 1 (de eerste week) komt eerst,
   dan 2, dan 3. Zonder deze regel kwamen de nieuwe woorden in willekeurige volgorde. */
/* v11.22 §59 — DE ☀-DAGKNOP TREKT UIT NEXT. Next staat vooraan in de prioriteit (rang 0), dus
   de dagset vult zich eerst helemaal met next-items; is next leeg — of raakt ze op vóór de N
   van de dag bereikt is — dan schuift de rest van «Later» aan, in de oude volgorde
   (Home op prioriteit, dan Somme, dan de rest). Zo staat de knop in de kolom «next» én blijft
   een dagset van 15 ook een dagset van 15 wanneer er maar drie next-items zijn. */
function newRank(x){ if(isNextNow(x)) return 0; if(x.who==='home') return 1+((x.prio||3)-1); if(x.src==='somme') return 5; return 6; }
/* ============ v11.24 §63 · WOORD VÓÓR ZIN (C1 · §41.24) ============
   Elke ZIN in `data/home.js` draagt sinds v11.24 een veld `needs:[ids]`: de woordkaarten die je
   moet kennen vóór die zin nuttig is. Zonder dat veld kreeg JHS zinnen voorgeschoteld waarin
   drie onbekende woorden tegelijk stonden.
   ⚠ DRAAGWIJDTE — met opzet klein gehouden: **alleen de dagset kijkt hiernaar.** De kolommen,
   de filters, `trainIds()`, `rotIds()`, de scores en de export blijven er volledig buiten. Zo
   verschuift er geen enkel kolomcijfer en blijft §59 meetbaar los van §63.
   · Een item ZONDER `needs` wordt nooit tegengehouden (alle losse woorden, en één zin waarvan
     geen enkel woord een eigen kaart heeft).
   · «kennen» = `stateOf(woord)==='known'`, dus de gewone groene toestand in de richting waarin
     je nu staat.
   · Een `needs`-id dat niet (meer) bestaat, telt niet mee — anders zou één verdwenen kaart een
     zin voor altijd blokkeren.
   · `SET.needs` (standaard aan) zet de poort uit; en raakt de poel toch leeg, dan valt de poort
     vanzelf weg. Een lege ☀-knop mag nooit het gevolg zijn van deze regel. */
function needsOf(it){ return (it&&it.needs)||[]; }
function needsMet(it){
  const ns=needsOf(it); if(!ns.length) return true;
  for(let i=0;i<ns.length;i++){ const w=BYID[ns[i]]; if(!w) continue;
    if(stateOf(w)!=='known') return false; }
  return true;
}
function needsLeft(it){ return needsOf(it).filter(function(id){ const w=BYID[id]; return w&&stateOf(w)!=='known'; }); }

/* v11.22.1 §59.5bis — JHS, 2026-08-22: «nee, ik wil zelf manueel altijd next aanvullen».
   De dagset komt dus UITSLUITEND uit next. Alleen wanneer er GEEN enkel vers next-item meer is,
   valt ze terug op de rest van «Later». Ze wordt dus NIET aangevuld tot N wanneer next kleiner
   is dan N — dat is de bedoeling: de ☀-knop is dan gewoon korter, en JHS vult next zelf aan. */
function newPool(){
  const p=ITEMS.filter(x=>isFresh(x)&&(x.type==='woord'||x.who==='home'));
  if(SET.needs===false) return p;                 /* v11.24 §63 — poort uit */
  const g=p.filter(needsMet);
  return g.length?g:p;                            /* nooit een lege dagset door deze regel */
}
function newSrc(pool){ const nx=pool.filter(isNextNow); return nx.length?nx:pool; }
function newIds(){
  const n=SET.nperday||15;
  if(!SET.newday || SET.newday.d!==todayKey() || SET.newday.n!==n){
    /* v11.4 — de Home-lijst bestaat grotendeels uit hele zinnen («Maten e klar!»); die moeten
       ook door de gele knop kunnen komen, anders blijft de helft van Home onbereikbaar.
       Buiten Home blijft het bij losse woorden, zoals vroeger. */
    /* v11.6 §41.21 — wat je vandaag uit de dagset geschoven hebt, komt er vandaag niet in terug */
    const cand=newSrc(newPool());
    cand.sort(function(a,b){ return (newRank(a)-newRank(b))||(orderKey(a)-orderKey(b)); });
    SET.newday={d:todayKey(),n:n,ids:cand.slice(0,n).map(x=>x.id)}; saveSet();
  }
  return SET.newday.ids||[];
}
/* ---- v11.5 §38.2 · de ☀-teller telt ELK vers woord van vandaag ----
   Vroeger telde de knop enkel af als je precies de 15 vastgezette woorden veegde. JHS kiest
   soms zelf een ander vers woord in de algemene TO DO-lijst; dat telde niet mee. Nu is de
   teller «nog X van de N nieuwe woorden vandaag»: elk woord dat vandaag voor het eerst geveegd
   wordt (`first` van vandaag) telt, waar je het ook veegt. De dagset blijft als suggestie
   bestaan, maar schuift op — is ze uitgeput terwijl de teller nog loopt, dan vult ze aan. */
function freshToday(){ const d=dayStart(); let n=0;
  Object.keys(scores).forEach(function(k){ const s=scores[k];
    if(s&&s.first&&s.first>=d) n++; });
  return n; }
function newLeft(){ return Math.max(0,(SET.nperday||15)-freshToday()); }
function newOpen(){
  const left=newLeft(); if(left<=0) return [];
  let ids=newIds().filter(id=>!swipedToday(id));
  if(ids.length<left){                       /* suggesties op, teller nog niet → aanvullen */
    const have=new Set(ids);
    /* v11.22.1 — aanvullen mag ook alleen binnen next, zolang er nog vers next-materiaal is. */
    const extra=newSrc(newPool()).filter(x=>!have.has(x.id))
                     .sort(function(a,b){ return (newRank(a)-newRank(b))||(orderKey(a)-orderKey(b)); });
    for(let i=0;i<extra.length&&ids.length<left;i++) ids.push(extra[i].id);
  }
  return ids.slice(0,left);
}
/* v11.17 §54 — derde tak: de rotte appels. `asBlocked()` hoeft niet mee te veranderen —
   die laat alles behalve ☀15 (`pick==='new'`) door, dus de autoscroll mag hierop lopen,
   net zoals op ☀50. Het is herhaling van materiaal dat je al gezien hebt. */
function pickIds(){ return SET.pick==='train'?trainOpen():(SET.pick==='new'?newOpen():(SET.pick==='rot'?rotOpen():[])); }
function setPick(v){ SET.pick=(SET.pick===v)?null:v; if(SET.pick) SET.fsel=null; saveSet();
  /* v11.7 §42.9 — een nieuwe selectie is een nieuwe beurt: de tellers in de balk beginnen opnieuw. */
  if(typeof asResetCount==='function') asResetCount();
  /* v11.7 §42.3 — enkel ☀15 (TO DO) blokkeert de autoscroll nog; ☀50 (train) mag hem wél.
     Sta je in de autoscroll wanneer je een geblokkeerde lijst kiest, dan val je zonder melding
     terug in de lijst. (§41.23 blokkeerde nog beide ☀-lijsten.) */
  if(typeof AS!=='undefined' && AS.on && asBlocked()){ asExit(); return; }
  mode='voc'; render(); $('stage').scrollTop=0; }

/* ===================== DECK ===================== */
const isMine=it=>it.src==='own'||!!it.mine;   /* v11: eigen toevoegingen kunnen nu ook src:'somme' hebben */
function applyFilters(list){
  if(filters.own)     list=list.filter(isMine);
  if(filters.missing) list=list.filter(missing);
  return list;
}
/* basis voor de filterbalk: inhoudskeuze + sheet-filters, nog ZONDER type/toestand */
function baseList(){ return applyFilters(ITEMS.filter(contentPass)); }
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;} return h/4294967296; }
function orderKey(it){ if(!(it.id in order)) order[it.id]=Math.sin((hashStr(it.id)+shuffleSeed)*99991)*.5+.5; return order[it.id]; }
function buildDeck(){
  /* v11.3 — train en «nieuw vandaag» staan los van de bron- en filterkeuze */
  if(SET.pick){ const st=new Set(pickIds());
    deck=ITEMS.filter(x=>st.has(x.id)).sort((a,b)=>orderKey(a)-orderKey(b)); return; }
  let list=baseList();
  if(SET.fsel){ const fn=FFN(SET.fsel.s), ts=SET.fsel.t;    /* §40.3 — wrd en zin kunnen samen aanstaan */
    list=list.filter(x=>ts.indexOf(x.type)>=0&&fn(x)); }
  else list=list.filter(x=>SET.types.indexOf(x.type)>=0);
  list.sort((a,b)=>orderKey(a)-orderKey(b));   /* altijd willekeurig; 🔀 = nieuwe schudbeurt */
  /* v11.4 §34.2 — binnen de autoscroll vallen de woorden met een groene bol uit de lijst.
     AS.hide is een BEVROREN lijst, gemaakt bij het opstarten van de autoscroll en bij elke
     nieuwe ronde: een woord dat tijdens het scrollen groen wordt, verdwijnt dus niet onder
     je neus. Buiten de autoscroll is AS.hide leeg → de lijst is weer volledig. */
  if(typeof AS!=='undefined' && AS.on && AS.hide && AS.hide.size){
    const kept=list.filter(x=>!AS.hide.has(x.id));
    if(kept.length) list=kept;                 /* nooit een leeg scherm achterlaten */
  }
  deck=list;
}

/* ===================== RENDER ===================== */
function render(){
  /* v11.18 §55.3 — het eindscherm staat BINNEN #stage, en renderList() vervangt daar de hele
     inhoud. Eén regel hier zorgt dat het eindscherm vanzelf verdwijnt zodra er opnieuw
     getekend wordt (andere selectie, schudden, import, …) en de vlag nooit blijft hangen. */
  if(typeof finClear==='function') finClear();
  if(mode==='voc') renderList();
  else if(mode==='gram') renderGram();
  else if(mode==='songs') renderSongs();   /* v11.22 §60 */
  else if(mode==='stats') renderStats();
  /* v11.25 §65.2 — buiten de woordenlijst horen de twee grote knoppen er niet te staan. */
  $('phone').classList.toggle('novoc',mode!=='voc');
  if(typeof listFocus==='function') setTimeout(listFocus,0);
  renderPin();
  /* v11.10 §44.13 — in de beurtstand moet er altijd precies één kaart in focus staan */
  if(typeof turnFocus==='function') turnFocus();
}
/* v9: de lijst kan >1500 kaarten tellen → in blokken renderen, bijladen bij scrollen */
const PAGE=50; let shown=0;
function renderList(){
  buildDeck(); shown=0;
  let html='';
  if(!deck.length) html+='<div class="none">Geen items met deze keuze.<br>Pas je selectie of filter aan.</div>';
  /* v11.4 §34.4 — lege ruimte bóven de eerste kaart, zodat die in de autoscroll van achter
     de onderbalk komt opzetten in plaats van al halverwege het scherm te staan.
     Buiten de autoscroll is die ruimte 0 px hoog en verandert er dus niets. */
  $('stage').innerHTML=html+'<div id="astop" style="height:0"></div><div id="lst"></div><div id="asbot" style="height:0"></div>';
  appendMore();
  if(typeof AS!=='undefined' && AS.on && AS.lead) asApplyLead();   /* v11.5.1 — enkel bij echt spelen */
}
function appendMore(){
  const host=$('lst'); if(!host||shown>=deck.length) return;
  const start=host.children.length;
  host.insertAdjacentHTML('beforeend', deck.slice(shown,shown+PAGE).map(itemHTML).join(''));
  shown=Math.min(shown+PAGE,deck.length);
  const fresh=[].slice.call(host.children,start);
  requestAnimationFrame(function(){ fresh.forEach(function(c){ c.querySelectorAll('.cell.w,.cell.f').forEach(fit); }); });
  if(typeof AS!=='undefined' && AS.on) asRefreshCards();   /* v11: autoscroll kent de nieuwe kaarten */
}
/* v11.1 §28.5 — een treffer aanklikken deed niets: door de lazy rendering staan enkel de
   eerste 50 kaarten in de DOM, dus scrollIntoView() vond het kaartje niet. Nu wordt er
   bijgeladen tot het item gerenderd is, pas daarna scrollen. */
function revealCard(id){
  const i=deck.findIndex(function(x){ return x.id===id; });
  if(i<0) return false;
  let guard=0;
  while(shown<=i && guard++<400) appendMore();
  const el=[].slice.call(document.querySelectorAll('.card')).find(function(c){ return c.dataset.id===id; });
  if(!el) return false;
  el.scrollIntoView({block:'center'});
  requestAnimationFrame(function(){ renderTop(); });
  return true;
}
function renderGram(){
  const nav='<div class="gnav">'+GRAMMAR.map(g=>'<a href="#g_'+g.id+'">'+g.title.split(' (')[0]+'</a>').join('')+'</div>';
  const secs=GRAMMAR.map(function(g){
    const blocks=g.blocks.map(function(bl){
      let rows='<div class="grow"><span class="glbl">Regel</span><span class="gval">'+bl.rule+'</span></div>';
      if(bl.form) rows+='<div class="grow"><span class="glbl">Vorming</span><span class="gval">'+bl.form+'</span></div>';

/* ============ v11.22 §60 · HET SONGSCHERM ============

   getoond in de volgorde waarin ze opgeladen zijn; elk deel is apart te wissen.
   Geen groen/rood, geen score, geen kolom: het is leestekst, net als de grammatica. */
function songTotal(){ let t=0; SONGDEF().forEach(function(d){ t+=(SONGS[d.k]||[]).length; }); return t; }
function songLines(k){ let t=0; (SONGS[k]||[]).forEach(function(p){ t+=(p.lines||[]).length; }); return t; }
function renderSongs(){

  } else {

        return '<div class="songline"><span class="so">'+esc(l.o||'')+'</span>'
             +(l.nl?'<span class="sn">'+esc(l.nl)+'</span>':'')+'</div>'; }).join('');
      return '<div class="songpart"><h5>'+esc(p.t||('deel '+(i+1)))

/* De XML wordt met DOMParser gelezen — mild in wat ze aanvaardt: <songdeel>, <part> of <song>
   als omhulsel, <r>, <line> of <regel> als regel, <o>/<orig> en <nl>/<vert> als de twee kanten.
   Staat er geen `song=`-attribuut op, dan komt het stuk bij de song die nu openstaat. */
function songParse(txt){
  const doc=new DOMParser().parseFromString(String(txt||'').trim(),'application/xml');
  if(doc.querySelector('parsererror')) return {err:'Dat is geen geldige XML.'};
  const roots=[].slice.call(doc.querySelectorAll('songdeel,part,song'));
  const list=roots.length?roots:(doc.documentElement?[doc.documentElement]:[]);
  const out=[];
  list.forEach(function(el){
    const key=(el.getAttribute('song')||el.getAttribute('key')||songSel).toLowerCase();
    const stt=el.getAttribute('songtitel')||el.getAttribute('songtitle')||'';
    const t=el.getAttribute('titel')||el.getAttribute('title')||'';
    const lines=[];
    [].slice.call(el.querySelectorAll('r,line,regel')).forEach(function(r){
      const g=function(sel){ const e=r.querySelector(sel); return e?(e.textContent||'').trim():''; };
      const o=g('o')||g('orig'), nl=g('nl')||g('vert');
      if(o||nl) lines.push({o:o,nl:nl});
    });
    if(lines.length) out.push({k:key,t:t,st:stt,lines:lines});
  });
  return out.length?{parts:out}:{err:'Geen regels gevonden in die XML.'};
}
function openSongImport(){
  openSheet('<div class="sgrip"></div><h3>🎵 Een songdeel opladen</h3>'
    +'<div class="hintbox">📥 <div>Plak hier één XML-stuk (of meerdere na elkaar). Het wordt <b>achteraan toegevoegd</b> bij de song — de volgorde waarin je oplaadt, is de volgorde waarin het staat.</div></div>'
    +'<div class="field"><textarea id="sx" rows="8" placeholder="&lt;songdeel song=&quot;'+esc(songSel)+'&quot; titel=&quot;deel 1&quot;&gt;…&lt;/songdeel&gt;"></textarea></div>'
    +'<div class="actions"><button class="btn cancel" id="c">Annuleer</button><button class="btn save" id="do">Voeg toe</button></div>');
  $('c').onclick=closeSheet;
  $('do').onclick=function(){
    const r=songParse($('sx').value);
    if(r.err){ $('do').textContent=r.err; return; }
    let nl=0;
    r.parts.forEach(function(p){
      /* v11.22.1 — een onbekende `song=` is geen fout meer: de app maakt het vakje zelf aan. */
      let k=p.k;
      if(!SONGDEF().some(function(d){ return d.k===k; })){ songAdd(k,p.st||k); }
      if(!Array.isArray(SONGS[k])) SONGS[k]=[];
      SONGS[k].push({t:p.t||('deel '+(SONGS[k].length+1)),lines:p.lines});
      nl+=p.lines.length;
    });
    saveSongs(); closeSheet(); renderSongs();
    toastn('Toegevoegd: '+r.parts.length+' deel'+(r.parts.length===1?'':'en')+', '+nl+' regels.');
  };
}

/* ---- filterbalk (2 rijen × 6 knoppen, single select) ---- */
/* ============ v11.22 §59 · DE KOLOMMEN, «NEXT» EN «LATER» ============
   Het raster wordt niet langer met de hand uitgeschreven met lege <span>'s als opvulling —
   dat was precies de plaats waar renderFgrid() en renderStrip() uit elkaar konden lopen.
   Beide tekenen nu uit ÉÉN beschrijving: `fcolsVis()` zegt welke kolommen zichtbaar zijn en
   `fRow()` schuift het rijlabel op de juiste plaats. Zo schuiven allebei automatisch mee
   wanneer «in db» en «Later» dichtklappen. */
function fcolsVis(){ return SET.fhide ? FCOLS.filter(function(c){ return c.k!=='db'&&c.k!=='new'; }) : FCOLS.slice(); }
function fLabIdx(){ return SET.fhide ? 0 : 2; }   /* rijlabel: open ná «Later», dicht vooraan */
function fRow(cells,lab){ var out=cells.slice(); out.splice(fLabIdx(),0,lab); return out.join(''); }
function renderFgrid(){
  const base=baseList();
  const rows=[['woord','wrd'],['zin','zin'],['conv','gsp']];   /* v11.3 §31.6 · v11.16 §53.1 */
  const cols=fcolsVis();
  const g=$('fgrid'); if(!g) return;
  g.classList.toggle('hid',!!SET.fhide);
  /* v11.23 §62 — het balkje staat naast het raster en wordt hier NIET meer meegetekend;
     het enige wat het raster nog doet, is zijn eigen vakjes uitschrijven. */
  const bar=$('fbar'); if(bar) bar.classList.toggle('on',!SET.fhide);
  let h=fRow(cols.map(function(c){ return '<span class="fh">'+c.lb+'</span>'; }),'<span class="fh"></span>');
  /* v11.22 §59 — de ☀-dagknop staat nu in de kolom NEXT (was TO DO). De rotte appels blijven
     in «zwak», train blijft in «ken». */
  /* v11.24.1 §64 — DE ☀-KNOP TOONT ALLEEN DE DAGTELLER, zoals in §38.2: «nog N van de N
     nieuwe woorden vandaag». v11.22.1 toonde er kortstondig «☀ 10/12» bij (10 klaar, 12 te
     gaan) omdat de dagset sinds §61.1 uitsluitend uit next komt en dus korter kan zijn dan de
     teller. JHS vond die schuine streep verwarrend en koos op 2026-08-22 uitdrukkelijk voor
     alleen de teller. Gevolg, bewust aanvaard: staan er minder verse next-items klaar dan de
     teller aangeeft, dan geeft de knop er minder dan er op staat. */
  const nOpen=newLeft();
  const tOpen=trainOpen().length, rOpen=rotOpen().length;
  h+=fRow(cols.map(function(c){
    if(c.k==='next') return '<button class="fb c6 day'+(SET.pick==='new'?' sel':'')+'" data-pick="new" title="de nieuwe woorden van vandaag — eerst uit next, daarna uit Later"'
      +((nOpen===0&&SET.pick!=='new')?' disabled':'')+'>☀ '+nOpen+'</button>';
    if(c.k==='weak') return '<button class="fb rot day'+(SET.pick==='rot'?' sel':'')+'" data-pick="rot" title="de rotte appels — je slechtst gescoorde woorden en zinnen"'
      +((rOpen===0&&SET.pick!=='rot')?' disabled':'')+'>✱ '+rOpen+'</button>';
    if(c.k==='known') return '<button class="fb c4 day'+(SET.pick==='train'?' sel':'')+'" data-pick="train" title="train — gekende woorden opfrissen"'
      +((tOpen===0&&SET.pick!=='train')?' disabled':'')+'>☀ '+tOpen+'</button>';
    return '<span></span>';
  }),'<span></span>');
  rows.forEach(function(r){
    const sub=base.filter(function(x){ return x.type===r[0]; });
    h+=fRow(cols.map(function(c){
      const nn=sub.filter(c.f).length;
      const on=!!(SET.fsel&&SET.fsel.s===c.k&&SET.fsel.t.indexOf(r[0])>=0);
      return '<button class="fb c'+c.c+(on?' sel':'')+'" data-ft="'+r[0]+'" data-fs="'+c.k+'" title="'+r[1]+' · '+c.lb+'">'+nn+'</button>';
    }),'<span class="rlb">'+r[1]+'</span>');
  });
  g.innerHTML=h;
  renderStrip();
}
/* ---- v11.10 §44.12 · DE COMPACTE SELECTIERIJ ----
   Dichtgeklapt toont ze exact dezelfde structuur als de gewone rij, maar als streepjes van
   9 px zonder cijfers: de kolomkopjes, daaronder de ☀-rij (☀15 grijs onder TO DO, ☀50 groen
   onder gekend), dan wrd en zin, en onderaan de categorieën als kleine tekst zonder aantallen.
   Een tik erop klapt de gewone rij open; ze klapt vanzelf weer dicht bij een tik ergens
   anders (ook op de kaarten) en bij scrollen in de kaarten. */
function renderStrip(){
  const st=$('fstrip'); if(!st) return;
  const sel=SET.fsel||null;
  const on=function(k,t){ return !!(sel&&sel.s===k&&sel.t.indexOf(t)>=0); };
  const cols=fcolsVis();
  st.classList.toggle('hid',!!SET.fhide);
  const sb=$('sbar'); if(sb) sb.classList.toggle('on',!SET.fhide);   /* v11.23 §62 */
  let h=fRow(cols.map(function(c){ return '<span class="fh">'+c.lb+'</span>'; }),'<span class="fh"></span>');
  /* v11.22 §59 — het grijze ☀-streepje staat mee verhuisd naar de kolom «next». */
  h+=fRow(cols.map(function(c){
    if(c.k==='next')  return '<b'+(SET.pick==='new'?' class="sel"':'')+'></b>';
    if(c.k==='weak')  return '<b class="rot'+(SET.pick==='rot'?' sel':'')+'"></b>';
    if(c.k==='known') return '<b class="tr'+(SET.pick==='train'?' sel':'')+'"></b>';
    return '<span></span>';
  }),'<span class="rlb">☀</span>');
  [['wrd','woord'],['zin','zin'],['gsp','conv']].forEach(function(r){   /* v11.16 §53.1 */
    h+=fRow(cols.map(function(c){ return '<i class="c'+c.c+(on(c.k,r[1])?' sel':'')+'"></i>'; }),
            '<span class="rlb">'+r[0]+'</span>');
  });
  st.innerHTML=h;
  const src=new Set(SET.src||[]);
  $('fsrc').innerHTML=SRCDEF.map(d=>'<span class="'+d[0]+(src.has(d[0])?' on':'')+'">'+d[1]+'</span>').join('');
}

   1. **alle service workers afmelden** — anders blijft de oude cache-first-laag ertussen zitten;
   2. **alle caches wissen** (`caches.keys()` → `delete`) — dat is de offline-kopie van de app;
   3. **opnieuw laden met een cache-brekende parameter**, want ook de gewone browsercache van
      GitHub Pages kan `index.html` nog vasthouden. `location.reload()` alleen volstaat niet.

   en bouwt ze een verse offline-kopie op.

   instellingen, favorieten, fluo en eigen woorden blijven onaangeroerd staan — `caches` en

      for(const r of rs){ try{ await r.unregister(); }catch(_){} }

$('stage').addEventListener('pointerup',e=>{
  if(!drag) return; const d=drag; drag=null;
  const held=asRelease();                                  /* §29.8 — lange druk loslaten = verder */
  const resetTint=()=>{ if(d.swrap) d.swrap.querySelectorAll('.swtint').forEach(x=>x.style.opacity=0);
                        if(d.wrap&&d.wrap!==d.swrap) d.wrap.querySelectorAll('.swtint').forEach(x=>x.style.opacity=0); };
  /* v11.18 §55.1 — LANDSCAPE: een veeg over de kaart BLADERT. Naar links = de volgende kaart,
     naar rechts = de vorige, als een blad omslaan. Ze scoort nooit; de twee grote knoppen
     blijven de enige manier om in landscape te scoren (§51.3.2). Dezelfde drempel als de
     scorende veeg (THRESH), zodat een korte beweging nog altijd een tik blijft. */
  if(d.noswipe){
    if(d.flip==='x' && Math.abs(d.dx)>THRESH){ resetTint(); turnGo(d.dx<0?1:-1); return; }
  }
  if(d.axis==='x'){
    const pass=Math.abs(d.dx)>THRESH, val=d.dx<0?1:0;      /* links = juist, rechts = fout */
    d.scard.style.transition='transform .16s ease'; d.scard.style.transform='translateX(0)';
    if(pass){
      /* v11.5.1 §40.4 — in de autoscroll loopt de veeg via asScore(): die telt mee in de balans
         van de beurt, kleurt het tekstveld en zet AS.scored, zodat een tik erna niet dubbel telt. */
      if(AS.on && d.scroll){ if(!AS.scored) asScore(val===1,false,d.scroll);
        /* v11.11 §45.1 — in de lopende beurtstand komt na een veeg meteen de volgende kaart
           met de kolom dicht (antwoord V4), net zoals in de stilstaande beurtstand. De korte
           wachttijd laat de groene/rode tint van asScore() nog even zien. */
        if(TURN) setTimeout(function(){ if(TURN&&AS.on) turnAdvance(); },300); }
      else { scoreItem(d.sid,val,false);
        /* v11.7 §42.9 — ook een veeg in de lijst telt mee in de groene/rode teller van de balk. */
        if(val) AS.nok++; else AS.nbad++;
        /* v11.7 §42.2 — §41.14 is teruggedraaid: in de lijst verbergt het menu zich NOOIT meer.
           Alleen de autoscroll speelt nog met het menublok (§42.4). */
        /* v11.10 §44.13 — in de beurtstand wordt er niet gescrold: de focus springt gewoon
           naar de volgende kaart, met het antwoord weer dicht (antwoord V4 van JHS). */
        if(TURN){ turnStep(1); }
        else if(!SET.pick) asListStep(d.scard);   /* v11.7 §42.1 — één kaart door, precies op de plaats
                                                van de geveegde. In een ☀-lijst verdwijnt de kaart
                                                zelf (zie hieronder) en schuift de volgende vanzelf
                                                op die plaats; dán mag er niet bij gescrold worden. */
        setTimeout(function(){
          /* v11.3 §31.6 — in train / nieuw vandaag verdwijnt het woord live uit de lijst */
          /* v11.8 §43.1 — én uit `deck`, anders blijft het totaal in de balk staan */
          if(SET.pick){ const sc=d.scard.closest('.scrollcard');
            if(sc){ const nx=sc.nextElementSibling||sc.previousElementSibling;
                    if(TURN&&sc.classList.contains('focus')&&nx) nx.classList.add('focus');
                    sc.remove(); }
            deckDrop(d.sid); asDrawBar(); }
          else refreshCard(d.scard,d.sid);
          if(TURN) turnFocus();
          renderPin(); },150); }
    } else if(AS.on) asTint(null,0,0);
    resetTint(); return;
  }
  if(d.moved) return;
  /* ---- tik ---- */
  if(d.tgt.closest&&d.tgt.closest('.pen')){ const it=ITEMS.find(x=>x.id===d.id); if(it) openEditor(it); return; }
  /* v11.5 §38.9 · v11.5.1 §40.1 · v11.6 §41.20 — de grijze samenvattingsbol en de historiek-
     bolletjes zijn puur informatief. De tik-guard gold enkel in de autoscroll; hij geldt nu
     ALTIJD: tikken scoort nergens nog, alleen vegen scoort.
     v11.6 §41.21 — één uitzondering in ☀15: een tik op het bolletje van een nog niet gescoord
     item schuift dat item uit de dagset (uitgesteld, niet afgekeurd). */
  /* v11.15 §51.6 — UITSTELLEN bestaat niet in landscape (bewust weggelaten door JHS). De tik
     op het bolletje doet daar dus niets; in portrait blijft §41.21 ongewijzigd. */
  if(d.tgt.closest && d.tgt.closest('.scoreblk')){ if(!LAND) asNextTap(d.id); return; }
  /* v11.2 §29.7 · v11.6 §41.8 — een tik op de kaartenzone pauzeert of speelt verder. Zacht:
     het menublok blijft staan zoals het staat. Scoren doet die tik niet meer (§41.20). */
  /* v11.10 §44.12 — staat de selectierij open, dan is de EERSTE tik op de kaarten enkel
     «klap dicht»: hij toont, verbergt, pauzeert of hervat niets. Zo blijft de hoge rij
     wegklikken zonder neveneffect (uitdrukkelijke keuze van JHS). */
  if(fpackOpen()){ setCompact(true); return; }
  /* v11.10 §44.6 — zodra de autoscroll GESTART is, pauzeert/hervat een tik op de kaarten;
     zolang hij niet gestart is, toont en verbergt hij (de oude werking van de lijst). */
  /* v11.11 §45.4b — beurtstand: een tik onthult, waar je ook tikt. Staat de kolom al open,
     dan doet de tik wat §44.6 zegt: pauzeren of verdergaan. Zo blijft allebei bereikbaar,
     ook op stand 100 % (waar er niets vanzelf opengaat). */
  /* v11.15.1 §52.3 — IN DE BEURTSTAND OP PORTRAIT SCOORT DE TIK. Er zijn daar geen knoppen
     nodig: het scherm zelf is de knop. **Links = juist, rechts = fout** — dezelfde kant als de
     veeg (§41.16), zodat de twee bedieningen niet tegen elkaar in werken.
     - **Zonder play** onthult de EERSTE tik de dichte kolom; pas de tik daarna scoort.
     - **Met play** onthult de tik niet meer (dat doet de klok op `turnPct`), dus élke tik scoort.
     - **De fluo-markering blijft** op de antwoordkolom zodra die open ligt (keuze van JHS).
       «Antwoord weer dicht» (§44.9) vervalt in de beurtstand — in de lijst blijft het gewoon.
     - Pauzeren gaat voortaan met ▶ en de voortgangsbalk; de tik op het speelveld pauzeert niet
       meer, want die scoort. Een LANGE druk (§29.8) blijft wel pauzeren en scoort niet.
     In LANDSCAPE verandert er niets: daar doen de twee grote knoppen het werk (§51). */
  if(TURN && !LAND){
    if(held) return;
    const sc=turnCard(); if(!sc) return;
    if(!AS.on && turnIsHidden(sc)){ turnSetHide(sc,false); return; }
    const cell=d.tgt.closest&&d.tgt.closest('.cell.hidecol');
    if(cell && !turnIsHidden(sc)){
      const i=+cell.dataset.row, arr=new Set(FLUO[d.id]||[]);
      arr.has(i)?arr.delete(i):arr.add(i);
      FLUO[d.id]=[...arr]; if(!FLUO[d.id].length) delete FLUO[d.id];
      saveFluo(); cell.classList.toggle('fluo'); return;
    }
    const bx=$('phone').getBoundingClientRect();
    turnScore(d.x0 < bx.left+bx.width/2);
    return;
  }
  if(TURN && AS.on){
    if(held) return;
    const sc=turnCard();
    if(sc && turnIsHidden(sc)){ turnReveal(); return; }
    asToggle(); return;
  }
  if(AS.on){ if(!held) asToggle(); return; }
  subOpen.clear();
  const blur=SET.showAns?hidden.has(d.id):!revealed.has(d.id);
  if(blur){ if(SET.showAns) hidden.delete(d.id); else revealed.add(d.id); refreshCard(d.card,d.id);
            if(TURN) turnFit(); renderPin(); return; }
  /* v10 · v11.10 §44.9 — tik op de kolom die ER STAAT (de vraag) = het antwoord weer dicht */
  if(d.tgt.closest&&d.tgt.closest('.cell:not(.hidecol)')){
    if(SET.showAns) hidden.add(d.id); else revealed.delete(d.id);
    refreshCard(d.card,d.id); renderPin(); return; }
  const cell=d.tgt.closest&&d.tgt.closest('.cell.hidecol');
  if(cell){ const i=+cell.dataset.row, arr=new Set(FLUO[d.id]||[]);
    arr.has(i)?arr.delete(i):arr.add(i);
    FLUO[d.id]=[...arr]; if(!FLUO[d.id].length) delete FLUO[d.id];
    saveFluo(); cell.classList.toggle('fluo'); }
});
$('stage').addEventListener('pointercancel',()=>{ asRelease(); if(!drag)return; const d=drag; drag=null;
  /* v11.7 §42.5 — er hoeft geen kaart onder je vinger te zitten; zet altijd de kaart terug die
     effectief meebewoog (d.scard). */
  const back=d.scard||d.card;
  if(back){ back.style.transition='transform .18s ease'; back.style.transform='translateX(0)'; }
  if(d.swrap) d.swrap.querySelectorAll('.swtint').forEach(x=>x.style.opacity=0);
  if(d.wrap&&d.wrap!==d.swrap) d.wrap.querySelectorAll('.swtint').forEach(x=>x.style.opacity=0); });

/* ster (centraal boven de kaart) */
$('stage').addEventListener('click',e=>{
  const s=e.target.closest('.star'); if(!s) return; e.stopPropagation();
  const id=s.dataset.fav;
  if(FAV.has(id)){ FAV.delete(id); s.textContent='☆'; s.classList.remove('on'); }
  else { FAV.add(id); s.textContent='★'; s.classList.add('on'); }
  saveFav();
  const sc=s.closest('.scrollcard'), card=sc&&sc.querySelector('.card');
  if(card) card.classList.toggle('starred',FAV.has(id));
  if(filters.fav) render();
});

/* ===================== v11.1 §28 · AUTOSCROLL ===================== */
/* De lijst scrolt KLOKGESTUURD door (§28.10): elke kaart staat exact even lang in beeld.
   De kaart rond 40% van de lijsthoogte staat in focus (blauwe rand, scherp); de rest is
   dof en wazig. Onderaan staat een tweekoloms tekstveld (§28.1): links het NL-hoofdwoord,
   rechts het Bergense hoofdwoord mét lidwoord, wazig tot je tikt.
   Tiklogica (§28.2): 1e tik = oplossing · 2e tik = juist · niets doen = fout,
   tenzij ✗auto uit staat (§28.8). Vegen blijft werken (links juist, rechts fout). */
/* v11.11 §45.2 — negen snelheden, 6s is de traagste en 0,8s de snelste. Dezelfde reeks
   stuurt de autoscroll én de beurtstand (één knop voor allebei). */
const SPEEDS=[6,5,4,3,2,1.5,1.2,1,.8];                       /* §28.3 — seconden per kaart */
/* v11.10 §44.7 — korte etiketten voor het zwevende menu en de knop zelf */
const SPEEDSHORT=['6','5','4','3','2','1,5','1,2','1','0,8'];
/* v11.11 §45.3 — de standen van het onthulpercentage in de beurtstand */
const TPCTS=[0,25,50,75,100];
const AS={on:false,playing:false,raf:0,cur:null,idx:0,cards:[],n:0,eye:false,
          taps:0,scored:false,autoWrong:false,nok:0,nbad:0,badLog:[],hold:false,holdT:0,
          t0:0,s0:0,d:0,dur:1,
          /* v11.4 — §34.2 bevroren lijst van weggefilterde groene woorden · §34.3 rondeteller */
          hide:null,round:0,roundAt:0,
          /* v11.5.1 — de leadruimte van §34.4 komt er pas bij de eerste ▶, niet al bij ⇈ */
          lead:false,
          /* v11.7 §42.7 — laatst gekende plaats in de LIJST (1-gebaseerd), voor «45 / 74».
             Wordt vanaf de vorige stand bijgewerkt, net als AS.idx in de autoscroll. */
          lpos:1};
/* v11.7 §42.3 — de autoscroll is geblokkeerd in de kolommen IN DB en TO DO (en dus ook in de
   ☀15 van de TO DO-kolom). ACTIEF, ZWAK, GEKEND en STARRED laten hem toe, net als ☀50 (train)
   en de gewone lijst zonder kolomkeuze. Kies je zo'n geblokkeerde selectie terwijl de autoscroll
   loopt, dan val je zonder melding terug in de lijst (§42.3 vervangt §41.23). */
function asBlocked(){
  /* v11.11.1 §46.3 — DE BEURTSTAND IS NIET GEBLOKKEERD. De reden voor §42.3 was de scroll: in
     IN DB, TO DO en ☀15 verdwijnen kaarten live uit de lijst en schuift alles onder je vingers
     weg. In de beurtstand staat er één kaart en wordt er niet gescrold, dus die reden vervalt —
     en ☀15 is net de plek waar één kaart per keer het meest zin heeft (JHS, 2026-08-16).
     Omdat álle plaatsen die de blokkering nakijken via deze helper lopen (▶, `asStart()`,
     `setPick()`, de `#fgrid`-handler, `asPaintPlay()`), volstaat deze ene regel. */
  if(TURN) return false;
  if(SET.pick) return SET.pick==='new';
  return !!(SET.fsel && (SET.fsel.s==='db' || SET.fsel.s==='new'));
}
/* v11.6 §41.15 — staat van het menublok (rij 1 + rij 2). Enkel het greepje onderaan, ▶ en de
   voortgangsbalk sturen dit aan; een tik op de kaartenzone laat het met rust (§41.8/§41.10). */
let MENUON=true;

/* ---- v11.4 §34.2 · groene woorden weg tijdens de autoscroll ---- */
/* Uitzondering: sta je in de kolom «gekend» of in de train-selectie, dan blijven ze staan —
   anders zou de lijst net leegvallen. De keuze wordt één keer per ronde vastgelegd. */
function asHideOn(){
  if(SET.pick==='train') return false;
  if(SET.fsel && SET.fsel.s==='known') return false;
  return true;
}
function asMakeHide(){
  AS.hide = asHideOn()
    ? new Set(ITEMS.filter(x=>stateOf(x)==='known').map(x=>x.id))
    : null;
}
/* ---- v11.4 §34.4 · de eerste kaart komt van achter de onderbalk ---- */
/* Eén scherm hoog leegte vóór de eerste kaart. Zo staat kaart 1 bij scrollTop=0 net onder de
   onderrand en schuift ze omhoog zoals alle volgende — vroeger stonden de eerste twee kaarten
   al boven de focuslijn en werden ze overgeslagen. */
/* Onderaan komt er ook ruimte bij: zonder die staart stopt de scroll vóór de laatste kaart de
   focuslijn bereikt, en bij een kort lijstje zou het einde meteen geraakt worden. De staart is
   precies zo hoog dat het segment van de laatste kaart samenvalt met het einde van de scroll. */
/* v11.6 §41.7 — de staart wordt 0,72 × de hoogte van #stage, gespiegeld aan de leadruimte.
   Met de oude staart (h − focuslijn) stopte de scroll nét vóór de laatste kaart de focuslijn
   haalde; die kaart kwam dus nooit in focus en was daardoor niet te vegen. */
function asApplyLead(){
  const sp=$('astop'), bt=$('asbot'), st=$('stage'); if(!st) return;
  const h=st.clientHeight;
  if(sp) sp.style.height=(AS.on?h:0)+'px';
  if(bt) bt.style.height=(AS.on?Math.round(h*0.72):0)+'px';
}
function asClearLead(){ const sp=$('astop'), bt=$('asbot');
  if(sp) sp.style.height='0'; if(bt) bt.style.height='0'; }

/* ---- §29.4 · foute swipes van DEZE autoscroll-beurt kunnen weer weg ---- */
/* Vóór elke foute swipe in de autoscroll nemen we een foto van de score van dat woord.
   De knop ↩✗ zet die foto's in omgekeerde volgorde terug — enkel de FOUTE swipes,
   de goede blijven staan. Het logboek wordt leeggemaakt bij elke nieuwe autoscroll-beurt. */
function asLogBad(id){
  if(!AS.on) return;
  const k=skey(id), cur=scores[k];
  AS.badLog.push({id:id, k:k, snap:cur?JSON.parse(JSON.stringify(cur)):null});
  asUpdUndo();
}
/* §29.8 — lange druk loslaten: als de lijst daardoor stilstond, loopt hij weer verder.
   Geeft true terug als deze aanraking een lange druk wás (dan is het géén tik). */
function asRelease(){
  clearTimeout(AS.holdT);
  if(!AS.hold) return false;
  AS.hold=false;
  if(AS.holdWasPlaying) asResume();
  return true;
}
function asUpdUndo(){
  const b=$('btnUndoBad'); if(!b) return;
  const n=AS.badLog.length;
  b.disabled=!n;
  b.innerHTML='↩✗'+(n?'<b>'+n+'</b>':'');
  b.title=n?('wis de '+n+' foute swipe'+(n>1?'s':'')+' van deze autoscroll-beurt')
           :'nog geen foute swipes in deze autoscroll-beurt';
}
function asUndoBad(){
  if(!AS.badLog.length) return;
  const n=AS.badLog.length;
  for(let i=AS.badLog.length-1;i>=0;i--){ const e=AS.badLog[i];
    if(e.snap) scores[e.k]=e.snap; else delete scores[e.k]; }
  AS.badLog=[];
  save('sos_scores_v6',scores);
  bumpDay('bad',-n); bumpDay('abad',-n);
  AS.nbad=Math.max(0,AS.nbad-n);
  syncPushSoon(); asUpdUndo(); asDrawBar();
  const host=$('lst');
  if(host) [].slice.call(host.querySelectorAll('.card')).forEach(function(c){ refreshCard(c,c.dataset.id); });
  renderPin();
}

function asRefreshCards(){ const host=$('lst');
  AS.cards=host?[].slice.call(host.children):[];
  if(AS.idx>=AS.cards.length) AS.idx=Math.max(0,AS.cards.length-1); }
/* v11.6 §41.11/§41.12 — de dropdown van §38.12 is weg: de snelheden staan weer als één rij
   knoppen in rij 2, die tijdens de lopende autoscroll de plaats van de selectierij inneemt.
   SET.asSpeed staat in de bestaande sleutel sos_set_v6 en blijft dus over sessies heen staan. */
function asRenderSpeeds(){ asRenderSpeedMenu(); }

/* ---- §28.10 · klokgestuurd scrollen ---- */
/* Het segment van kaart i loopt van halverwege de vorige tot halverwege de volgende kaart
   (dáár verspringt de focus), niet over de hoogte van de kaart zelf. De scroll wordt niet
   geïntegreerd uit px/s × dt (elk gemist frame kost dan tijd) maar uit performance.now(). */
function asMid(c){ return c.offsetTop+c.offsetHeight/2; }
function asLineOff(){ return $('stage').clientHeight*0.40; }
function asFocusLine(){ const st=$('stage'); return st.scrollTop+asLineOff(); }
function asStartTop(i){ const c=AS.cards;
  return (i>0) ? (asMid(c[i-1])+asMid(c[i]))/2-asLineOff()
               : asMid(c[0])-c[0].offsetHeight/2-asLineOff(); }
function asEndTop(i){ const c=AS.cards, n=c.length;
  return (i<n-1) ? (asMid(c[i])+asMid(c[i+1]))/2-asLineOff()
                 : asMid(c[n-1])+c[n-1].offsetHeight/2-asLineOff(); }
function asSegLen(i){ return Math.max(20,asEndTop(i)-asStartTop(i)); }
function asNewSegment(){                       /* ook na pauze, snelheidswissel of appendMore() */
  if(!AS.cards.length){ AS.d=0; AS.dur=1; return; }
  const st=$('stage'), i=Math.min(Math.max(0,AS.idx),AS.cards.length-1);
  AS.s0=st.scrollTop; AS.t0=performance.now();
  let d=asEndTop(i)-AS.s0;
  /* v11.8 §43.2 — DE LAATSTE KAART KROOP. Haar eindpunt ligt vóór het einde van de scroll
     (de staart van §41.7 is groter dan de afstand tot de focuslijn). Zodra dat eindpunt
     gepasseerd was, werd `d` negatief en maakte het vangnet `Math.max(1,…)` er 1 px van,
     met een duur van 0,05 s: ±20 px per seconde, en elk beeldje opnieuw berekend — vandaar
     «heel druk en heel traag». Gemeten: vijf seconden over de laatste 85 px.
     Nu loopt de scroll, zodra het eindpunt voorbij is, op HET TEMPO VAN DIT SEGMENT door tot
     het einde van de lijst; daar neemt asTick() over met asRound(). */
  if(d<=0) d=(st.scrollHeight-st.clientHeight)-AS.s0;
  AS.d=Math.max(1,d);
  AS.dur=Math.max(.05,(SPEEDS[SET.asSpeed]||2)*AS.d/asSegLen(i));
}
function asPick(){
  if(!AS.cards.length) asRefreshCards();
  const cards=AS.cards; if(!cards.length) return null;
  const line=asFocusLine();
  let i=Math.min(Math.max(0,AS.idx),cards.length-1);
  /* de focus loopt monotoon mee met de scroll → vanaf de vorige positie zoeken (O(1)) */
  while(i>0 && Math.abs(asMid(cards[i-1])-line)<Math.abs(asMid(cards[i])-line)) i--;
  while(i<cards.length-1 && Math.abs(asMid(cards[i+1])-line)<Math.abs(asMid(cards[i])-line)) i++;
  AS.idx=i; return cards[i];
}
/* v11.6 §41.6 — ook de EERSTE kaart is wazig zolang ze niet in focus is. Ze bleef scherp omdat
   ze, tot haar segment begint, altijd de kaart is die het dichtst bij de focuslijn ligt: er is
   geen kaart vóór haar. De scherpte hangt nu niet meer af van «de dichtste kaart» alleen, maar
   ook van «haar segment is begonnen» — precies wat voor elke andere kaart al gold. */
function asStarted(i){ const c=AS.cards; if(!c||!c[i]) return false;
  return $('stage').scrollTop >= asStartTop(i)-2; }
function asSetFocus(){
  const best=asPick();
  if(best===AS.cur){ if(AS.cur) AS.cur.classList.toggle('focus',asStarted(AS.idx)); return false; }
  /* §28.2 — de vorige kaart wordt afgerekend op het moment dat de focus verspringt.
     De kaart wordt expliciet meegegeven, anders blijft er een tint hangen. */
  if(AS.cur && !AS.scored && AS.autoWrong) asScore(false,true,AS.cur);
  if(AS.cur) AS.cur.classList.remove('focus');
  AS.cur=best;
  if(AS.cur){ AS.cur.classList.toggle('focus',asStarted(AS.idx));
    asFill(ITEMS.find(x=>x.id===AS.cur.dataset.sc)); }
  asDrawBar(); asNewSegment();
  return true;
}

/* ---- §28.1 / §28.9 · het tekstveld ---- */
function asHeadNB(it){
  if(!it) return '&#8212;';
  if(it.type==='woord'){ if(hasNB(it)) return it.hnb; const B=it.bm||{}; return B.h||'&#8212;'; }
  return it.nb||((it.bm&&it.bm.nb)||'&#8212;');
}
function asHeadNL(it){
  if(!it) return '—';
  const t=(it.type==='woord')?strip(it.hnl):(it.nl||'');
  return t||'—';
}
function asFill(it){
  $('nlword').textContent=asHeadNL(it);
  $('nbword').innerHTML=asHeadNB(it);
  AS.taps=0; AS.scored=false; asPaintState();
  requestAnimationFrame(function(){ fit($('nlword')); fit($('nbword')); });
}
/* v11.5 §38.3 — de tekstregels onder het veld zijn weg; enkel de waas blijft over als signaal. */
function asPaintState(){
  const nb=$('nbword'); if(nb) nb.classList.toggle('hidden',AS.taps===0);
}
function asTint(card,l,r){
  [$('nlwrap'),card].forEach(function(host){ if(!host) return;

/* De balansvlakken van §28.7 én de streepjes van §41.2 zijn allebei weg. Wat overblijft:
   - één effen vulling: in de autoscroll je plaats in het deck, in de lijst hoe ver je gescrold bent;
   - links in het groen en rechts in het rood de tellers van deze beurt (§42.9);
   - rechts NÁÁST de balk «45 / 74»: waar je zit / hoeveel kaarten de selectie telt (§42.7).
   De balk houdt in beide standen exact dezelfde afmeting (§41.3). */
/* §42.7 — de plaats in de LIJST is de eerste kaart die nog (deels) onder de bovenrand zit.
   De zoektocht vertrekt van de vorige stand, net als asPick() in de autoscroll, zodat een
   lange lijst niet elke scrollframe helemaal doorlopen wordt. */
function asListPos(){
  const host=$('lst'); if(!host) return 0;
  const k=host.children, n=k.length; if(!n) return 0;
  const top=$('stage').scrollTop+8;
  let i=Math.min(Math.max(0,AS.lpos-1),n-1);
  while(i>0 && k[i-1].offsetTop+k[i-1].offsetHeight>top) i--;
  while(i<n-1 && k[i].offsetTop+k[i].offsetHeight<=top) i++;
  AS.lpos=i+1;
  return AS.lpos;
}
/* v11.8 §43.1 — een kaart die live uit de lijst verdwijnt (☀15/☀50 na een veeg, of het
   uitstellen van §41.21) moet ook uit `deck` en uit `shown`. Zonder dit bleef het totaal in de
   balk hangen: gemeten stond er «1 / 10» terwijl er nog maar acht kaarten op het scherm stonden.
   Bewust géén volledige herbouw van het deck — dan zou de hele lijst onder je vingers verspringen. */
function deckDrop(id){
  const i=deck.findIndex(function(x){ return x.id===id; });
  if(i<0) return;
  deck.splice(i,1);

/* v11.8 §43.1 — de vulling loopt tijdens de autoscroll VLOEIEND mee: niet in sprongen van
   één kaart, maar met de plaats binnen het lopende segment erbij. Wordt vanuit asTick()
   aangeroepen en schrijft één stijlregel, verder niets. */
function asBarFrac(){
  if(!AS.on) return 0;
  /* v11.11 §45.1 — in de beurtstand is er geen scroll: de vulling volgt de klok van de kaart. */
  if(TURN){ const per=turnPer(); return per?Math.min(1,Math.max(0,TU.el/per)):0; }
  if(!AS.cards.length) return 0;
  const i=Math.min(Math.max(0,AS.idx),AS.cards.length-1);
  const s=$('stage').scrollTop, a=asStartTop(i), len=asSegLen(i);
  return Math.min(1,Math.max(0,(s-a)/len));

/* ============ v11.25 §65.1 · DE VOORTGANGSBALK — ÉÉN BRON (D1.6a + D1.6c) ============

   selectie**, en de vulling moet **dezelfde bron** hebben.
   ⚠ Wat er misging, gemeten:
   · **D1.6a** — buiten de autoscroll berekende `asDrawBar()` de vulling uit `stage.scrollTop`.
     In landscape staat `#stage` op `overflow:hidden` (gemeten `scrollHeight = clientHeight`),
     en in de beurtstand zonder play wordt er evenmin gescrold. Deling door nul → de balk bleef
     eeuwig op 0 %. Precies wat JHS zag: «werkt helemaal niet».
   · **D1.6c** — het getal kwam uit `asListPos()` (scrollpositie) en het totaal uit
     `deck.length`, twee tellers die in de beurtstand niets met elkaar te maken hadden.
   Nu geeft `progNow()` beide uit ÉÉN plaatsbepaling, met drie takken die elk hun eigen
   natuurlijke bron hebben: de autoscroll haar kaartteller, de beurtstand de plaats van de
   FOCUSKAART, en de gewone lijst de bovenste zichtbare kaart. `stage.scrollTop` komt er niet
   meer aan te pas, dus `overflow:hidden` kan niets meer breken. */
function turnIndex(){
  const host=$('lst'); if(!host) return 0;
  const sc=turnCard(); if(!sc) return 0;
  const i=Array.prototype.indexOf.call(host.children,sc);
  return i<0?0:i;
}
function progNow(){
  const tot=deck.length||AS.cards.length||0;
  if(!tot) return {pos:0,tot:0,frac:0};
  if(AS.on){ const i=Math.min(Math.max(0,AS.idx),tot-1);
    return {pos:i+1,tot:tot,frac:Math.min(1,Math.max(0,(i+asBarFrac())/tot))}; }
  const i=TURN ? Math.min(Math.max(0,turnIndex()),tot-1)
               : Math.min(Math.max(0,asListPos()-1),tot-1);
  return {pos:i+1,tot:tot,frac:Math.min(1,Math.max(0,(i+1)/tot))};
}
function asBarProgress(){
  const tot=deck.length||AS.cards.length||0; if(!tot||!AS.on) return;
  const pr=Math.min(1,(Math.min(AS.idx,tot-1)+asBarFrac())/tot);
  $('bprog').style.width=(pr*100).toFixed(1)+'%';

function asDrawBar(){

  $('bprog').style.width=(pr*100).toFixed(1)+'%';
  $('blbl').textContent='';                       /* §42.7 — het cijferpaar staat nu náást de balk */
  /* v11.19 §56.3 — in de TO DO-kolom (de ☀-knop boven TO DO, `SET.pick==='new'`) zei
     `pos / deck.length` niets: daar stond `50 / 1991`, hetzelfde getal als bij wrd en zin,
     terwijl de dagset zelf maar 10, 15 of 20 woorden groot is. Daar komt nu de AFTELLENDE
     dagteller — `newLeft()` bestond al (`nperday − freshToday()`) en telt live af zodra je
     een nieuw woord veegt. In alle andere kolommen verandert er niets. */
  const c=$('pcnt');

    if(SET.pick==='new'){
      c.innerHTML='<i>nog</i>'+newLeft();
      c.title='nog te doen vandaag van de '+(SET.nperday||15)+' nieuwe woorden';
    } else {
      /* v11.26 §69.3 — «1 /» boven «1991», gecentreerd in de balk zelf. */
      c.innerHTML=tot?('<i>'+pos+' /</i>'+tot):'';

/* §42.9 — de tellers gelden voor DEZE beurt: ze beginnen opnieuw bij ⇈ (asStart), bij een
   nieuwe ronde (asRound) en zodra je een andere selectie kiest. De teller «swipes / dag»
   bovenaan blijft het dagtotaal tonen; de balk zegt dus iets wat je nergens anders ziet. */
function asResetCount(){ AS.nok=0; AS.nbad=0; if(typeof asDrawBar==='function') asDrawBar(); }
function asTick(){
  if(!AS.on||!AS.playing) return;
  /* v11.11 §45.1 — de beurtstand deelt de lus maar niet de motor: geen scroll, enkel een klok. */
  if(TURN){ turnTick(); AS.raf=requestAnimationFrame(asTick); return; }
  const st=$('stage');
  /* v11.11.1 §46.2 — zelfde verhaal als in de beurtstand, maar hier deed het veel meer pijn:
     na een onderbreking van 40 s sprong de scroll van 26 naar 2035 px — een stuk of vijftien
     kaarten die als gepasseerd meetelden zonder dat je ze gezien hebt. Duurt het lopende
     segment meer dan drie keer zo lang als bedoeld, dan is dat geen gemist beeldje maar een
     onderbreking: het segment begint opnieuw vanaf waar de lijst staat. */
  if(performance.now()-AS.t0 > AS.dur*3000){ asNewSegment(); AS.raf=requestAnimationFrame(asTick); return; }
  const k=(performance.now()-AS.t0)/(AS.dur*1000);
  st.scrollTop=AS.s0+AS.d*k;                    /* geen clamp: een gemist frame springt bij, de tijd klopt */
  if(st.scrollTop+st.clientHeight>=st.scrollHeight-2){
    if(shown>=deck.length){
      /* v11.18 §55.3 — hier stond `asRound()` (v11.4 §34.3: automatisch opnieuw schudden).
         Nu komt het eindscherm; `finShow()` pauzeert zelf, dus er wordt geen nieuw frame meer
         gevraagd. `asRound()` blijft bestaan maar wordt niet meer aangeroepen. */
      finShow();
      return;
    } else appendMore();
  }
  /* na appendMore() zijn er nieuwe kaarten: endTop() van de laatste verandert → segment herrekenen */
  if(AS.n!==AS.cards.length){ AS.n=AS.cards.length; asNewSegment(); }
  const moved=asSetFocus();
  if(!moved && k>=1) asNewSegment();            /* vangnet als de focus nog niet versprong */
  asBarProgress();                              /* v11.8 §43.1 — vloeiende vulling */
  AS.raf=requestAnimationFrame(asTick);
}
/* §29.1 / §29.2 — vanuit het menu kom je BINNEN IN PAUZE, en ✗auto staat ALTIJD uit.

  AS.autoWrong=false; AS.badLog=[]; AS.hold=false; clearTimeout(AS.holdT);
  AS.round=0; AS.roundAt=performance.now();
  AS.lead=false;                         /* v11.5.1 — nog géén leadruimte: de lijst blijft staan */
  const keep=$('stage').scrollTop;

  $('phone').classList.remove('playing');
  $('phone').classList.toggle('eye',AS.eye);
  $('phone').classList.toggle('txtoff',!!SET.astxtoff);   /* §38.4 — laatste stand van de tekstbalk */
  asMakeHide();                          /* §34.2 — bevries welke groene woorden wegvallen */
  render();                              /* lijst opnieuw opbouwen mét filter */
  /* v11.11 §45.1 — de beurtstand: geen leadruimte, geen scroll, geen segment. Enkel de kaart
     in focus, met de doelkolom dicht, en de klok op nul. Al de rest (▶, snelheid, balk,
     tellers, scoren) blijft precies dezelfde weg lopen als in de autoscroll. */
  if(TURN){
    $('stage').scrollTop=0;
    asRefreshCards(); AS.n=AS.cards.length;
    turnFocus(); turnSyncCur();
    turnSetHide(turnCard(),turnPct()>0);
    turnRestartClock();
    asPaintNoAuto(); asUpdUndo(); asPaintPlay(); asRenderSpeeds(); asDrawBar();
    cancelAnimationFrame(AS.raf);

     §34.4 (één scherm leegte vóór kaart 1) én scrollTop=0, waardoor je na één druk op ⇈ naar

  asPaintPlay();

/* v11.6 §41.21 — korte melding, bv. wanneer een item uit de dagset geschoven wordt */

/* v11.6 §41.13 · v11.7 §42.1 — een veeg in de lijst springt PRECIES één kaart door.

function asListStep(cardEl){

/* v11.6 §41.21/§41.22 — tik op het bolletje van een NOG NIET gescoord item in ☀15: dat item

   vervallen op vraag van JHS (D1.2a). De tik werkt overal in de lijst, niet enkel in ☀, maar

  else if(isNext(it)){ toastn('Staat al op next — etiket uit de gegevens.'); return; }
  else { NEXT.add(id); saveNext(); toastn('Op next gezet.'); }

  /* v11.7 §42.2 — §41.14 vervalt: in de lijst blijft het menublok staan. */
