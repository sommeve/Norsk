<!-- Side om side · v11.12.1 (§48) — service-worker cache: sos-v11-16 -->
<style>
  :root{
    --pg:#eef1f7; --surface:#ffffff;
    --nb-bg:#d9e9fb; --nl-bg:#f7edcf; --ink:#1b2334; --muted:#6b7a90; --hair:#dce3ef; --ring:#98a6bd;
    --en:#1565c0; --ex:#d61f2b; --g:#7a3fb0; --sep:#c7d0e0;
    --ok:#2e9e5b; --half:#e08b2b; --wrong:#d94b46; --accent:#2f6fd6; --purple:#6b4fd6;
    --ok-lt:#a6dcbc; --wrong-lt:#f0b0ad;   /* v11.2 §29.5 — autoscroll-swipes in de grafiek */
    --cTrain:#7fc99b; --cTrainBd:#4fae7c;  /* v11.3 §32.6 — train */
    --yellow:#f2c53d; --yellowbd:#d8a91c;  /* v11.3 §31.9 — nieuwe woorden van vandaag */
    --pin:#dde4f0; --pinline:#c7d0e0; --ctrl:#e4e9f3;
    --unseen:#dfe3e9; --unseen-bd:#b7bec8; --star:#e6c229; --fluo:#f2f74d; --fluobd:#d9dd2e;
    --scrolltrack:#dbe1ee; --scrollthumb:#000; --gridln:#e6ebf3;
    --bmc:#7c8aa3; --bmbg:rgba(125,140,165,.16);
    --cBlack:#1b2334; --cGrey:#8a97ab; --cBlue:#2f6fd6; --cOrange:#e08b2b; --cGreen:#2e9e5b; --cStar:#e6c229;
    --sSoS:#2f6fd6;--sNils:#1f8a5f;--sSomme:#8e44ad;--sJan:#c2622a;
    --prog:#c9dcfa;                        /* v11.6 §41.1 — effen voortgangsvulling */
  }
  .dark{
    --pg:#10141b; --surface:#171c25;
    --nb-bg:#1e3f66; --nl-bg:#4a3c26; --ink:#f4f7fb; --muted:#aab6c8; --hair:#2a323d; --ring:#6c7a90;
    --en:#9cc4ff; --ex:#ff8a8a; --g:#d3a9f7; --sep:#2f3844;
    --ok:#3fbf74; --half:#f0b429; --wrong:#f16a66; --accent:#4f8ef0; --purple:#a68cff;
    --ok-lt:#2b6e4a; --wrong-lt:#8f4340;   /* v11.2 §29.5 — autoscroll-swipes in de grafiek */
    --cTrain:#3c8d61; --cTrainBd:#57b183;
    --yellow:#c9a51f; --yellowbd:#a8880f;
    --pin:#0e1219; --pinline:#232b36; --ctrl:#1b222c;
    --unseen:#2a323d; --unseen-bd:#47515f; --star:#f0b429; --fluo:#c9d117; --fluobd:#8f9a10;
    --scrolltrack:#1b222c; --scrollthumb:#e7ecf3; --gridln:#242c37;
    --bmc:#9aa8bd; --bmbg:rgba(160,178,200,.18);
    --cBlack:#39445a; --cGrey:#6b7789; --cBlue:#3f7fe0; --cOrange:#d68a1f; --cGreen:#2c9257; --cStar:#c9a51f;
    --sSoS:#3f7fe0;--sNils:#2c9257;--sSomme:#a366c8;--sJan:#d1803f;
    --prog:#2b3d5c;                        /* v11.6 §41.1 */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  /* v11 §27.8 — Samsung A53: de adresbalk van Chrome-mobiel wijzigde de viewporthoogte,
     waardoor boven- en onderbalk niet samen zichtbaar waren. Nu 100dvh (met -webkit-fill-available
     als terugval), geen scroll op body, en .stage als enige scrollende element. */
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;
            font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--pg);color:var(--ink);}
  .phone{position:relative;max-width:430px;margin:0 auto;
         height:100vh; height:-webkit-fill-available; height:100dvh;
         max-height:100vh; max-height:-webkit-fill-available; max-height:100dvh;
         background:var(--pg);
         display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,.18);}
  .scorebar{height:5px;background:var(--pinline);flex:0 0 auto;transition:background .12s;}
  .scorebar.ok{background:var(--ok);} .scorebar.bad{background:var(--wrong);}

  /* ---------- TOP ---------- */
  .top{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:8px 12px 6px;}
  .swipes{font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.25;}
  .swipes .lbl{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);opacity:.8;margin-bottom:1px;}
  .swipes b{color:var(--accent);font-size:14.5px;} .swipes .sep{color:var(--sep);margin:0 2px;}
  /* v11.3 §32.3 — wat meer lucht tussen «swipes / dag» en «nieuw geleerd» */
  .swipes+.swipes{margin-left:16px;}
  /* v11.3 §32.6/§31.9 — train (lichtgroen) en nieuwe woorden (geel) bovenaan */
  /* v11.3.1 §34.7 — ☀ (nieuw) en ☀ (train) staan in de filterbalk zelf, in dezelfde kleur
     als de kolom eronder: grijs boven TO DO, groen boven gekend. */
  .fb.day[disabled]{opacity:.42;}
  .abtn.cog{font-size:15px;}
  /* v11 §27.7 — zelfde opbouw als het blok links (swipes/dag): klein hoofdletterlabel
     boven, groot cijfer in accentkleur, de rest klein en grijs. */
  .tcenter{flex:1;text-align:center;line-height:1.25;cursor:pointer;}
  .tcenter .ttl{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);opacity:.8;margin-bottom:1px;font-weight:800;}
  .tcenter .prog{font-size:11.5px;font-weight:700;color:var(--muted);}
  .tcenter .prog b{color:var(--accent);font-size:14.5px;font-weight:700;}
  .tcenter .prog small{font-size:11.5px;font-weight:700;color:var(--muted);}
  .topicons{display:flex;gap:6px;}
  .topicons button{border:1px solid var(--hair);background:var(--surface);color:var(--ink);border-radius:10px;width:38px;height:34px;font-size:16px;}

  /* ---------- STAGE (lijst) ---------- */
  .stage{flex:1 1 auto;overflow-y:scroll;padding:2px 10px 8px;position:relative;overscroll-behavior:contain;
         scrollbar-width:auto;scrollbar-color:var(--scrollthumb) var(--scrolltrack);}
  .stage::-webkit-scrollbar{width:22px;}
  .stage::-webkit-scrollbar-track{background:var(--scrolltrack);border-radius:11px;}
  .stage::-webkit-scrollbar-thumb{background:var(--scrollthumb);border-radius:11px;border:4px solid var(--scrolltrack);min-height:60px;}

  .scrollcard{margin-bottom:2px;}
  /* v11.3 §31.1 — de starwrap-strook lag over de bovenrand van de kaart en ving tikken
     op die voor het potlood bedoeld waren. Enkel de ster zelf vangt nu nog aanrakingen. */
  .starwrap{display:flex;justify-content:center;margin:2px 0 -9px;position:relative;z-index:3;pointer-events:none;}
  .starwrap .star{pointer-events:auto;}
  .star{font-size:22px;line-height:1;color:var(--unseen-bd);cursor:pointer;padding:0 8px;}
  .star.on{color:var(--star);}
  .swwrap{position:relative;overflow:hidden;border-radius:11px;margin-bottom:10px;}
  .swtint{position:absolute;inset:0;z-index:1;opacity:0;pointer-events:none;display:flex;align-items:center;border-radius:11px;}
  .swtint.left{justify-content:flex-start;background:linear-gradient(90deg,rgba(46,158,91,.55),rgba(46,158,91,0));}
  .swtint.right{justify-content:flex-end;background:linear-gradient(270deg,rgba(217,75,70,.55),rgba(217,75,70,0));}
  .swtint b{font-size:34px;color:#fff;padding:0 22px;font-weight:900;}
  .card{position:relative;z-index:2;width:100%;background:var(--surface);border:1px solid var(--hair);border-radius:11px;
        padding:8px 7px 6px;border-left:6px solid var(--accent);will-change:transform;touch-action:pan-y;box-shadow:0 1px 3px rgba(20,30,60,.06);}
  .card.starred{background:var(--fluo);border-color:var(--fluobd);}
  .card.starred .meta,.card.starred .pho{color:#4a4f16;}
  .chdr{display:grid;grid-template-columns:1fr 1fr;align-items:start;}
  .chalf{position:relative;min-height:24px;padding:0 2px;}
  /* v11.5 §38.9 — de bolletjes zijn puur informatief: een tik erop mag nooit een score zetten */
  .agg{display:inline-block;width:15px;height:15px;border:2px solid var(--unseen-bd);border-radius:50%;background:var(--unseen);vertical-align:middle;pointer-events:none;}
  .hist{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle;flex-wrap:wrap;pointer-events:none;}
  .dot{width:8px;height:8px;border-radius:50%;pointer-events:none;} .dot.ok{background:var(--ok);} .dot.bad{background:var(--wrong);}
  .scoreblk{touch-action:pan-y;}
  /* v11 §27.9 — BUG: .pho krijgt bij "wazig" een CSS-filter; een element met filter wordt
     geschilderd alsof het z-index:0 heeft en lag dus BOVEN het (ongenummerde) potlood.
     Alle tikken kwamen op .pho terecht en ✏️ deed niets. Oplossing: expliciete z-index
     op .pen + een iets ruimer trefvlak. */
  .pen{position:absolute;top:-3px;right:-2px;z-index:4;font-size:15px;color:var(--muted);cursor:pointer;
       padding:4px 5px 6px 10px;line-height:1;}
  /* v11.3 §31.5 — klankspelling even groot als het hoofdwoord, maar niet vet */
  .pho{text-align:left;font-size:18px;font-weight:400;color:var(--muted);margin-top:1px;padding-left:2px;padding-right:26px;min-height:20px;line-height:1.2;}
  /* v11.8 §43.3 — verbergen in plaats van wazig maken. Wazig verraadt de lengte van het
     antwoord; `visibility:hidden` haalt de inkt weg maar laat de plaats staan, zodat de kaart
     precies even hoog blijft als met tekst erin (uitdrukkelijke keuze van JHS). */
  .pho.blur{visibility:hidden;}
  .bmp{display:block;text-align:right;font-size:10px;color:var(--bmc);line-height:1.3;white-space:normal;}
  .bm{display:block;text-align:right;font-size:10.5px;font-weight:400;color:var(--bmc);margin-top:1px;line-height:1.3;white-space:normal;}
  .bm i,.bmp i{font-style:normal;font-weight:400;font-size:8px;letter-spacing:.4px;background:var(--bmbg);border-radius:3px;padding:1px 3px;margin-right:3px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:3px;}
  .cell{padding:6px 9px;min-width:0;text-align:left;border-radius:4px;}
  .col-nl{background:var(--nl-bg);} .col-nb{background:var(--nb-bg);}
  .cell.w{font-size:18px;font-weight:400;white-space:nowrap;line-height:1.2;} .cell.w b{font-weight:800;}
  .cell.f{font-size:13.5px;line-height:1.35;white-space:nowrap;}
  .cell.sent{font-size:15px;line-height:1.3;white-space:normal;}
  /* v11.8 §43.3 — de cel verdwijnt met inhoud én achtergrond; het lege gekleurde vlak wordt
     door een ::after teruggezet, zodat je nog steeds ziet dát er een kolom staat. */
  .cell{position:relative;}
  .cell.blur{visibility:hidden;}
  .cell.blur::after{content:'';position:absolute;inset:0;visibility:visible;
                    background:inherit;border-radius:4px;}
  .cell.fluo{background:var(--fluo);color:#111;box-shadow:0 0 0 1px var(--fluobd) inset;}
  .en{color:var(--en);font-weight:700;} .ex{color:var(--ex);font-weight:700;} .g{color:var(--g);font-weight:700;}
  .note{color:var(--muted);font-style:italic;font-size:11.5px;} .inv{color:var(--muted);}
  .meta{display:flex;gap:8px;font-size:10.5px;font-weight:800;color:var(--muted);margin-top:5px;padding:0 3px;letter-spacing:.03em;}
  .meta .eps{margin-left:auto;opacity:.85;}
  /* v11.2 §29.6 — discreet merkje «next» op woorden die nog geen score hebben */
  .meta .nx{border:1px solid var(--accent);color:var(--accent);border-radius:5px;padding:0 4px;
            font-size:9.5px;font-weight:900;letter-spacing:.06em;opacity:.85;}
  .cmt{margin:6px 3px 0;border:1px dashed var(--hair);border-radius:9px;background:rgba(125,125,125,.07);padding:6px 9px;font-size:12px;color:var(--muted);line-height:1.4;}
  .none{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px;}

  /* ---------- PIN (altijd zichtbaar) ---------- */
  .pin{flex:0 0 auto;background:var(--pin);border-top:1px solid var(--pinline);padding:0 8px calc(7px + env(safe-area-inset-bottom));}
  .gripbar{padding:5px 0;cursor:pointer;} .grip{width:38px;height:4px;background:var(--unseen-bd);border-radius:3px;margin:0 auto;}
  .statrow{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .count{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:5px 9px;font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap;}
  .count small{color:var(--muted);font-weight:700;}
  .pbar{flex:1;height:9px;background:var(--sep);border-radius:5px;position:relative;overflow:hidden;}
  .pbar i{position:absolute;left:0;top:0;height:9px;width:0;background:var(--accent);border-radius:5px;transition:width .2s;}
  /* v11.3.1 §34.1 — de rij moet met de ⚙-knop erbij nog op 360 px passen */
  .swin{display:flex;gap:2px;align-items:center;font-size:11.5px;font-weight:900;white-space:nowrap;}
  .swin .gg{color:var(--ok);} .swin .rr{color:var(--wrong);}
  .abtn{border:1px solid var(--hair);background:var(--surface);color:var(--ink);border-radius:10px;height:30px;min-width:34px;padding:0 5px;
        display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;flex:0 0 auto;}
  .abtn.add{background:rgba(47,111,214,.16);border-color:var(--accent);color:var(--accent);font-weight:800;}
  /* v11.11.1 §46.1 — een knop van rij 2 die AANSTAAT ziet er nu ook zo uit. `btnBlur` (👁,
     «Noors meteen tonen») en `btnGram` (📖) kregen de klasse `on` al sinds v11.5, maar er hoorde
     geen enkele opmaak bij: je zag dus nergens dát «alles tonen» aanstond. Eén regel voor heel
     rij 2, in dezelfde stijl als BM; het getekende icoon kleurt vanzelf wit mee, want het staat
     op `currentColor` (§45.5). */
  .abtn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .abtn.bmt{font-size:11px;font-weight:900;letter-spacing:.5px;}
  .abtn.bmt.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .abtn.bmt.off{opacity:.5;}
  .fgrid{display:grid;grid-template-columns:1fr 1fr 40px 1fr 1fr 1fr 1fr;gap:3px;}
  .fh{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);font-weight:800;text-align:center;padding-bottom:1px;}
  .fgrid.lbl .fh{display:block;}
  .rlb{font-size:10.5px;font-weight:900;color:var(--muted);letter-spacing:.4px;display:flex;align-items:center;justify-content:center;}
  .pgap{flex:1;}
  .srcrow{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:3px;}
  .sb{border:2px solid transparent;border-radius:7px;padding:4px 0 3px;text-align:center;background:var(--surface);
      font-size:12px;font-weight:800;color:var(--muted);line-height:1.15;}
  .sb small{display:block;font-size:11px;font-weight:800;opacity:.9;}
  .sb.sos{box-shadow:inset 0 -3px 0 var(--sSoS);} .sb.nils{box-shadow:inset 0 -3px 0 var(--sNils);}
  .sb.somme{box-shadow:inset 0 -3px 0 var(--sSomme);} .sb.jan{box-shadow:inset 0 -3px 0 var(--sJan);}
  .sb.on{color:#fff;box-shadow:none;border-color:var(--ink);}
  .sb.sos.on{background:var(--sSoS);} .sb.nils.on{background:var(--sNils);}
  .sb.somme.on{background:var(--sSomme);} .sb.jan.on{background:var(--sJan);}
  /* v11 §27.3 — elke gekozen bron toont zijn eigen verfijningsrij, gestapeld */
  .subrow{display:flex;gap:4px;flex-wrap:wrap;padding:5px;border-radius:9px;margin-top:4px;border:1px dashed var(--sSoS);background:rgba(47,111,214,.12);}
  .subrow.n{border-color:var(--sNils);background:rgba(31,138,95,.12);}
  .subrow.s{border-color:var(--sSomme);background:rgba(142,68,173,.12);}
  .fb{color:#fff;font-size:15px;font-weight:800;text-align:center;border-radius:7px;padding:6px 0;border:2px solid transparent;line-height:1.15;}
  .fb.c0{background:var(--cBlack);} .fb.c1{background:var(--cGrey);} .fb.c2{background:var(--cBlue);}
  .fb.c3{background:var(--cOrange);} .fb.c4{background:var(--cGreen);} .fb.c5{background:var(--cStar);color:#4a4109;}
  .fb.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset,0 2px 6px rgba(20,30,60,.35);}
  .crow{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:6px;}
  .crow.four{grid-template-columns:repeat(4,1fr);}
  .cbtn{border:1px solid var(--hair);background:var(--surface);color:var(--ink);border-radius:11px;padding:6px 2px;font-size:10.5px;font-weight:700;
        text-align:center;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;}
  .cbtn .ic{font-size:18px;line-height:1;}
  .cbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .cbtn.empty{border-style:dashed;border-color:var(--unseen-bd);background:var(--ctrl);color:var(--unseen-bd);}
  .fdot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--wrong);color:#fff;
        font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .panel{overflow:hidden;max-height:460px;transition:max-height .25s ease,opacity .2s;opacity:1;}
  .panel.closed{max-height:0;opacity:0;pointer-events:none;}
  .panel .top2{padding-top:6px;}
  .typerow{display:flex;gap:7px;align-items:center;background:var(--ctrl);padding:6px 7px;border-radius:11px;margin-bottom:6px;}
  .tbtn{border:1px solid var(--hair);background:var(--surface);color:var(--ink);border-radius:18px;padding:4px 14px;font-size:12px;font-weight:700;}
  .tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .row{display:flex;gap:5px;flex-wrap:wrap;background:var(--ctrl);padding:6px;border-radius:11px;margin-bottom:6px;}
  .chipx{border:1px solid var(--hair);background:var(--surface);color:var(--ink);border-radius:18px;padding:4px 9px;font-size:12px;font-weight:700;}
  .chipx.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .chipx.icon{padding:4px 7px;font-size:15px;line-height:1.1;}
  .chipx.dim{opacity:.38;}
  .chipx.season{background:var(--ctrl);border-style:dashed;}
  /* v11.3 §31.2 — de grammatica staat nu in het Bergens; de bokmål-tegenhanger staat eronder */
  .gbmline{font-size:12px;color:var(--bmc);background:var(--bmbg);border-radius:7px;padding:5px 8px;margin-top:5px;line-height:1.45;}
  .gbmline i{font-style:normal;font-size:8px;font-weight:700;letter-spacing:.4px;background:var(--surface);border-radius:3px;padding:1px 3px;margin-right:5px;}
  .legend{display:none;font-size:11px;color:var(--muted);padding:2px 4px 8px;line-height:1.7;}
  .legend.open{display:block;}

  /* ---------- SEARCH ---------- */
  .searchbar{display:none;padding:0 0 6px;gap:6px;} .searchbar.open{display:flex;}
  .searchbar input{flex:1;font-size:15px;padding:9px 10px;border:1px solid var(--hair);border-radius:10px;background:var(--surface);color:var(--ink);}
  .searchbar .clr{border:1px solid var(--hair);background:var(--surface);color:var(--ink);border-radius:10px;padding:0 12px;font-weight:700;}
  .sres .hit{border:1px solid var(--hair);background:var(--surface);border-radius:10px;padding:9px 11px;margin:0 2px 7px;}
  .sres .hit .m{font-size:9.5px;font-weight:800;letter-spacing:.04em;color:var(--accent);text-transform:uppercase;}
  .sres .hit .t{font-size:15px;margin-top:2px;}

  /* ---------- GRAMMATICA ---------- */
  .gram h2{font-size:15px;margin:6px 4px;color:var(--accent);}
  .gnav{display:flex;flex-wrap:wrap;gap:6px;padding:4px;}
  .gnav a{font-size:12.5px;font-weight:600;text-decoration:none;color:var(--muted);background:rgba(125,125,125,.12);border-radius:16px;padding:6px 11px;}
  .gsec{border:1px solid var(--hair);background:var(--surface);border-radius:12px;padding:10px 12px;margin:8px 2px;}
  .gsec>h3{font-size:14px;margin:0 0 4px;}
  .gblock{margin:6px 0;padding-top:8px;border-top:1px solid var(--hair);}
  .gblock h4{font-size:12.5px;margin:0 0 5px;color:var(--accent);}
  .grow{display:flex;gap:8px;margin:4px 0;align-items:flex-start;}
  .glbl{flex:0 0 58px;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding-top:3px;}
  .glbl.warn{color:var(--ex);}
  .gval{flex:1;font-size:13.5px;line-height:1.5;}
  .gexr{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:3px 0;}
  .gexr .ex-nb{background:var(--nb-bg);border-radius:6px;padding:3px 8px;}
  .gexr .ex-nl{background:var(--nl-bg);border-radius:6px;padding:3px 8px;}

  /* ---------- STATS ---------- */
  .sthdr{display:flex;align-items:center;gap:10px;padding:4px 2px 10px;font-weight:800;font-size:16px;}
  .sthdr .bk{border:1px solid var(--hair);background:var(--surface);color:var(--ink);border-radius:9px;padding:5px 11px;font-size:14px;font-weight:700;}
  .tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
  .tile{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:9px 6px;text-align:center;}
  .tile.green{background:rgba(46,158,91,.13);border-color:rgba(46,158,91,.4);}
  .tile .v{font-size:19px;font-weight:800;} .tile .v small{font-size:12px;color:var(--muted);font-weight:700;}
  .tile .k{font-size:10px;color:var(--muted);font-weight:700;margin-top:2px;}
  .chartcard{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:10px 8px 4px;margin-bottom:12px;}
  .ctitle{font-size:13px;font-weight:800;padding:0 4px 2px;}
  .clegend{display:flex;gap:14px;font-size:11px;color:var(--muted);font-weight:700;padding:2px 6px;flex-wrap:wrap;}
  .clegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle;}
  .clegend i.ln{width:14px;height:3px;border-radius:2px;background:var(--purple);}
  .chartcard svg{width:100%;height:auto;display:block;}
  .gl{stroke:var(--gridln);stroke-width:1;} .yl{fill:var(--muted);font-size:8px;text-anchor:end;} .xl{fill:var(--muted);font-size:8px;text-anchor:middle;}
  .pl{fill:var(--muted);font-size:8px;font-weight:700;text-anchor:middle;}
  .lln{fill:none;stroke:var(--purple);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
  .lpt{fill:var(--purple);stroke:var(--surface);stroke-width:1.1;}

  /* ---------- SHEETS ---------- */
  .overlay{position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:20;display:none;}
  .overlay.open{display:block;}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;
         padding:12px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 34px rgba(0,0,0,.4);max-height:92%;overflow-y:auto;}
  .sgrip{width:42px;height:4px;border-radius:2px;background:var(--hair);margin:0 auto 10px;}
  .sheet h3{margin:0 0 10px;font-size:17px;}
  .seg2{display:flex;background:rgba(125,125,125,.14);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px;}
  .seg2 button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 0;font-size:14px;font-weight:700;color:var(--muted);}
  .seg2 button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.18);}
  .field{margin-bottom:8px;display:grid;grid-template-columns:66px 1fr;align-items:center;gap:8px;}
  .field.wide{grid-template-columns:1fr;}
  .ehits{grid-column:1/3;background:var(--surface);border:1px solid var(--ring);border-radius:10px;max-height:150px;overflow-y:auto;margin-top:2px;}
  .ehits .hh{position:sticky;top:0;background:var(--ctrl);display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;
             font-size:9px;font-weight:900;color:var(--muted);letter-spacing:.4px;padding:3px 6px;border-bottom:1px solid var(--hair);}
  .ehr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;border-bottom:1px solid var(--hair);cursor:pointer;}
  .ehr span{padding:5px 6px;font-size:12px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ehr .c1{background:var(--nl-bg);} .ehr .c2{background:var(--nb-bg);color:var(--bmc);} .ehr .c3{background:var(--nb-bg);font-weight:800;}
  .field label{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .field label .opt{margin-left:auto;font-weight:600;text-transform:none;letter-spacing:0;opacity:.8;font-size:11px;}
  .field input,.field textarea{width:100%;font-size:15px;padding:8px 10px;border:1.5px solid var(--hair);border-radius:12px;background:var(--surface);color:var(--ink);font-family:inherit;}
  .field.nb input{background:var(--nb-bg);} .field.nl input{background:var(--nl-bg);} .field.bg input{background:rgba(31,138,95,.14);}
  .hintbox{display:flex;gap:8px;align-items:flex-start;background:rgba(47,111,208,.12);border:1px solid rgba(47,111,208,.3);border-radius:12px;padding:9px 12px;font-size:12px;line-height:1.4;margin:2px 0 12px;}
  .lbl{font-size:12px;font-weight:800;color:var(--muted);margin:12px 0 7px;text-transform:uppercase;letter-spacing:.03em;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;}
  .chip{border:1px solid var(--hair);background:var(--surface);border-radius:18px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--muted);}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .frow{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--hair);}
  .fic{font-size:20px;width:26px;text-align:center;}
  .ftxt{flex:1;} .ftxt .t{font-size:15px;font-weight:700;} .ftxt .d{font-size:12px;color:var(--muted);line-height:1.3;}
  .sw{width:46px;height:28px;border-radius:16px;background:var(--hair);position:relative;flex:0 0 auto;transition:background .15s;}
  .sw.on{background:var(--ok);} .sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;} .sw.on i{left:21px;}
  .gnb{float:right;border:1px solid var(--hair);background:var(--surface);color:var(--ink);border-radius:9px;
       padding:3px 8px;font-size:11px;font-weight:800;}
  .gnote{background:rgba(230,194,41,.16);border:1px dashed var(--star);border-radius:9px;padding:7px 10px;
         font-size:12px;line-height:1.4;margin:0 0 8px;}
  .actions{display:flex;gap:10px;margin-top:8px;}
  .btn{flex:1;border:0;border-radius:14px;padding:13px 0;font-size:15px;font-weight:800;}
  .btn.cancel{background:rgba(125,125,125,.16);color:var(--ink);} .btn.save{background:var(--accent);color:#fff;flex:1.4;}
  .btn.del{background:rgba(217,75,70,.16);color:var(--wrong);} .btn.danger{background:var(--wrong);color:#fff;}
  .manage{border-top:1px solid var(--hair);margin-top:6px;padding-top:12px;}
  .mbtn{width:100%;border:1px solid var(--hair);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px;font-size:13.5px;font-weight:700;margin-bottom:8px;text-align:left;}

  /* ---------- v11 §27.1 · AUTOSCROLL ---------- */
  /* v11.5 §38.11 — de knop in de onderste rij is ⇈ (kaarten laten oplopen); staat de autoscroll
     aan, dan wordt hij 📋 (terug naar de gewone lijst). Het enige echte ▶ staat op de balk. */
  .playbar{display:none;}
  .phone.play .playbar{display:block;}
  /* v11.5 §38.4 — de tekstbalk klapt open/dicht met het greepje, enkel tijdens de autoscroll */
  .phone.play.txtoff .playbar{display:none;}
  /* v11.5 §38.6/§38.14 — filterbalk, bronrij en categorierijen schuiven weg zodra hij speelt */
  .menublk{overflow:hidden;max-height:900px;opacity:1;transition:max-height .14s ease,opacity .14s ease;}
  .phone.playing .menublk{max-height:0;opacity:0;}
  /* focus + doffe rest — enkel in de lijst, niet op de vaste kaart onderaan */
  .phone.play .stage .scrollcard{transition:opacity .2s;}
  .phone.play .stage .scrollcard:not(.focus){opacity:.38;}
  .phone.play .stage .scrollcard.focus .card{box-shadow:0 0 0 3px var(--accent),0 8px 20px rgba(20,30,60,.28);}
  /* v11.8 §43.3 — Noorse kant VERBORGEN (niet meer wazig) op álles behalve de kaart in
     focus; 👁 aan = alles zichtbaar. De hoogte blijft in alle standen dezelfde. */
  /* v11.10 §44.3 — `.hidecol` i.p.v. `.col-nb`: welke kolom dicht gaat hangt nu van de
     richting af (NO? = de Noorse kolom, NL? = de Nederlandse). De klankspelling hoort bij
     het Noors en gaat enkel dicht wanneer je het Noors moet raden (`.phone.rev` = NL?). */
  .phone.play .stage .scrollcard:not(.focus) .cell.hidecol{visibility:hidden;}
  .phone.play:not(.rev) .stage .scrollcard:not(.focus) .pho{visibility:hidden;}
  .phone.play .stage .scrollcard:not(.focus) .cell.hidecol::after{
    content:'';position:absolute;inset:0;visibility:visible;background:inherit;border-radius:4px;}
  .phone.play .stage .scrollcard.focus .cell.hidecol,
  .phone.play .stage .scrollcard.focus .pho{visibility:visible;}
  .phone.play .stage .scrollcard.focus .cell.hidecol::after{content:none;}
  .phone.play.eye .stage .scrollcard .cell.hidecol,
  .phone.play.eye .stage .scrollcard .pho{visibility:visible;}
  .phone.play.eye .stage .scrollcard .cell.hidecol::after{content:none;}
  .phone.play .stage{min-height:120px;}

  /* ---------- v11.1 §28.1 · TWEEKOLOMS TEKSTVELD i.p.v. de vaste kaartkopie ---------- */
  .nlwrap{position:relative;overflow:hidden;border-radius:12px;margin:6px 0 5px;touch-action:none;user-select:none;cursor:pointer;}
  .nlfield{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:3px;
           border:1px solid var(--hair);border-left:6px solid var(--accent);border-radius:12px;overflow:hidden;
           background:var(--surface);box-shadow:0 2px 8px rgba(20,30,60,.12);}
  .nlfield .fcol{padding:12px 11px;min-height:62px;min-width:0;display:flex;flex-direction:column;justify-content:center;}
  .nlfield .fcol.nl{background:var(--nl-bg);}
  .nlfield .fcol.nb{background:var(--nb-bg);}
  .nlfield .word{font-size:26px;font-weight:800;line-height:1.15;text-align:left;letter-spacing:-.2px;
                 white-space:nowrap;overflow:hidden;color:var(--ink);}
  /* §28.9 — lidwoord klein, lichtgrijs, niet vet; het woord zelf groot en vet (em-maten, zodat fit() alles mee schaalt) */
  .nlfield .fcol.nb .word{font-size:15px;font-weight:400;color:var(--muted);}
  .nlfield .fcol.nb .word b{font-size:1.75em;font-weight:800;color:var(--ink);letter-spacing:-.2px;}
  .nlfield .fcol.nb .word .g{font-size:.8em;font-weight:700;}
  .nlfield .fcol.nb .word .note{font-size:.85em;}
  .nlfield .fcol.nb .word.hidden{visibility:hidden;}   /* v11.8 §43.3 — idem (staat achter TXTBAR) */
  .nlwrap .swtint{z-index:3;border-radius:12px;}
  .nlwrap .swtint b{display:none;}

  /* ---------- v11.1 §28.7 · ÉÉN BALK: balans + voortgang ---------- */
  .balbar{position:relative;height:22px;border-radius:11px;overflow:hidden;background:var(--ctrl);
          border:1px solid var(--hair);margin:0 0 4px;}
  .balbar i{position:absolute;top:0;bottom:0;transition:width .25s ease;}
  .balbar i.good{left:0;background:linear-gradient(90deg,var(--ok),rgba(46,158,91,.72));}
  .balbar i.bad{right:0;background:linear-gradient(270deg,var(--wrong),rgba(217,75,70,.72));}
  .balbar .tick{position:absolute;left:50%;top:5px;bottom:5px;width:1px;background:rgba(255,255,255,.6);}
  .balbar .mid{position:absolute;top:-2px;bottom:-2px;width:4px;background:#fff;border-radius:2px;
               box-shadow:0 0 0 1.5px rgba(20,30,60,.45),0 1px 4px rgba(20,30,60,.4);transition:left .25s ease;z-index:2;}
  .balbar b{position:absolute;top:0;line-height:22px;font-size:11px;font-weight:900;color:#fff;
            text-shadow:0 1px 2px rgba(0,0,0,.4);transition:opacity .25s ease;}
  .balbar b.cok{left:9px;}
  .balbar b.cbad{right:9px;}
  .balbar em{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);border-radius:0 3px 3px 0;
             font-style:normal;box-shadow:0 0 0 1px rgba(255,255,255,.35);transition:width .25s ease;z-index:3;}

  /* ---------- v11.5 §38.4 · DE VOORTGANGSBALK (altijd zichtbaar) ---------- */
  .pwrap{padding:0 0 6px;}
  /* v11.5.1 §40.2 — greepje, ▶ en de snelheidskeuze horen bij de autoscroll; buiten de
     autoscroll zijn ze weg en blijft enkel de balk over (balans van vandaag + je plaats in de lijst). */
  .asgrip{display:none;justify-content:center;padding:5px 0 6px;cursor:pointer;touch-action:manipulation;}
  .phone.play .asgrip{display:flex;}
  .asgrip i{display:block;width:46px;height:4px;border-radius:3px;background:var(--accent);}
  .pwrap:not(.on){padding-top:7px;}
  .prow{display:flex;gap:6px;align-items:center;}
  .pp{flex:0 0 auto;width:40px;height:30px;border-radius:10px;border:1px solid var(--ok);
      background:rgba(46,158,91,.16);color:var(--ok);font-size:14px;font-weight:800;
      display:none;align-items:center;justify-content:center;}
  .phone.play .pp{display:flex;}
  .dd{position:relative;flex:0 0 auto;display:none;}
  .phone.play .dd{display:block;}
  .spd{height:30px;border:1px solid var(--hair);background:var(--surface);color:var(--ink);
       border-radius:10px;padding:0 8px;font-size:12px;font-weight:800;white-space:nowrap;}
  .dd.open .spd{background:var(--accent);border-color:var(--accent);color:#fff;}
  .ddm{display:none;position:absolute;bottom:34px;left:0;z-index:30;background:var(--surface);
       border:1px solid var(--hair);border-radius:10px;box-shadow:0 6px 18px rgba(20,30,60,.28);
       padding:4px;grid-template-columns:repeat(2,1fr);gap:3px;width:138px;}
  .dd.open .ddm{display:grid;}
  .asbar{flex:1;height:30px;border-radius:10px;margin:0;cursor:pointer;}
  .asbar b{line-height:30px;}

  .abtn.eye.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .speeds{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:6px;}
  .spb{border:1px solid var(--hair);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 0;
       font-size:11.5px;font-weight:800;text-align:center;}
  .spb.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  /* bron/persoon-keuze in ＋ en ✏️ (§27.5) */
  .seg3{display:flex;background:rgba(125,125,125,.14);border-radius:12px;padding:4px;gap:4px;margin:0 0 10px;}
  .seg3 button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 0;font-size:12.5px;font-weight:700;color:var(--muted);}
  .seg3 button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.18);}
  .seglbl{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:2px 0 5px;}

  /* ================= v11.6 §41 · NIEUWE ONDERBOUW ================= */
  /* v11.6 §41.16 — ◀▶ staat nu in de bovenbalk, links van 🌙, in dezelfde knopvorm. */
  .topicons .swin{border:1px solid var(--hair);background:var(--surface);border-radius:10px;
                  width:38px;height:34px;justify-content:center;font-size:13px;}
  /* v11.6 §41.25 — de tekstbalk (grote gele leesregel) én zijn greepje staan achter TXTBAR.
     Niets is verwijderd: één const bovenaan het script zet ze weer aan. */
  .phone.notxt .playbar, .phone.notxt .asgrip{display:none!important;}
  /* v11.6 §41.1/§41.4 — één effen voortgangsvulling met streepjes, geen balansvlakken meer.
     Duidelijker contour: 2 px rand + lichte binnenschaduw. */
  .pbarn{position:relative;flex:1;height:36px;border-radius:11px;overflow:hidden;background:var(--ctrl);
         border:2px solid #8e9cb8;box-shadow:inset 0 1px 2px rgba(0,0,0,.10);cursor:pointer;}
  .pbarn em{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--prog);
            font-style:normal;transition:width .15s linear;}
  /* v11.7 §42.8 — de groen/rode streepjes van §41.2 zijn weg: bij een deck van duizenden
     kaarten is één kaart een fractie van een pixel, dus ze zeiden niets. `.tk` bestaat niet meer. */
  /* v11.7 §42.9 — in de plaats komen twee tellers ÍN de balk: links in het groen de goede
     swipes van deze beurt, rechts in het rood de foute. Elk op een eigen vlakje in de kleur van
     het scherm, zodat ze leesbaar blijven zodra de voortgangsvulling eronder doorschuift. */
  .pbarn b{position:absolute;top:50%;transform:translateY(-50%);z-index:4;pointer-events:none;
           font-size:12.5px;font-weight:900;line-height:1;padding:3px 7px;border-radius:8px;
           background:var(--surface);border:1px solid var(--hair);font-variant-numeric:tabular-nums;}
  .pbarn b.cok{left:5px;color:var(--ok);}
  .pbarn b.cbad{right:5px;color:var(--wrong);}
  /* v11.7 §42.7 — rechts náást de balk: waar je zit / hoeveel kaarten de selectie telt. */
  .pcnt{flex:0 0 auto;min-width:54px;text-align:right;font-size:12px;font-weight:800;
        color:var(--muted);letter-spacing:.02em;font-variant-numeric:tabular-nums;}
  /* v11.7 §42.6 — het versienummer stond enkel in een <meta>; nu zichtbaar in de bovenbalk. */
  .vers{font-size:10px;font-weight:800;color:var(--muted);opacity:.75;margin-right:7px;
        letter-spacing:.03em;white-space:nowrap;}
  /* v11.6 §41.3 — buiten de autoscroll blijft de plaats van ▶ gereserveerd: de balk mag niet
     verspringen als je van de lijst naar de autoscroll gaat. Dus visibility, geen display. */
  .pp{display:flex;visibility:hidden;width:44px;height:36px;font-size:15px;}
  .phone.play .pp{visibility:visible;}
  /* v11.6 §41.17/§41.18 — rij 1 telt acht knoppen, elk breder en hoger, met grotere tekens. */
  .statrow .abtn{flex:1 1 0;min-width:0;height:46px;font-size:21px;padding:0;}
  .statrow .abtn.cog{font-size:20px;}
  .statrow .abtn.bmt{font-size:14px;}
  .statrow{gap:5px;}
  /* v11.6 §41.11/§41.12 — rij 2 tijdens de LOPENDE autoscroll: één knop per snelheid. */
  .speedrow{display:none;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:6px;}
  .phone.playing .speedrow{display:grid;}
  .speedrow .spb{height:44px;border-radius:11px;font-size:14px;display:flex;align-items:center;justify-content:center;}
  /* v11.6 §41.19 — de selectieknoppen (filterbalk 28 px + bronrij) houden hun formaat. */
  /* v11.6 §41.15 — dun greepje over de volle breedte, helemaal onderaan: menu tonen/verbergen.
     Het kleurt blauw zolang het menublok weg is. */
  .mgrip{flex:0 0 auto;height:20px;background:var(--pin);border-top:1px solid var(--pinline);
         display:flex;align-items:center;justify-content:center;cursor:pointer;
         padding-bottom:env(safe-area-inset-bottom);box-sizing:content-box;}
  .mgrip i{display:block;width:64px;height:5px;border-radius:3px;background:var(--unseen-bd);transition:background .15s;}
  .mgrip.closed i{background:var(--accent);}
  /* v11.6 §41.15 — het menublok zelf: rij 1 + rij 2 schuiven samen weg. */
  .normalbar{overflow:hidden;max-height:900px;opacity:1;transition:max-height .16s ease,opacity .16s ease;}
  .phone.menuoff .normalbar{max-height:0;opacity:0;}
  /* v11.6 §41.21 — korte melding bij het uitstellen van een item uit de dagset */
  .toastn{position:absolute;left:12px;right:12px;bottom:96px;background:var(--ink);color:var(--pg);
          border-radius:11px;padding:9px 12px;font-size:12.5px;font-weight:700;line-height:1.35;
          opacity:0;transition:opacity .2s;pointer-events:none;z-index:25;}
  .toastn.on{opacity:.95;}

  @media (orientation:landscape){ .phone{max-width:none;} .cmt{display:none;} }
  .hide{display:none!important;}

  /* ================= v11.10 §44 · DE BEDIENING ================= */
  /* §44.1 — ◀▶ bovenaan zijn een AANDUIDING, geen knop: geen rand, geen vlak, doffer.
     Ze blijven wel aantikbaar (de werking verandert niet, enkel het uiterlijk). */
  .topicons .swin{border:0!important;background:none!important;box-shadow:none!important;
                  width:auto;padding:0 2px;opacity:.6;font-size:11px;letter-spacing:.5px;}
  /* v11.11 §45.6 — §44.2 is teruggedraaid: het versienummer is weer gewone tekst.
     De terugrolknop wiste enkel de cache en haalde daarna opnieuw op wat er op de server
     staat — dat was geen terugrol. Echt terug kunnen is een publicatie-afspraak. */
  /* §44.4 — geen scrollbalk meer rechts */
  .stage{scrollbar-width:none!important;}
  .stage::-webkit-scrollbar{width:0!important;height:0!important;}
  /* §44.5 — alle knoppen van rij 1 én rij 2 zijn 38×38; enkel ▶ is dubbel zo breed (81 px) */
  .abtn{height:38px!important;min-width:38px!important;width:38px!important;padding:0!important;flex:0 0 38px!important;}
  .statrow{justify-content:space-between;gap:5px;}
  .prow{gap:5px;}
  .pbarn{height:38px!important;}
  .pcnt{min-width:40px!important;font-size:11px!important;}
  /* §44.6 — ▶ met drie standen: wit = lijst · blauw = loopt · lichtblauw = pauze.
     De knop wordt NOOIT ❚❚; een tik op blauw brengt je terug naar de lijst. */
  .pp{display:flex!important;visibility:visible!important;width:81px;height:38px;font-size:15px;
      background:var(--surface)!important;border:1px solid var(--hair)!important;color:var(--ink)!important;}
  .pp.on{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important;}
  .pp.paused{background:rgba(47,111,214,.16)!important;border-color:var(--accent)!important;color:var(--accent)!important;}
  .pp.off{opacity:.38;}
  /* §44.7 — snelheid als ZWEVEND knoppenmenu boven de knop (geen dropdown, geen rij in rij 2) */
  .spwrap{position:relative;flex:0 0 auto;}
  .spbtn{width:38px;height:38px;border:1px solid var(--hair);background:var(--surface);color:var(--ink);
         border-radius:10px;font-size:11.5px;font-weight:800;font-family:inherit;}
  .spbtn:disabled{opacity:.38;}
  /* v11.11 §45.2/§45.3 — het menu bevat nu twee blokken: negen snelheden (3 × 3) en, eronder,
     het onthulpercentage van de beurtstand (0/25/50/75/100 %). */
  .spmenu{display:none;position:absolute;left:0;bottom:44px;z-index:25;background:var(--surface);
          border:1px solid var(--hair);border-radius:12px;padding:7px;width:176px;
          box-shadow:0 6px 20px rgba(20,30,60,.28);}
  .spmenu.open{display:block;}
  .spmenu .splb{font-size:8.5px;font-weight:800;letter-spacing:.4px;color:var(--muted);
          text-transform:uppercase;margin:0 0 4px;line-height:1.2;}
  .spgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
  .spgrid button{height:30px;border:1px solid var(--hair);background:var(--surface);color:var(--ink);
          border-radius:8px;font-size:12.5px;font-weight:800;font-family:inherit;padding:0;}
  .spgrid button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .spsep{height:1px;background:var(--hair);margin:8px 0 6px;}
  .pcgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;}
  .pcgrid button{height:28px;border:1px solid var(--hair);background:var(--surface);color:var(--ink);
          border-radius:7px;font-size:10px;font-weight:800;font-family:inherit;padding:0;}
  .pcgrid button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .spmenu .pcblk.dim{opacity:.45;}
  /* §44.8 — 🔀 en de beurtstand staan in de speelrij */
  .shuf{flex:0 0 auto;width:38px;height:38px;border:1px solid var(--hair);background:var(--surface);
        color:var(--ink);border-radius:10px;font-size:16px;display:flex;align-items:center;justify-content:center;}
  .shuf.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .speedrow{display:none!important;}
  /* v11.11 §45.5 — ALLE knopiconen van rij 1 én rij 2 zijn zwart-wit. De gekleurde emoji
     (⚙ 📖 👁 🔍 🔀) zijn vervangen door getekende lijniconen in `currentColor`, zodat ze
     vanzelf de kleur van de knop volgen: zwart op wit, wit op blauw als de knop aanstaat.
     Grijs maken met `filter:grayscale()` kon niet — dan wordt een actieve knop grijs
     in plaats van wit. */
  .ico{display:block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;
       stroke-linecap:round;stroke-linejoin:round;}
  .shuf .ico{width:19px;height:19px;}
  /* het teken voor de beurtstand: drie vierkantjes, licht achter elkaar geschoven */
  .tico{position:relative;display:block;width:19px;height:15px;}
  .tico i{position:absolute;width:11px;height:11px;border-radius:2px;background:var(--ink);
          box-shadow:0 0 0 1px var(--surface);}
  .tico i:nth-child(1){left:0;top:0;opacity:.35;}
  .tico i:nth-child(2){left:3px;top:2px;opacity:.65;}
  .tico i:nth-child(3){left:6px;top:4px;opacity:1;}
  .shuf.on .tico i{background:#fff;box-shadow:0 0 0 1px var(--accent);}
  /* §44.9 — richtingknop NO?/NL?, links van BM; ＋ en BM zijn gewone witte knoppen */
  .abtn.dir{font-size:12px;font-weight:900;letter-spacing:.2px;}
  .abtn.dir.rev{background:var(--accent);border-color:var(--accent);color:#fff;}
  .abtn.add{background:var(--surface);border-color:var(--hair);color:var(--ink);font-weight:800;}
  .abtn.bmt.off{background:var(--surface);border-color:var(--hair);color:var(--ink);opacity:1;}
  /* het ←-merkje bij de score: enkel zichtbaar wanneer je het Nederlands raadt */
  .dirmark{font-size:12px;font-weight:900;color:var(--accent);margin-right:4px;vertical-align:middle;}
  /* §44.10 — dunne lijn: de kolomkopjes horen bij de selectie, niet bij de knoppenrij */
  .fsep{height:1px;background:var(--pinline);margin:0 0 5px;}
  /* §44.11 — rij 2 blijft ook tijdens het spelen staan */
  .phone.playing .menublk{max-height:900px;opacity:1;}
  /* §44.12 — de compacte selectierij: streepjes van 9 px, geen cijfers */
  .fpack{cursor:pointer;}
  .menublk.compact .fgrid,.menublk.compact .srcrow,.menublk.compact #subrows{display:none;}
  .menublk:not(.compact) .fpack{display:none;}
  .fstrip{display:grid;grid-template-columns:1fr 1fr 40px 1fr 1fr 1fr 1fr;gap:3px;}
  .fstrip .fh{font-size:8px;line-height:1;padding-bottom:1px;}
  .fstrip b{display:block;height:9px;border-radius:3px;background:var(--cGrey);}
  .fstrip b.tr{background:var(--cGreen);}
  .fstrip i{display:block;height:9px;border-radius:3px;}
  .fstrip .rlb{font-size:8.5px;}
  .fstrip i.c0{background:var(--cBlack);} .fstrip i.c1{background:var(--cGrey);}
  .fstrip i.c2{background:var(--cBlue);}  .fstrip i.c3{background:var(--cOrange);}
  .fstrip i.c4{background:var(--cGreen);} .fstrip i.c5{background:var(--cStar);}
  .fstrip i.sel{box-shadow:0 0 0 2px var(--ink);}
  .fsrc{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:4px;}
  .fsrc span{font-size:9.5px;font-weight:800;text-align:center;color:var(--muted);
             border-radius:4px;padding:1px 0 2px;opacity:.55;}
  .fsrc span.sos{box-shadow:inset 0 -2px 0 var(--sSoS);} .fsrc span.nils{box-shadow:inset 0 -2px 0 var(--sNils);}
  .fsrc span.somme{box-shadow:inset 0 -2px 0 var(--sSomme);} .fsrc span.jan{box-shadow:inset 0 -2px 0 var(--sJan);}
  .fsrc span.on{opacity:1;color:#fff;}
  .fsrc span.sos.on{background:var(--sSoS);} .fsrc span.nils.on{background:var(--sNils);}
  .fsrc span.somme.on{background:var(--sSomme);} .fsrc span.jan.on{background:var(--sJan);}
  /* §44.13 · v11.11 §45.4 — BEURTSTAND: één kaart, geen scrollen.
     §45.4a — GEEN flex meer. Met `display:flex` + centreren kreeg de kaart een andere breedte
     dan in de lijst; met het gewone blok-model is ze exact even breed als overal elders.
     §45.4d — enkel de BOVENKANT ligt vast: de kaart begint bovenaan #stage en mag naar onder
     groeien. Wordt ze hoger dan het venster, dan schaalt turnFit() ze terug (transform-origin
     bovenaan) — er wordt nooit gescrold. */
  .phone.turn .stage{overflow:hidden!important;}
  .phone.turn .stage .scrollcard{width:auto;transform-origin:top center;}
  .phone.turn .stage .scrollcard:not(.focus){display:none;}
  .phone.turn .stage .scrollcard.focus{opacity:1!important;}
  .phone.turn .stage .scrollcard.focus .card{box-shadow:0 0 0 3px var(--accent),0 8px 20px rgba(20,30,60,.28);}
  .phone.turn #astop,.phone.turn #asbot{display:none!important;}
  /* v11.11 §45.1 — in de beurtstand blijft de doelkolom dicht tot het onthulmoment, óók op de
     kaart in focus. De speelregels van §43.3/§44.3 tonen de focuskaart altijd; hier moet het
     omgekeerde gelden zolang `.blur` op de cel staat, dus met hogere soortelijkheid. */
  .phone.turn.play .stage .scrollcard.focus .cell.hidecol.blur{visibility:hidden;}
  .phone.turn.play:not(.rev) .stage .scrollcard.focus .pho.blur{visibility:hidden;}
  .phone.turn.play .stage .scrollcard.focus .cell.hidecol.blur::after{
    content:'';position:absolute;inset:0;visibility:visible;background:inherit;border-radius:4px;}
  /* 👁 (alles tonen) blijft alles tonen, ook in de beurtstand */
  .phone.turn.play.eye .stage .scrollcard.focus .cell.hidecol.blur,
  .phone.turn.play.eye .stage .scrollcard.focus .pho.blur{visibility:visible;}
  .phone.turn.play.eye .stage .scrollcard.focus .cell.hidecol.blur::after{content:none;}
</style>
</head>

        <button class="shuf" id="btnShuf" title="reshuffle"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.6h3.2c1.7 0 2.7 1 3.7 2.6l3.2 5.3c1 1.6 2 2.6 3.7 2.6H21"/><path d="M3 17.1h3.2c1.7 0 2.7-1 3.7-2.6l.7-1.2"/><path d="M13.2 9.9l.7-1.2c1-1.6 2-2.6 3.7-2.6H21"/><path d="M18.7 3.7L21 6.1l-2.3 2.4"/><path d="M18.7 14.7l2.3 2.4-2.3 2.4"/></svg></button>
        <!-- v11.6 §41.1 · v11.7 §42.8/§42.9 — één effen voortgangsvulling; de streepjes zijn
             weg, links staat de groene teller en rechts de rode van deze beurt. -->
        <div class="pbarn" id="pbar" title="tik = start / pauze · pauze toont het menu">
          <em id="bprog"></em><span class="lbl" id="blbl"></span>
          <b class="cok" id="bcok">0</b><b class="cbad" id="bcbad">0</b>
        </div>
        <!-- v11.7 §42.7 — scrollpositie / totaal in de selectie, náást de balk -->

    <div class="normalbar" id="normalbar">
      <!-- v11.6 §41.17 — rij 1: acht knoppen, ⇈ vooraan recht onder ▶; ◀▶ staat bovenaan -->

           NO?/NL? komt erbij, links van BM. Zeven knoppen van 38×38. -->
      <div class="statrow">
        <!-- v11.11 §45.5 — getekende zwart-witte iconen i.p.v. ⚙ 📖 👁 🔍 -->
        <button class="abtn cog" id="btnCfg" title="instellingen"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.1"/><circle cx="12" cy="12" r="7.3"/><path d="M12 2.7v2M12 19.3v2M2.7 12h2M19.3 12h2M5.4 5.4l1.4 1.4M17.2 17.2l1.4 1.4M18.6 5.4l-1.4 1.4M6.8 17.2l-1.4 1.4"/></svg></button>
        <button class="abtn" id="btnGram" title="grammatica"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.6C10.3 5.3 8.2 4.7 5 4.7v12.7c3.2 0 5.3.6 7 1.9 1.7-1.3 3.8-1.9 7-1.9V4.7c-3.2 0-5.3.6-7 1.9z"/><path d="M12 6.6v12.7"/></svg></button>
        <button class="abtn" id="btnBlur" title="alles verbergen / alles tonen"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.6 12S6.1 5.9 12 5.9 21.4 12 21.4 12 17.9 18.1 12 18.1 2.6 12 2.6 12z"/><circle cx="12" cy="12" r="2.9"/></svg></button>
        <button class="abtn" id="btnSearch" title="zoeken"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.6" cy="10.6" r="6"/><path d="M15.1 15.1L20 20"/></svg></button>
        <button class="abtn add" id="btnAdd" title="nieuw item">＋</button>

        <button class="abtn bmt" id="btnBM" title="bokmål-regels tonen">BM</button>
      </div>
      <div class="searchbar" id="searchbar"><input id="searchinput" placeholder="zoek woord of zin…"><button class="clr" id="searchclr">✕</button></div>
      <!-- v11.6 §41.11 — rij 2 · A: de snelheden, enkel tijdens de LOPENDE autoscroll -->
      <!-- v11.10 §44.7 — de snelheidsrij is vervangen door het zwevende menu in de speelrij.
           Het element blijft leeg staan (verborgen) zodat oude verwijzingen niets breken. -->
      <div class="speedrow" id="speedrow"></div>
      <!-- v11.10 §44.10 — dunne lijn: de kolomkopjes horen bij de selectie -->
      <div class="fsep"></div>

      <div class="menublk compact" id="menublk">

<script>
/* ===================== BASIS ===================== */
/* v11.6 §41.25 — DE TEKSTBALK STAAT GEPARKEERD, NIET GESCHRAPT.
   De grote gele leesregel onderaan (§38.3) en zijn greepje (SET.astxtoff, §38.11) zijn uit de
   UI verdwenen. Alle HTML, CSS en logica blijft staan: zet TXTBAR op true en alles komt terug.
   SET.astxtoff blijft gewoon in sos_set_v6 staan en wordt NIET gewist. */
const TXTBAR=false;
const $=id=>document.getElementById(id);
const strip=s=>(s||'').replace(/<[^>]+>/g,'').replace(/&#8209;/g,'-').replace(/\s+/g,' ').trim();
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const store=(()=>{ try{const k='__t';localStorage.setItem(k,'1');localStorage.removeItem(k);return localStorage;}
  catch(e){const m={};return{getItem:k=>k in m?m[k]:null,setItem:(k,v)=>m[k]=''+v,removeItem:k=>delete m[k]};} })();
const load=(k,d)=>{try{const v=store.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}};
const save=(k,v)=>{try{store.setItem(k,JSON.stringify(v));}catch(e){}};
const dayKey=off=>{const d=new Date();d.setDate(d.getDate()-(off||0));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const todayKey=()=>dayKey(0);

/* ===================== OPSLAG ===================== */
let scores=load('sos_scores_v6',{});
let USER=load('sos_user_v6',[]);
let FAV=new Set(load('sos_fav_v6',[]));
let NOTES=load('sos_notes_v6',{});
let CORR=load('sos_corr_v6',{});     /* correcties op officiële woorden → mee naar Claude bij sync */
let FLUO=load('sos_fluo_v6',{});     /* {id:[rijindexen]} fluogele NB-cellen = foutgeheugen */
/* v11.2 §29.5 — aok/abad = het deel van ok/bad dat uit de AUTOSCROLL komt.
   ok/bad blijven de TOTALEN, zodat alles buiten de grafiek samengevoegd blijft zoals vroeger. */
let DAILY=load('sos_daily_v6',{});   /* {'2026-08-03':{ok,bad,new,add,aok,abad}} */
let GNOTE=load('sos_gnote_v6',{});   /* v10: eigen opmerkingen per grammaticahoofdstuk */
/* v11.11 §45.2 — de RUWE inhoud van sos_set_v6, vóór de standaardwaarden erover gaan. De
   omrekening van de snelheid moet weten wat er ÉCHT bewaard stond: null = verse installatie
   (niets om te schuiven), een object zonder `asSpeedV` = van vóór v11.6. Zonder deze foto zou
   de standaardwaarde de herkomst uitwissen en zou de omrekening nooit lopen. */
const RAWSET=load('sos_set_v6',null);
let SET=Object.assign({types:['woord','zin'],eps:[],themes:[],basis:false,dark:false,showAns:false,panel:false,showBM:true,fsel:null,nch:[],src:[],who:[],asSpeed:5,asSpeedV:1111,turnPct:50,   /* v11.11 §45.2/§45.3 — standaard 1,5s (index 5 in SPEEDS) en 50 % */
  /* v11.3 — nperday §32.5 · pick/train/newday §31.6+§31.9. Alles binnen de BESTAANDE sleutel sos_set_v6. */
  nperday:15,pick:null,train:null,newday:null}, load('sos_set_v6',{}));
if(typeof SET.basis!=='boolean') SET.basis=false;
if(typeof SET.showBM!=='boolean') SET.showBM=true;
/* v11.5.1 §40.3 — SET.fsel houdt nu een LIJST van types aan: {s:'new', t:['woord','zin']}.
   De oude vorm {t:'woord', s:'new'} wordt stil omgezet, zodat niemand zijn keuze kwijtspeelt. */
if(SET.fsel && typeof SET.fsel.t==='string') SET.fsel={s:SET.fsel.s,t:[SET.fsel.t]};
if(SET.fsel && !Array.isArray(SET.fsel.t)) SET.fsel=null;
if(SET.fsel && (!SET.fsel.t.length || !SET.fsel.s)) SET.fsel=null;
if(!Array.isArray(SET.nch)) SET.nch=[];
if(!Array.isArray(SET.types)||!SET.types.length) SET.types=['woord','zin'];
if(!Array.isArray(SET.themes)) SET.themes=[];
if(!Array.isArray(SET.src)) SET.src=[];
if(!Array.isArray(SET.who)) SET.who=[];                       /* v11 §27.4 — Johanne / Emma & Lene */
/* v11.1 §28.3 — de terugzetting op index 2 van de reeks van acht is vervangen door de
   omrekening hieronder: de reeks is in §41.12 opnieuw gewijzigd, dus alles loopt via één weg. */
/* v11.6 §41.12 — de reeks was 2s · 1,5s · 1,2s · 1s · 0,8s (`asSpeedV=116`).
   v11.11 §45.2 — DE REEKS WORDT NEGEN STANDEN: 6 · 5 · 4 · 3 · 2 · 1,5 · 1,2 · 1 · 0,8 s,
   want dezelfde knop stuurt nu ook de beurtstand, en daar heb je trage standen nodig om te
   kunnen meelezen. `SET.asSpeed` is en blijft een INDEX in SPEEDS binnen de bestaande sleutel
   sos_set_v6 — de reeks verandert dus opnieuw van lengte en de omrekening van §41.12 moet mee
   opgeschoven worden, anders wijst een bewaarde index naar de verkeerde knop (index 1 was 1,5s
   en zou nu 5s worden) en staat er bij niemand nog een knop aan.
   Er zijn drie herkomsten: `asSpeedV=1111` (al goed) · `asSpeedV=116` (index in de reeks van
   vijf) · al de rest (index in de oude reeks van acht, of een ruwe waarde in seconden). Alle
   drie worden één keer naar SECONDEN vertaald en dan naar de dichtstbijzijnde nieuwe stand
   geschoven. Standaard = 1,5s (index 5). */
const SPEEDV=1111;
/* de herkomst komt uit RAWSET, niet uit SET: de standaardwaarde hierboven zou anders elke
   oude stand als «al omgerekend» laten doorgaan (dat was de valkuil van §41.12). */
const FROMV = !RAWSET ? SPEEDV
            : (typeof RAWSET.asSpeedV==='number' ? RAWSET.asSpeedV : 0);
if(FROMV!==SPEEDV){
  const OLD8=[3,2.5,2,1.5,1.2,1,.8,.6], OLD5=[2,1.5,1.2,1,.8], NEW9=[6,5,4,3,2,1.5,1.2,1,.8];
  let sec=1.5;
  const a=RAWSET.asSpeed;
  if(typeof a==='number'){
    const whole=(a===Math.round(a));
    if(FROMV===116) sec=(whole&&a>=0&&a<5)?OLD5[a]:a;
    else            sec=(whole&&a>=0&&a<8)?OLD8[a]:a;
  }
  let bi=5, bd=1e9;
  NEW9.forEach(function(v,i){ const d=Math.abs(v-sec); if(d<bd){ bd=d; bi=i; } });
  SET.asSpeed=bi; SET.asSpeedV=SPEEDV;
  save('sos_set_v6',SET);              /* saveSet() bestaat hier nog niet — zelfde sleutel */
}
if(!(SET.asSpeed>=0 && SET.asSpeed<9)) SET.asSpeed=5;

function migDubbels(MAP,FLAG,BAK){
  if(SET[FLAG]) return;
  const OF={}; Object.keys(MAP).forEach(k=>MAP[k].forEach(d=>OF[d]=k));
  /* 1 · eerst een volledige kopie wegschrijven, in een EIGEN sleutel (niet in sos_set_v6,
        want die wordt bij élke instelling opnieuw bewaard). */
  save(BAK, {v:FLAG, ts:Date.now(),
    scores:scores, fav:[...FAV], notes:NOTES, corr:CORR, fluo:FLUO, user:USER});

  /* 2 · scores: per richting (id|NL, id|NB) samensmelten.
        De historiek met de MEESTE swipes wint; de ema wordt gewogen naar dat aantal;
        `first` en `gfirst` worden de vroegste van de groep, `ts` de laatste. */
  const n=s=>(s&&s.hist)?s.hist.length:0;
  const seen={};
  Object.keys(scores).forEach(function(k){
    const i=k.lastIndexOf('|'); if(i<0) return;
    const id=k.slice(0,i), suf=k.slice(i);
    const tgt=OF[id]; if(!tgt) return;
    const dst=tgt+suf, a=scores[dst], b=scores[k];
    if(!a){ scores[dst]=b; }
    else {
      const win = n(b)>n(a) ? b : a, los = win===a ? b : a;
      const na=n(win), nb=n(los), tot=na+nb;
      const out={hist:(win.hist||[]).slice(-8)};
      if(win.ema!=null&&los.ema!=null&&tot) out.ema=(win.ema*na+los.ema*nb)/tot;
      else out.ema=(win.ema!=null)?win.ema:los.ema;
      const mn=(x,y)=>(x&&y)?Math.min(x,y):(x||y);
      if(mn(win.first,los.first))  out.first=mn(win.first,los.first);
      if(mn(win.gfirst,los.gfirst))out.gfirst=mn(win.gfirst,los.gfirst);
      const ts=Math.max(win.ts||0,los.ts||0); if(ts) out.ts=ts;
      scores[dst]=out;
    }
    delete scores[k]; seen[id]=1;
  });

  /* 3 · favorieten, notities, correcties, fluo — verhuizen mee, niets gaat weg */
  Object.keys(OF).forEach(function(d){
    const t=OF[d];
    if(FAV.has(d)){ FAV.add(t); FAV.delete(d); }
    if(NOTES[d]){ NOTES[t]=NOTES[t] ? (NOTES[t]+' · '+NOTES[d]) : NOTES[d]; delete NOTES[d]; }
    if(CORR[d]){  CORR[t]=CORR[t]  ? (CORR[t] +' · '+CORR[d])  : CORR[d];  delete CORR[d]; }
    if(FLUO[d]){  FLUO[t]=[...new Set([].concat(FLUO[t]||[],FLUO[d]))].sort((a,b)=>a-b); delete FLUO[d]; }
    /* een eigen (bewerkte) kaart met een verdwenen id gaat mee naar de prullenmand */
    const u=USER.findIndex(x=>x.id===d); if(u>=0) USER[u].deleted=true;
  });

  /* 4 · de dagsets: verwijzingen omzetten zodat ☀15 en train vandaag niet breken */
  const mapIds=a=>[...new Set((a||[]).map(id=>OF[id]||id))];
  if(SET.train&&SET.train.ids)  SET.train.ids =mapIds(SET.train.ids);
  if(SET.newday&&SET.newday.ids)SET.newday.ids=mapIds(SET.newday.ids);
  if(SET.daySkip) Object.keys(SET.daySkip).forEach(function(id){
    const t=OF[id]; if(t){ SET.daySkip[t]=SET.daySkip[id]; delete SET.daySkip[id]; } });

  save('sos_scores_v6',scores); save('sos_fav_v6',[...FAV]); save('sos_notes_v6',NOTES);
  save('sos_corr_v6',CORR); save('sos_fluo_v6',FLUO); save('sos_user_v6',USER);
  SET[FLAG]=1; saveSet();
}

   Ze staan bij ZWAK zonder dat ze een kunstmatige foutswipe krijgen (dat was de oude seedWrong-truc).
   Zodra er een echte score is, telt gewoon die score. */
function isNext(it){ return (it.labels||[]).indexOf('next')>=0; }
function isFresh(it){ const s=getScore(it.id); return !(s&&s.hist&&s.hist.length); }
/* ---- v11.5 §38.8 · eenmalige migratie van `gfirst` (en `first`) ----
   «nieuw geleerd» telde te hoog (72·60·60). De fix van §34.6 werkt enkel voor woorden die ná
   v11.3.1 groen werden: alles wat daarvóór al groen stond draagt geen `gfirst`, en kreeg er
   alsnog een — mét dagteller — zodra het na een foute veeg opnieuw op groen sprong.
   Hier krijgt elk woord dat NU al groen staat er één, met zijn bestaande tijdstempel en
   ZONDER de dagteller te verhogen. `first` krijgt dezelfde behandeling, want die is nodig
   voor §38.2. Eén keer, gemarkeerd met SET.gfirstmig. */
(function migGfirst(){
  if(SET.gfirstmig) return;
  Object.keys(scores).forEach(function(k){
    const s=scores[k]; if(!s||!s.hist||!s.hist.length) return;
    if(!s.first) s.first=s.ts||1;                       /* oud woord: niet «vandaag nieuw» */
    if(!s.gfirst && bucket(s.ema)==='ok') s.gfirst=s.ts||s.first||1;
  });
  save('sos_scores_v6',scores);
  SET.gfirstmig=1; saveSet();
})();
/* toestand van een item voor de filterbalk */
function stateOf(it){ const s=getScore(it.id);
  if(!s||!s.hist||!s.hist.length) return isNext(it)?'weak':'new';
  return bucket(s.ema)==='ok'?'known':'weak'; }
const FCOLS=[
  {k:'db',    lb:'in db',  f:function(){return true;}},
  {k:'new',   lb:'TO DO',  f:function(x){return stateOf(x)==='new';}},
  {k:'act',   lb:'actief', f:function(x){return stateOf(x)!=='new';}},
  {k:'weak',  lb:'zwak',   f:function(x){return stateOf(x)==='weak';}},
  {k:'known', lb:'gekend', f:function(x){return stateOf(x)==='known';}},
  {k:'star',  lb:'starred',f:function(x){return FAV.has(x.id);}}
];
const FFN=k=>(FCOLS.find(c=>c.k===k)||FCOLS[0]).f;
/* v11.2 §29.5 — `auto`=true betekent: deze swipe komt uit de autoscroll.
   De score zelf verloopt exact zoals vroeger; enkel de dagteller krijgt er een aok/abad bij,
   en de autoscroll houdt een logboek bij zodat een hele reeks auto-fouten weer weg kan (§29.4). */
function applyScore(id,val,auto){
  const k=skey(id); let s=scores[k]||{ema:null,hist:[]};
  const before=bucket(s.ema);
  /* v11.3 §31.4 — eerste en laatste swipe, als VELDEN in het bestaande score-object */
  /* v11.5 §38.2 — `first` mag enkel «vandaag» worden voor een woord dat écht nog geen historiek
     had; anders zou een oud woord zonder `first` vandaag als vers meetellen in de ☀-teller. */
  const now=Date.now();
  if(!s.first) s.first=(s.hist&&s.hist.length)?1:now;
  s.ts=now;
  s.ema=(s.ema==null)?val:0.5*val+0.5*s.ema;
  s.hist.push(val); if(s.hist.length>8) s.hist=s.hist.slice(-8);
  scores[k]=s; save('sos_scores_v6',scores);
  bumpDay(val?'ok':'bad');
  if(auto) bumpDay(val?'aok':'abad');
  /* v11.3.1 §34.6 — «nieuw geleerd» telt een woord maar ÉÉN keer in zijn leven.
     Vroeger telde elke sprong naar groen mee; door de EMA sprong hetzelfde woord na
     één foute veeg opnieuw op groen, wat de teller flink opblies. */
  if(before!=='ok' && bucket(s.ema)==='ok' && !s.gfirst){ s.gfirst=now; bumpDay('new'); }
  syncPushSoon();
}

/* ===================== STATE ===================== */
let mode='voc';                       /* voc | gram | stats | search */
let deck=[], order={};
let revealed=new Set();
let hidden=new Set();   /* v10: individueel terug wazig gemaakt terwijl 'alles tonen' aan staat */               /* items waarvan het Noors al getoond is (sessie) */
let filters={own:false, missing:false};
let shuffleSeed=Math.random();
if(SET.dark) document.body.classList.add('dark');

/* ===================== SELECTIE ===================== */
function epsIsAll(){ return SET.eps==='all'; }
function epsSet(){ return SET.eps==='all'?null:new Set(SET.eps||[]); }
const THEME_CHIPS=()=>THEMES.filter(t=>t.id!=='basis');   /* 🔑 uit de rij gehaald */
function allThemeLabels(){ const s=new Set(); THEME_CHIPS().forEach(t=>t.labels.forEach(l=>s.add(l))); return s; }
function themeLabelSet(){
  const sel=SET.themes||[];
  if(sel.indexOf('__all')>=0) return allThemeLabels();
  const s=new Set(); sel.forEach(id=>{ const t=THEMES.find(x=>x.id===id); if(t) t.labels.forEach(l=>s.add(l)); }); return s;
}
const isSos=it=>it.src==='sos'||(it.episodes||[]).length>0;
const isBasis=it=>it.src==='sos'&&(it.episodes||[]).length===0;   /* fix v7: enkel SoS-basiswoorden */
/* v10: BRON-as (SoS · Nils · Somme · Jan), multi-select.
   Per gekozen bron geldt zijn eigen verfijning (S1-afleveringen / N1-hoofdstukken).
   Niets gekozen = alles. Thema's bestaan niet meer als as. */
const isNilsSrc =it=>it.src==='nils'||((it.nch||[]).length>0);
const isSommeSrc=it=>it.src==='somme';
const isJanSrc  =it=>!isSos(it)&&!isNilsSrc(it)&&!isSommeSrc(it);
const SRCDEF=[['sos','SoS',isSos],['nils','Nils',isNilsSrc],['somme','Somme',isSommeSrc],['jan','Jan',isJanSrc]];
function epsMatch(it){
  const all=epsIsAll(), set=epsSet(), basisOn=!!SET.basis;
  if(!all && !basisOn && !(set&&set.size)) return true;
  let ok=false;
  if(all) ok=ok||isSos(it);
  if(basisOn) ok=ok||isBasis(it);
  if(set&&set.size) ok=ok||(it.episodes||[]).some(n=>set.has(n));
  return ok;
}
function nchMatch(it){
  const sel=SET.nch||[]; if(!sel.length) return true;
  if(sel.indexOf('all')>=0) return (it.nch||[]).length>0;
  return (it.nch||[]).some(c=>sel.indexOf(c)>=0);
}
/* v11 §27.4 — binnen de bron Somme verfijnen op persoon */
const whoOf=it=>it.who||'johanne';
function whoMatch(it){ const sel=SET.who||[]; if(!sel.length) return true; return sel.indexOf(whoOf(it))>=0; }
function contentPass(it){
  const S=SET.src||[]; if(!S.length) return true;
  if(S.indexOf('sos')>=0   && isSos(it)       && epsMatch(it)) return true;
  if(S.indexOf('nils')>=0  && isNilsSrc(it)   && nchMatch(it)) return true;
  if(S.indexOf('somme')>=0 && isSommeSrc(it)  && whoMatch(it)) return true;
  if(S.indexOf('jan')>=0   && isJanSrc(it))                    return true;
  return false;
}

/* ===================== KAART ===================== */
function dots(arr){ return (arr||[]).map(v=>'<span class="dot '+(v?'ok':'bad')+'"></span>').join(''); }
function aggDot(id){ const s=getScore(id), bk=bucket(s&&s.ema);
  return bk?'<span class="agg" style="background:'+BUCKCOL[bk]+';border-color:var(--ring)"></span>':'<span class="agg"></span>'; }
function askCell(side){ return '<span class="note">'+(side==='nb'?'? — vraag partner':'? — vul aan')+'</span>'; }
/* v8: 4e kolom = bokmål-variant (leeg = geen verschil) */
function rowsOf(it){
  const rows=[], B=it.bm||{};
  if(it.type==='woord'){
    rows.push([hasNL(it)?it.hnl:askCell('nl'), hasNB(it)?it.hnb:askCell('nb'),'w', B.h||'']);
    (it.forms||[]).forEach(function(f,i){ rows.push([f[1],f[0],'f', f[2]||((B.f&&B.f[i])||'')]); });
    if(it.snb||it.snl) rows.push(['<span class="note">'+(it.snl||'')+'</span>','<span class="note">'+(it.snb||'')+'</span>','f',
      B.s?'<span class="note">'+B.s+'</span>':'']);
  } else {
    rows.push([hasNL(it)?it.nl:askCell('nl'), hasNB(it)?it.nb:askCell('nb'),'sent', B.nb||'']);
  }
  return rows;
}
function bmLine(t){ return (SET.showBM&&t)?'<span class="bm"><i>BM</i>'+t+'</span>':''; }
function cardHTML(it){
  const blur = SET.showAns ? hidden.has(it.id) : !revealed.has(it.id);
  const fav=FAV.has(it.id);
  const fl=new Set(FLUO[it.id]||[]);
  const ph=(it.phNB||it.ph||'')+((SET.showBM&&it.bm&&it.bm.ph)?'<span class="bmp"><i>BM</i>'+it.bm.ph+'</span>':'');
  const src = isSommeSrc(it)?'Somme':(it.src==='sos'?'SoS':(isNilsSrc(it)&&it.src==='nils'?'Nils':(isSos(it)?'SoS':(isNilsSrc(it)?'Nils':'Jan'))));
  let eps=(it.episodes&&it.episodes.length)?('S1E'+it.episodes.join(' · S1E')):'';
  if(it.nch&&it.nch.length){ const t='📘 '+it.nch.map(c=>'N1K'+c).join(' · ');
    eps=eps?(eps+' · '+t):t; }
  /* v11.10 §44.9 — welke kolom dicht gaat, hangt van de richting af. De score staat op
     dezelfde plaats als altijd (links bovenaan); bij NL? komt er een «←» vóór het bolletje,
     zodat je ziet dat je naar de andere score kijkt. De twee zijn nooit samen zichtbaar. */
  const rev=isRev();
  const hdr='<div class="chdr">'
    +'<div class="chalf scoreblk">'+(rev?'<span class="dirmark">←</span>':'')
      +aggDot(it.id)+'<span class="hist">'+dots((getScore(it.id)||{}).hist)+'</span></div>'
    +'<div class="chalf"><span class="pen" data-edit="'+it.id+'">✏️</span>'
      +'<div class="pho'+((blur&&!rev)?' blur':'')+'">'+ph+'</div></div>'
    +'</div>';
  const cells=rowsOf(it).map(function(r,i){
    const hl=rev?' hidecol':'', hb=rev?'':' hidecol';
    return '<div class="cell col-nl '+r[2]+hl+((rev&&blur)?' blur':'')+((rev&&fl.has(i))?' fluo':'')+'" data-row="'+i+'">'+r[0]+'</div>'
     +'<div class="cell col-nb '+r[2]+hb+((!rev&&blur)?' blur':'')+((!rev&&fl.has(i))?' fluo':'')+'" data-row="'+i+'">'+r[1]+bmLine(r[3])+'</div>'; }).join('');
  const note=corrOf(it)?('✏️ '+corrOf(it)):noteOf(it);
  const cmt=note?'<div class="cmt">💡 '+esc(note)+'</div>':'';
  /* v11.2 §29.6 — klein merkje zodat je ziet waarom een woord zónder score toch bij «zwak» staat */
  const nx=(isNext(it)&&isFresh(it))?'<span class="nx">next</span>':'';
  return '<div class="card'+(fav?' starred':'')+'" data-id="'+it.id+'">'+hdr
    +'<div class="grid">'+cells+'</div>'
    +'<div class="meta"><span class="src">'+src+'</span>'+nx+'<span class="eps">'+eps+'</span></div>'+cmt+'</div>';
}
function itemHTML(it){
  const fav=FAV.has(it.id);
  return '<div class="scrollcard" data-sc="'+it.id+'">'
    +'<div class="starwrap"><span class="star'+(fav?' on':'')+'" data-fav="'+it.id+'">'+(fav?'★':'☆')+'</span></div>'
    +'<div class="swwrap"><div class="swtint left"><b>✓</b></div><div class="swtint right"><b>✗</b></div>'+cardHTML(it)+'</div></div>';
}

/* v11.3.1 §34.6 — eenmalig: de opgeblazen historiek van «nieuw geleerd» op nul.
   Enkel het veld `new`; swipes, scores en al de rest blijven ongemoeid. */
(function resetNew(){ if(SET.newreset) return;
  Object.keys(DAILY).forEach(function(k){ if(DAILY[k]) DAILY[k].new=0; });
  saveDaily(); SET.newreset=1; saveSet(); })();

/* ===================== v11.3 — TRAIN (§31.6/§32.6) EN NIEUWE WOORDEN (§31.9) =====================
   Beide sets worden één keer per dag samengesteld en bewaard in de BESTAANDE sleutel sos_set_v6.
   Ze lopen live leeg: een woord verdwijnt zodra het vandaag geswipet is. */
function dayStart(){ const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function swipedToday(id){ const s=getScore(id); return !!(s&&s.ts&&s.ts>=dayStart()); }
/* ---- v11.6 §41.21/§41.22 · vandaag even niet ----
   Een tik op het bolletje van een nog niet gescoord item in ☀15 schuift dat item uit de dagset;
   het volgende in prioriteit komt in de plaats. Het item is NIET afgekeurd, enkel uitgesteld
   («vandaag nog niet relevant»), dus het mag morgen gewoon opnieuw voorgesteld worden.
   De uitstel-id's staan als NIEUW VELD in de BESTAANDE sleutel sos_set_v6: {id:dagnummer}.
   Oudere dagen worden bij het opstarten opgeruimd — ze gelden toch enkel voor hun eigen dag. */
if(!SET.daySkip || typeof SET.daySkip!=='object' || Array.isArray(SET.daySkip)) SET.daySkip={};
(function pruneDaySkip(){ const t=todayKey(); let n=0;
  Object.keys(SET.daySkip).forEach(function(k){ if(SET.daySkip[k]!==t){ delete SET.daySkip[k]; n++; } });
  if(n) saveSet(); })();
function daySkipped(id){ return SET.daySkip[id]===todayKey(); }
function trainN(){ return SET.trainn||50; }
function trainIds(){
  if(!SET.train || SET.train.d!==todayKey() || SET.train.n!==trainN()){
    const cand=ITEMS.filter(x=>x.type==='woord'&&stateOf(x)==='known');
    cand.sort(function(a,b){ return (((getScore(a.id)||{}).ts)||0)-(((getScore(b.id)||{}).ts)||0); });
    SET.train={d:todayKey(),n:trainN(),ids:cand.slice(0,trainN()).map(x=>x.id)}; saveSet();
  }
  return SET.train.ids||[];
}
function trainOpen(){ return trainIds().filter(id=>!swipedToday(id)); }
/* De nieuwe woorden van vandaag. Zodra de categorie «Home» bestaat (v11.4) komen ze daar als
   eerste uit; zolang die er niet is, vallen we terug op «next», dan Somme, dan de rest. */
/* v11.4 §36.3 — binnen «Home» telt de prioriteit mee: groep 1 (de eerste week) komt eerst,
   dan 2, dan 3. Zonder deze regel kwamen de nieuwe woorden in willekeurige volgorde. */
function newRank(x){ if(x.who==='home') return (x.prio||3)-1; if(isNext(x)) return 4; if(x.src==='somme') return 5; return 6; }
function newIds(){
  const n=SET.nperday||15;
  if(!SET.newday || SET.newday.d!==todayKey() || SET.newday.n!==n){
    /* v11.4 — de Home-lijst bestaat grotendeels uit hele zinnen («Maten e klar!»); die moeten
       ook door de gele knop kunnen komen, anders blijft de helft van Home onbereikbaar.
       Buiten Home blijft het bij losse woorden, zoals vroeger. */
    /* v11.6 §41.21 — wat je vandaag uit de dagset geschoven hebt, komt er vandaag niet in terug */
    const cand=ITEMS.filter(x=>isFresh(x)&&!daySkipped(x.id)&&(x.type==='woord'||x.who==='home'));
    cand.sort(function(a,b){ return (newRank(a)-newRank(b))||(orderKey(a)-orderKey(b)); });
    SET.newday={d:todayKey(),n:n,ids:cand.slice(0,n).map(x=>x.id)}; saveSet();
  }
  return (SET.newday.ids||[]).filter(id=>!daySkipped(id));
}
/* ---- v11.5 §38.2 · de ☀-teller telt ELK vers woord van vandaag ----
   Vroeger telde de knop enkel af als je precies de 15 vastgezette woorden veegde. JHS kiest
   soms zelf een ander vers woord in de algemene TO DO-lijst; dat telde niet mee. Nu is de
   teller «nog X van de N nieuwe woorden vandaag»: elk woord dat vandaag voor het eerst geveegd
   wordt (`first` van vandaag) telt, waar je het ook veegt. De dagset blijft als suggestie
   bestaan, maar schuift op — is ze uitgeput terwijl de teller nog loopt, dan vult ze aan. */
function freshToday(){ const d=dayStart(); let n=0;
  Object.keys(scores).forEach(function(k){ const s=scores[k];
    if(s&&s.first&&s.first>=d) n++; });
  return n; }
function newLeft(){ return Math.max(0,(SET.nperday||15)-freshToday()); }
function newOpen(){
  const left=newLeft(); if(left<=0) return [];
  let ids=newIds().filter(id=>!swipedToday(id));
  if(ids.length<left){                       /* suggesties op, teller nog niet → aanvullen */
    const have=new Set(ids);
    const extra=ITEMS.filter(x=>isFresh(x)&&!daySkipped(x.id)&&(x.type==='woord'||x.who==='home')&&!have.has(x.id))
                     .sort(function(a,b){ return (newRank(a)-newRank(b))||(orderKey(a)-orderKey(b)); });
    for(let i=0;i<extra.length&&ids.length<left;i++) ids.push(extra[i].id);
  }
  return ids.slice(0,left);
}
function pickIds(){ return SET.pick==='train'?trainOpen():(SET.pick==='new'?newOpen():[]); }
function setPick(v){ SET.pick=(SET.pick===v)?null:v; if(SET.pick) SET.fsel=null; saveSet();
  /* v11.7 §42.9 — een nieuwe selectie is een nieuwe beurt: de tellers in de balk beginnen opnieuw. */
  if(typeof asResetCount==='function') asResetCount();
  /* v11.7 §42.3 — enkel ☀15 (TO DO) blokkeert de autoscroll nog; ☀50 (train) mag hem wél.
     Sta je in de autoscroll wanneer je een geblokkeerde lijst kiest, dan val je zonder melding
     terug in de lijst. (§41.23 blokkeerde nog beide ☀-lijsten.) */
  if(typeof AS!=='undefined' && AS.on && asBlocked()){ asExit(); return; }
  mode='voc'; render(); $('stage').scrollTop=0; }

/* ===================== DECK ===================== */
const isMine=it=>it.src==='own'||!!it.mine;   /* v11: eigen toevoegingen kunnen nu ook src:'somme' hebben */
function applyFilters(list){
  if(filters.own)     list=list.filter(isMine);
  if(filters.missing) list=list.filter(missing);
  return list;
}
/* basis voor de filterbalk: inhoudskeuze + sheet-filters, nog ZONDER type/toestand */
function baseList(){ return applyFilters(ITEMS.filter(contentPass)); }
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;} return h/4294967296; }
function orderKey(it){ if(!(it.id in order)) order[it.id]=Math.sin((hashStr(it.id)+shuffleSeed)*99991)*.5+.5; return order[it.id]; }
function buildDeck(){
  /* v11.3 — train en «nieuw vandaag» staan los van de bron- en filterkeuze */
  if(SET.pick){ const st=new Set(pickIds());
    deck=ITEMS.filter(x=>st.has(x.id)).sort((a,b)=>orderKey(a)-orderKey(b)); return; }
  let list=baseList();
  if(SET.fsel){ const fn=FFN(SET.fsel.s), ts=SET.fsel.t;    /* §40.3 — wrd en zin kunnen samen aanstaan */
    list=list.filter(x=>ts.indexOf(x.type)>=0&&fn(x)); }
  else list=list.filter(x=>SET.types.indexOf(x.type)>=0);
  list.sort((a,b)=>orderKey(a)-orderKey(b));   /* altijd willekeurig; 🔀 = nieuwe schudbeurt */
  /* v11.4 §34.2 — binnen de autoscroll vallen de woorden met een groene bol uit de lijst.
     AS.hide is een BEVROREN lijst, gemaakt bij het opstarten van de autoscroll en bij elke
     nieuwe ronde: een woord dat tijdens het scrollen groen wordt, verdwijnt dus niet onder
     je neus. Buiten de autoscroll is AS.hide leeg → de lijst is weer volledig. */
  if(typeof AS!=='undefined' && AS.on && AS.hide && AS.hide.size){
    const kept=list.filter(x=>!AS.hide.has(x.id));
    if(kept.length) list=kept;                 /* nooit een leeg scherm achterlaten */
  }
  deck=list;
}

/* ===================== RENDER ===================== */
function render(){
  if(mode==='voc') renderList();
  else if(mode==='gram') renderGram();
  else if(mode==='stats') renderStats();
  renderPin();
  /* v11.10 §44.13 — in de beurtstand moet er altijd precies één kaart in focus staan */
  if(typeof turnFocus==='function') turnFocus();
}
/* v9: de lijst kan >1500 kaarten tellen → in blokken renderen, bijladen bij scrollen */
const PAGE=50; let shown=0;
function renderList(){
  buildDeck(); shown=0;
  let html='';
  if(!deck.length) html+='<div class="none">Geen items met deze keuze.<br>Pas je selectie of filter aan.</div>';
  /* v11.4 §34.4 — lege ruimte bóven de eerste kaart, zodat die in de autoscroll van achter
     de onderbalk komt opzetten in plaats van al halverwege het scherm te staan.
     Buiten de autoscroll is die ruimte 0 px hoog en verandert er dus niets. */
  $('stage').innerHTML=html+'<div id="astop" style="height:0"></div><div id="lst"></div><div id="asbot" style="height:0"></div>';
  appendMore();
  if(typeof AS!=='undefined' && AS.on && AS.lead) asApplyLead();   /* v11.5.1 — enkel bij echt spelen */
}
function appendMore(){
  const host=$('lst'); if(!host||shown>=deck.length) return;
  const start=host.children.length;
  host.insertAdjacentHTML('beforeend', deck.slice(shown,shown+PAGE).map(itemHTML).join(''));
  shown=Math.min(shown+PAGE,deck.length);
  const fresh=[].slice.call(host.children,start);
  requestAnimationFrame(function(){ fresh.forEach(function(c){ c.querySelectorAll('.cell.w,.cell.f').forEach(fit); }); });
  if(typeof AS!=='undefined' && AS.on) asRefreshCards();   /* v11: autoscroll kent de nieuwe kaarten */
}
/* v11.1 §28.5 — een treffer aanklikken deed niets: door de lazy rendering staan enkel de
   eerste 50 kaarten in de DOM, dus scrollIntoView() vond het kaartje niet. Nu wordt er
   bijgeladen tot het item gerenderd is, pas daarna scrollen. */
function revealCard(id){
  const i=deck.findIndex(function(x){ return x.id===id; });
  if(i<0) return false;
  let guard=0;
  while(shown<=i && guard++<400) appendMore();
  const el=[].slice.call(document.querySelectorAll('.card')).find(function(c){ return c.dataset.id===id; });
  if(!el) return false;
  el.scrollIntoView({block:'center'});
  requestAnimationFrame(function(){ renderTop(); });
  return true;
}
function renderGram(){
